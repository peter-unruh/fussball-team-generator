/* ============================================================
   RECHENKERN (sportneutral)

   Spielerwert heute = (Gesamtstärke + Effekt der Bedingungen) × Tagesform
   Teamstärke       = Feld + Tor + Duo-Bonus + Star-Effekt − Schwächere
     Feld = Σ Spielerwert × Spielzeitanteil − Verlust auf fremden Positionen
     Tor  = Torwartgewicht × (Zeit fester Torwart × Torwartwert + Restzeit × Ersatz)
   Unfairness U = gewichtete Summe von Strafpunkten (Stärkeabstand, Spitzenspieler,
   Fähigkeiten, Positionen, Wünsche, Merkmale, Unsichere, Teamgrößen, Ersatztorhüter,
   Wiederholung). U wählt nur die Aufteilung aus; von der Teamstärke wird nichts abgezogen.
   ============================================================ */
const Engine = (() => {
  const HARD = 100000;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const isNum = v => v !== null && v !== '' && v !== undefined && Number.isFinite(+v);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const wmean = (vals, w) => { let s = 0, t = 0; for (let k = 0; k < vals.length; k++) { s += vals[k] * w[k]; t += w[k]; } return t > 0 ? s / t : 0; };

  /* Effektive Werte eines Spielers. Fehlende Fähigkeiten zählen mit der groben Einschätzung.
     Ist „aus Fähigkeiten berechnen“ aktiv und mindestens eine bewertet, ist die Gesamtstärke
     das gewichtete Mittel aller (gefüllten) Fähigkeiten. */
  function effective(p, sport, attrWIn, autoDefault) {
    const manual = isNum(p.strength) ? clamp(+p.strength, 1, 15) : 5;
    const attrW = { ...sport.defaultAttrW, ...(attrWIn || {}) };
    const w = sport.attrs.map(a => Math.max(0, +attrW[a.key] || 0));
    const raw = p.attrs || {};
    let given = 0;
    const attrs = {};
    // Nicht bewertete Fähigkeiten: mit der groben Einschätzung – ist keine gesetzt (rated === false), mit dem
    // gewichteten Schnitt der bewerteten Fähigkeiten
    let rs = 0, rw = 0;
    sport.attrs.forEach((a, k) => { if (isNum(raw[a.key])) { rs += clamp(+raw[a.key], 1, 10) * w[k]; rw += w[k]; } });
    const gap = p.rated === false && rw > 0 ? rs / rw : manual;
    const filled = sport.attrs.map(a => {
      if (isNum(raw[a.key])) { given++; const v = clamp(+raw[a.key], 1, 10); attrs[a.key] = { v, est: false }; return v; }
      attrs[a.key] = { v: gap, est: true };
      return gap;
    });
    const wsum = w.reduce((s, x) => s + x, 0);
    const derived = given > 0 && wsum > 0 ? wmean(filled, w) : null;
    const autoOn = p.autoStrength == null ? !!autoDefault : !!p.autoStrength;
    const auto = autoOn && derived != null;
    return {
      strength: auto ? derived : manual, manual, derived, auto, autoOn, given, attrs, filled,
      gk: isNum(p.gk) ? { v: clamp(+p.gk, 1, 10), est: false } : { v: null, est: true }
    };
  }

  /* Bereitschaft fürs Tor; Nebenrolle Torwart zählt als „gern“. */
  function keeperWill(p, sport) {
    const w = sport.gkWill.find(g => g.key === p.gkWill) || sport.gkWill[0];
    return p.roleSub === 'GK' && w.rank < 2 ? sport.gkWill.find(g => g.rank === 2) : w;
  }
  /* Torwartwert ohne Tagesform: eingetragen oder aus Rolle und Bereitschaft geschätzt. */
  function keeperBase(p, sport) {
    return p.eff.gk.est ? (p.roleMain === 'GK' ? sport.gkMainEst : keeperWill(p, sport).est) : p.eff.gk.v;
  }

  function contextKeys(ctx, sport) {
    const keys = [];
    sport.context.forEach(c => { const v = ctx && ctx[c.key]; if (v) String(v).split('+').forEach(x => { if (x) keys.push(c.key + '.' + x); }); });
    if (ctx && ctx.subs) keys.push('subs.ja');
    return keys;
  }

  /* Gewichtung der Fähigkeiten unter den heutigen Bedingungen.
     Je Fähigkeit werden Anhebungen und Absenkungen getrennt abgestuft zusammengefasst: Die stärkste
     zählt voll, die zweitstärkste halb, die dritte ein Viertel (gerechnet in Faktoren, also
     multiplikativ). So zählt „Halle“ + „kleines Feld“ (beide heben Technik an) mehr als eines allein,
     aber weniger als beide voll multipliziert. Gegenläufige Bedingungen gleichen sich aus.
     Die eigene Anpassung des Spieltags wird zum Schluss multipliziert. */
  const CTX_DECAY = 0.5;
  function stackFactors(list) {
    // list: Faktoren in einer Richtung, stärkste Wirkung zuerst
    let lg = 0;
    list.forEach((f, k) => { lg += Math.log(f) * Math.pow(CTX_DECAY, k); });
    return Math.exp(lg);
  }
  function combineContext(ctx, profiles, adjust, sport) {
    const m = {};
    const keys = contextKeys(ctx, sport);
    sport.attrs.forEach(a => {
      const ups = [], downs = [];
      keys.forEach(k => {
        const f = profiles && profiles[k] ? profiles[k][a.key] : null;
        if (!isNum(f) || +f <= 0) return;
        if (+f > 1) ups.push(+f); else if (+f < 1) downs.push(+f);
      });
      ups.sort((x, y) => y - x); downs.sort((x, y) => x - y);
      let v = stackFactors(ups) * stackFactors(downs);
      if (adjust && isNum(adjust[a.key])) v *= +adjust[a.key];
      m[a.key] = clamp(v, 0.3, 3);
    });
    return m;
  }

  /* Heutiger Wert. Die Bedingungen verschieben nur das Verhältnis der Fähigkeiten zueinander:
     Wer überall gleich bewertet ist (oder gar keine Fähigkeiten hat), bleibt unverändert. */
  function playerToday(e, mult, sport, attrWIn, formF) {
    const attrW = { ...sport.defaultAttrW, ...(attrWIn || {}) };
    let shift = 0;
    if (e.given > 0) {
      const wB = sport.attrs.map(a => Math.max(0, +attrW[a.key] || 0));
      const wC = sport.attrs.map((a, k) => wB[k] * mult[a.key]);
      shift = clamp(wmean(e.filled, wC) - wmean(e.filled, wB), -3, 3);
    }
    return { base: e.strength, shift, form: formF, v: Math.max(0.5, (e.strength + shift) * formF) };
  }

  /* Eignung je Feldposition (1 = volle Stärke). */
  function fitsOf(p, today, fitIn, sport) {
    const fit = { main: 1, ...sport.defaultFit, ...(fitIn || {}) };
    const ov = p.posFit || {};
    let main = today && today !== 'GK' ? today : (p.roleMain || 'FLEX');
    let sub = today ? '' : (p.roleSub || '');
    if (main === 'GK') { main = sub && sub !== 'GK' ? sub : 'FLEX'; sub = ''; }
    const out = {};
    sport.fieldRoles.forEach(r => {
      let f;
      if (today && today !== 'GK' && r === today) f = fit.main;
      else if (isNum(ov[r])) f = +ov[r];
      else if (main === 'FLEX') f = fit.flex;
      else if (r === main) f = fit.main;
      else if (r === sub) f = fit.sub;
      else f = fit.other;
      out[r] = clamp(+f, 0, 1.2);
    });
    return out;
  }

  /* Torwartgewicht „automatisch“: je weniger Feldspieler, desto mehr zählt der Torwart.
     4 Feldspieler (5 gegen 5) → 1,5 · 6 → 1,33 · 10 (11 gegen 11) → 1,2 */
  function autoGkWeight(fieldSlots) { return clamp(1 + 2 / Math.max(1, fieldSlots), 1.1, 1.6); }

  /* Größtes erlaubtes Team bei n Spielern, T Teams und erlaubtem Größenunterschied. */
  function maxTeamSize(n, T, maxDiff) {
    let s = n;
    while (s > 1 && s + (T - 1) * Math.max(1, s - maxDiff) > n) s--;
    return s;
  }
  /* Gewicht zusätzlicher Spieler in Überzahl: ab 100 % linear, darunter zählt jeder weitere weniger. */
  function extraWeight(e, s) {
    if (e <= 0) return 0;
    if (s >= 1) return s * e;
    if (s <= 0) return 0;
    return s * (1 - Math.pow(s, e)) / (1 - s);
  }

  /* ---------- Modell aufbauen ---------- */
  function prepare(inp, sport) {
    const T = inp.T | 0;
    const players = inp.players || [];
    const n = players.length;
    const A = sport.attrs, D = A.length, FR = sport.fieldRoles, NR = FR.length;
    const W = { ...MODEL_DEFAULTS.profiles.balanced.w, ...(inp.w || {}) };
    const TM = { ...MODEL_DEFAULTS.team, ...(inp.team || {}) };
    const attrW = { ...sport.defaultAttrW, ...(inp.attrW || {}) };
    const formPct = { ...sport.formDefaults, ...(inp.forms || {}) };
    const form = inp.form || {}, roleToday = inp.roleToday || {}, pins = inp.pins || {};
    const pause = inp.pause || {}, gkShareIn = inp.gkShare || {};
    const cap = inp.cap > 0 ? inp.cap | 0 : 0;
    const maxDiff = Math.max(1, (inp.maxDiff | 0) || 1);
    const M = { T, n, D, NR, sport, cap, maxDiff, errors: [], W, TM, attrW, ids: players.map(p => p.id) };
    M.idx = new Map(M.ids.map((id, i) => [id, i]));

    if (T < 2) { M.errors.push({ msg: 'Es braucht mindestens 2 Teams.', rules: [] }); return M; }
    if (n < T) { M.errors.push({ msg: `Für ${T} Teams braucht es mindestens ${T} Spieler; angekreuzt ${n === 1 ? 'ist 1' : `sind ${n}`}.`, rules: [] }); return M; }

    const willOf = p => keeperWill(p, sport);
    // Tagesform; dazu Müdigkeit, wenn das Team direkt vorher gespielt hat (nur in der Auswertung einzelner Spiele)
    const formF = id => (1 + (+formPct[form[id] || 'normal'] || 0) / 100) * (inp.tired && inp.tired[id] ? 1 + (+inp.tiredPct || 0) / 100 : 1);
    // Feste Torhüter: heute im Tor (Vorrang) oder Hauptrolle Torwart, sofern heute keine Feldrolle gesetzt ist
    const keeperPrio = p => { const rt = roleToday[p.id]; if (rt) return rt === 'GK' ? 2 : 0; return p.roleMain === 'GK' ? 1 : 0; };
    const gkRaw = p => keeperBase(p, sport);

    const keepers = players.filter(p => keeperPrio(p) > 0).sort((a, b) =>
      keeperPrio(b) - keeperPrio(a) || gkRaw(b) - gkRaw(a) || String(a.name).localeCompare(String(b.name)));
    const inGoal = keepers.slice(0, T), fieldKeepers = keepers.slice(T);
    M.K = keepers.length;
    M.mode = M.K === 0 ? 'none' : M.K < T ? 'partial' : 'full';
    M.goalIds = inGoal.map(p => p.id);
    M.fieldKeepers = fieldKeepers.map(p => p.id);
    M.keeperWish = fieldKeepers.filter(p => keeperPrio(p) === 2).map(p => p.id);

    // Torhüter auf die Tore verteilen: fixierte zuerst in ihr Team, die übrigen in freie Teams
    const goalTeam = new Map(), taken = new Set();
    inGoal.forEach(p => {
      const t = pins[p.id];
      if (Number.isInteger(t) && t >= 0 && t < T) {
        if (taken.has(t)) M.errors.push({ msg: `Zwei Torhüter sind im selben Team fixiert (${p.name}).`, rules: [] });
        else { goalTeam.set(p.id, t); taken.add(t); }
      }
    });
    let nextFree = 0;
    inGoal.forEach(p => {
      if (goalTeam.has(p.id)) return;
      while (taken.has(nextFree)) nextFree++;
      goalTeam.set(p.id, nextFree); taken.add(nextFree);
    });

    M.lo = Math.floor(n / T);
    M.hi = Math.ceil(n / T);
    M.maxUnit = maxTeamSize(n, T, maxDiff);
    M.subs = cap > 0 && M.hi > cap;
    M.ctx = { ...(inp.ctx || {}), subs: M.subs };
    M.mult = combineContext(M.ctx, inp.profiles || sport.defaultProfiles, inp.adjust, sport);
    const typical = cap > 0 ? Math.min(cap, Math.round(n / T)) : Math.round(n / T);
    M.gkW = TM.gk === 'auto' || !isNum(TM.gk) ? autoGkWeight(typical - 1) : Math.max(0, +TM.gk);
    M.gkBonus = isNum(TM.gkBonus) ? +TM.gkBonus : 1;
    M.gkRule = inp.gkRule || MODEL_DEFAULTS.gkRule;
    M.posMin = isNum(inp.posMin) ? +inp.posMin : MODEL_DEFAULTS.posMin;

    const fitCfg = { main: 1, ...sport.defaultFit, ...(inp.fit || {}) };
    const mixRaw = { ...sport.defaultMix, ...(inp.mix || {}) };
    const mixTot = FR.reduce((s, r) => s + Math.max(0, +mixRaw[r] || 0), 0);
    const mixScale = mixTot > 100 ? 100 / mixTot : 1;
    M.mix = new Float64Array(FR.map(r => Math.max(0, +mixRaw[r] || 0) * mixScale / 100));

    const F64 = () => new Float64Array(n), U8 = () => new Uint8Array(n);
    Object.assign(M, {
      v: F64(), base: F64(), shift: F64(), form: F64(), abs: new Float64Array(n * D), goal: U8(), gkv: F64(), gsd: F64(),
      sd: F64(), star: F64(), weak: F64(), uns: U8(), thru: U8(), pw: new Float64Array(n).fill(1), gShare: new Float64Array(n).fill(1),
      will: U8(), rDef: F64(), rAtt: F64(), flex: F64(), fit: new Float64Array(n * NR), pref: new Int8Array(n).fill(-1),
      forced: new Int8Array(n).fill(-1), fix: new Int8Array(n).fill(-1), dimHasData: new Uint8Array(D), role: []
    });
    M.posModel = false;
    const [roleA, roleB] = sport.balancedRoles;

    players.forEach((p, i) => {
      const f = formF(p.id), e = p.eff;
      A.forEach((a, d) => { const at = e.attrs[a.key]; M.abs[i * D + d] = at.v * f; if (!at.est) M.dimHasData[d] = 1; });
      const pt = playerToday(e, M.mult, sport, attrW, f);
      M.base[i] = pt.base; M.shift[i] = pt.shift; M.form[i] = f; M.v[i] = pt.v;
      M.sd[i] = isNum(p.sd) ? +p.sd : 0.8;
      M.uns[i] = p.unsure ? 1 : 0;
      M.will[i] = willOf(p).rank;
      M.gkv[i] = gkRaw(p) * f;
      M.gsd[i] = e.gk.est ? 1.2 : 0.8;

      const rt = roleToday[p.id];
      const fits = fitsOf(p, rt, fitCfg, sport);
      let bi = 0, bv = -1, lo = 9;
      FR.forEach((r, k) => {
        const v = fits[r]; M.fit[i * NR + k] = v;
        if (v > bv + 1e-9) { bv = v; bi = k; }
        if (v < lo) lo = v;
        if (v < 0.999) M.posModel = true;
      });
      M.pref[i] = bv - lo > 0.001 ? bi : -1;
      if (rt && FR.includes(rt)) { M.forced[i] = FR.indexOf(rt); M.pref[i] = M.forced[i]; }

      const pz = pause[p.id] || (goalTeam.has(p.id) ? 'through' : 'normal');
      if (pz === 'through') M.thru[i] = 1;
      else if (pz === 'more') M.pw[i] = clamp(+TM.more || 0.5, 0.05, 1);

      // Feldrolle – auch für feste Torhüter, falls einer manuell als zweiter Torwart in ein Team gerät
      // und dort im Feld spielt (siehe evaluate)
      let r = rt && rt !== 'GK' ? rt : (p.roleMain || 'FLEX');
      if (r === 'GK') r = p.roleSub && p.roleSub !== 'GK' ? p.roleSub : 'FLEX';
      const sub = rt ? '' : (p.roleSub && p.roleSub !== 'GK' && p.roleSub !== r ? p.roleSub : '');
      const wMain = sub ? 0.7 : 1;
      M.rDef[i] = (r === roleA ? wMain : 0) + (sub === roleA ? 0.3 : 0);
      M.rAtt[i] = (r === roleB ? wMain : 0) + (sub === roleB ? 0.3 : 0);
      M.flex[i] = (sport.fillValue[r] || 0) * wMain + (sub ? (sport.fillValue[sub] || 0) * 0.3 : 0);
      M.role[i] = r;
      if (goalTeam.has(p.id)) {
        M.goal[i] = 1; M.fix[i] = goalTeam.get(p.id);
        M.gShare[i] = isNum(gkShareIn[p.id]) ? clamp(+gkShareIn[p.id], 0, 1) : 1;
        M.role[i] = 'GK';
      }
    });

    // Star-Effekt und Schwächere: relativ zum Schnitt der anwesenden Feldspieler
    let sum = 0, cnt = 0;
    for (let i = 0; i < n; i++) if (!M.goal[i]) { sum += M.v[i]; cnt++; }
    M.mu = cnt ? sum / cnt : 5;
    for (let i = 0; i < n; i++) {
      const up = Math.max(0, M.v[i] - M.mu), dn = Math.max(0, M.mu - M.v[i]);
      M.star[i] = up * up / 4; M.weak[i] = dn * dn / 4;
    }
    M.unsTot = 0;
    for (let i = 0; i < n; i++) M.unsTot += M.uns[i];

    // Merkmale
    const tagsOff = new Set(inp.tagsOff || []);
    const tagMap = new Map();
    M.tagsOf = players.map(p => {
      const out = [];
      (p.tags || []).forEach(t => {
        if (tagsOff.has(t)) return;
        if (!tagMap.has(t)) tagMap.set(t, tagMap.size);
        const k = tagMap.get(t);
        if (!out.includes(k)) out.push(k);
      });
      return out;
    });
    M.tagNames = [...tagMap.keys()];
    M.NT = tagMap.size;
    M.tagTot = new Int32Array(M.NT);
    M.tagsOf.forEach(l => l.forEach(k => M.tagTot[k]++));

    // Gewicht je Fähigkeit beim Ausgleichen: nur Fähigkeiten, die bei mindestens einem Spieler bewertet sind
    M.dw = A.map((a, d) => (M.dimHasData[d] ? W.attr * (+attrW[a.key] || 0) * M.mult[a.key] : 0));
    M.posActive = false;
    for (let i = 0; i < n; i++) if (!M.goal[i] && (M.rDef[i] > 0 || M.rAtt[i] > 0)) { M.posActive = true; break; }

    // Regeln
    M.rules = [];
    (inp.rules || []).forEach(r => {
      if (!M.idx.has(r.a) || !M.idx.has(r.b) || r.a === r.b) return;
      const type = r.type === 'apart' || r.type === 'duo' ? r.type : 'together';
      M.rules.push({ id: r.id, type, hard: !!r.hard && type !== 'duo', bonus: isNum(r.bonus) ? +r.bonus : 0, w: isNum(r.prio) && +r.prio > 0 ? +r.prio : 1, i: M.idx.get(r.a), j: M.idx.get(r.b) });
    });
    M.softRules = M.rules.filter(r => !r.hard && r.type !== 'duo').length;

    // Fixierte Feldspieler
    for (const id in pins) {
      const t = pins[id];
      if (!M.idx.has(id) || !Number.isInteger(t) || t < 0 || t >= T) continue;
      const i = M.idx.get(id);
      if (!M.goal[i]) M.fix[i] = t;
    }

    // Einheiten: Pflichtregeln „zusammen“ verbinden Spieler zu Gruppen, die gemeinsam verschoben werden
    const parent = [...Array(n).keys()];
    const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    M.rules.forEach(r => { if (r.hard && r.type === 'together') parent[find(r.i)] = find(r.j); });
    const groups = new Map();
    for (let i = 0; i < n; i++) { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(i); }
    M.units = [...groups.values()].map(members => ({ members, fix: -1 }));
    M.unitOf = new Int32Array(n);
    M.units.forEach((u, k) => u.members.forEach(i => { M.unitOf[i] = k; }));
    const unitRules = u => M.rules.filter(r => r.hard && r.type === 'together' && u.members.includes(r.i)).map(r => r.id);
    M.units.forEach(u => {
      const fixes = [...new Set(u.members.map(i => M.fix[i]).filter(t => t >= 0))];
      if (fixes.length > 1) {
        const gks = u.members.filter(i => M.goal[i]).length;
        M.errors.push({
          msg: gks > 1 ? 'Eine Pflichtregel „zusammen“ verbindet zwei Torhüter. Pro Team steht aber nur einer im Tor.'
            : 'Spieler, die laut Pflichtregel zusammen spielen, sind in verschiedenen Teams fixiert.',
          rules: unitRules(u)
        });
      } else if (fixes.length === 1) u.fix = fixes[0];
      if (u.members.length > M.maxUnit) {
        M.errors.push({ msg: `Pflichtregeln „zusammen“ bilden eine Gruppe aus ${u.members.length} Spielern. Bei ${n} Spielern und ${T} Teams passen höchstens ${M.maxUnit} in ein Team.`, rules: unitRules(u) });
      }
    });
    M.rules.forEach(r => {
      if (!(r.hard && r.type === 'apart')) return;
      const ui = M.units[M.unitOf[r.i]], uj = M.units[M.unitOf[r.j]];
      if (ui === uj) M.errors.push({ msg: 'Eine Pflichtregel „getrennt“ widerspricht Pflichtregeln „zusammen“.', rules: [r.id, ...unitRules(ui)] });
      else if (ui.fix >= 0 && ui.fix === uj.fix) M.errors.push({ msg: 'Zwei Spieler, die laut Pflichtregel getrennt spielen, sind im selben Team fixiert.', rules: [r.id] });
    });
    const fixedCount = new Int32Array(T);
    M.units.forEach(u => { if (u.fix >= 0) fixedCount[u.fix] += u.members.length; });
    for (let t = 0; t < T; t++) if (fixedCount[t] > M.maxUnit) M.errors.push({ msg: `In einem Team sind ${fixedCount[t]} Spieler fixiert, erlaubt sind höchstens ${M.maxUnit}.`, rules: [] });
    M.freeUnits = M.units.map((u, k) => (u.fix < 0 ? k : -1)).filter(k => k >= 0);
    M.fixedTeams = new Uint8Array(T);
    M.units.forEach(u => { if (u.fix >= 0) M.fixedTeams[u.fix] = 1; });

    // Abwechslung: wie oft zwei Spieler an früheren Spieltagen im selben Team waren (jüngere zählen mehr)
    M.varyOn = false;
    const hist = Array.isArray(inp.history) ? inp.history : [];
    if (W.vary > 0 && hist.length) {
      M.pair = new Float32Array(n * n);
      let norm = 0;
      hist.forEach((g, k) => {
        const dec = Math.pow(0.6, k);
        let any = false;
        (g.teams || []).forEach(ids => {
          const ix = ids.map(id => M.idx.get(id)).filter(i => i != null);
          for (let x = 0; x < ix.length; x++) for (let y = x + 1; y < ix.length; y++) {
            M.pair[ix[x] * n + ix[y]] += dec; M.pair[ix[y] * n + ix[x]] += dec; any = true;
          }
        });
        if (any) norm += dec;
      });
      if (norm > 0) { M.varyOn = true; M.pairNorm = norm; M.histGames = hist.length; }
    }

    const I32 = k => new Int32Array(k), F = k => new Float64Array(k);
    M.sc = {
      sz: I32(T), gk: I32(T), fc: I32(T), st: F(T), at: F(T * D), df: F(T), ak: F(T), fx: F(T), tg: I32(Math.max(1, T * M.NT)), un: I32(T),
      mem: I32(T * n), memN: I32(T), shr: F(n), lI: I32(n + 1), lA: F(n + 1), open: I32(n + 1),
      used: F(T), pool: F(T), tf: F(T), gkS: F(T), rotV: F(T), rotI: I32(T), rotN: I32(T), occ: F(T), cR: I32(T), cG: I32(T),
      fsum: F(T), starP: F(T), weakP: F(T), effF: F(T), ploss: F(T), fieldV: F(T), goalV: F(T), duoV: F(T), val: F(T), pitch: I32(T),
      asg: new Int8Array(n), sup: F(NR), need: F(NR), occI: F(n), inGoal: F(n)
    };
    return M;
  }

  /* ---------- Positionen ----------
     Erzwungene Positionen (Rolle heute) stehen fest, sonst spielt jeder seine beste Position;
     Flexible füllen Lücken. Fehlt danach einer Position mehr als ein halber Platz zur
     Mindestbesetzung, rückt der Spieler nach, bei dem es am wenigsten Stärke kostet.
     Jeder zählt mit seiner eigenen Feldzeit (Wechsler, Pausen, Teilzeit im Tor). Ein fester
     Torwart, der einen Teil der Zeit im Feld spielt, zählt mit diesem Anteil mit.
     Rückgabe: Stärkeverlust auf Positionen, die Spielern weniger liegen. */
  function positionLoss(M, t, used) {
    const sc = M.sc, NR = M.NR, n = M.n, base = t * n, m = sc.memN[t];
    const { mem, asg, sup, need, shr, lI } = sc;
    if (!m || used <= 0) return 0;
    // Wer spielt im Feld: Feldspieler und ggf. der feste Torwart mit seiner Feldzeit
    let cnt = 0;
    for (let k = 0; k < m; k++) lI[cnt++] = mem[base + k];
    const gi = sc.gk[t];
    if (gi >= 0 && shr[gi] > 1e-6) lI[cnt++] = gi;
    for (let r = 0; r < NR; r++) { sup[r] = 0; need[r] = used * M.mix[r]; }
    let tot = 0, nP = 0;
    for (let k = 0; k < cnt; k++) {
      const i = lI[k], sh = shr[i];
      if (sh < 1e-6) { asg[i] = -3; continue; }   // die ganze Zeit im Tor
      const r = M.forced[i] >= 0 ? M.forced[i] : M.pref[i];
      asg[i] = r;
      if (r >= 0) sup[r] += sh;
      tot += sh; nP++;
    }
    for (let k = 0; k < cnt; k++) {
      const i = lI[k];
      if (asg[i] !== -1) continue;
      let br = 0, bs = -1e9;
      for (let r = 0; r < NR; r++) { const s = (need[r] - sup[r]) + M.fit[i * NR + r] * 0.01 + (r === 1 ? 0.001 : 0); if (s > bs) { bs = s; br = r; } }
      asg[i] = br; sup[br] += shr[i];
    }
    const half = nP ? 0.5 * tot / nP : 0;
    for (let it = 0; it < cnt; it++) {
      let rs = -1, short = half;
      for (let r = 0; r < NR; r++) { const s = need[r] - sup[r]; if (s > short) { short = s; rs = r; } }
      if (rs < 0) break;
      let bi = -1, bc = 1e9;
      for (let k = 0; k < cnt; k++) {
        const i = lI[k], r = asg[i];
        if (r < 0 || r === rs || M.forced[i] >= 0 || sup[r] - need[r] < half) continue;
        const c = M.v[i] * shr[i] * (M.fit[i * NR + r] - M.fit[i * NR + rs]);
        if (c < bc) { bc = c; bi = i; }
      }
      if (bi < 0) break;
      sup[asg[bi]] -= shr[bi]; asg[bi] = rs; sup[rs] += shr[bi];
    }
    let loss = 0;
    for (let k = 0; k < cnt; k++) { const i = lI[k]; if (asg[i] >= 0) loss += M.v[i] * shr[i] * (1 - M.fit[i * NR + asg[i]]); }
    return loss;
  }

  /* ---------- Spielzeit und Tor eines Teams ----------
     Das Tor ist ein Platz. Steht kein fester Torwart (oder nur einen Teil der Zeit) drin, übernehmen
     die übrige Torzeit die Spieler nach der Regel „Ohne festen Torwart“: abwechselnd alle, die ins Tor
     können (bzw. nur wer gern geht), oder einer bleibt drin. Genau diese Spieler fehlen dafür im Feld –
     alle anderen spielen ihre volle Feldzeit. Kann niemand ins Tor, wechseln sich alle ab. */
  function teamTime(M, t) {
    const sc = M.sc, n = M.n, base = t * n, TM = M.TM;
    const { mem, memN, shr, lI, lA, open, occI } = sc;
    const nt = sc.sz[t];
    const subs = M.cap > 0 && nt > M.cap;
    const onP = subs ? M.cap : nt;
    sc.pitch[t] = onP;
    const slotsF = Math.max(0, onP - 1);   // ein Platz ist das Tor

    // Wer aus dem Feld ins Tor kann
    let sR = 0, cR = 0, sG = 0, cG = 0, sA = 0, cA = 0, bR = -1, bRv = -1, bA = -1, bAv = -1;
    for (let k = 0; k < memN[t]; k++) {
      const i = mem[base + k], g = M.gkv[i];
      sA += g; cA++; if (g > bAv) { bAv = g; bA = i; }
      if (M.will[i] >= 1) { sR += g; cR++; if (g > bRv) { bRv = g; bR = i; } }
      if (M.will[i] >= 2) { sG += g; cG++; }
    }
    sc.cR[t] = cR; sc.cG[t] = cG;

    const gi = sc.gk[t];
    let s = 0, keeperV = 0, kAvail = 0;
    if (gi >= 0) {
      const plays = M.thru[gi] || !subs ? 1 : Math.min(1, M.cap / nt * M.pw[gi]);
      s = M.gShare[gi] * plays;
      keeperV = M.gkv[gi] * M.gkBonus;
      kAvail = (1 - M.gShare[gi]) * plays;
      occI[gi] = 0;
    }
    const openT = Math.max(0, 1 - s);   // Torzeit, die aus dem Feld besetzt wird

    // Wer die übrige Torzeit übernimmt (rotSet: 3 = einer bleibt drin, 2 = nur „gern“, 1 = alle Bereiten, 0 = alle)
    let rot, rotSet, rIdx = -1;
    if (M.gkRule === 'best') { if (bR < 0) { bR = bA; bRv = bAv; } rot = bR >= 0 ? bRv : 2; rIdx = bR; rotSet = 3; }
    else if (M.gkRule === 'likes' && cG) { rot = sG / cG; rotSet = 2; }
    else if (cR) { rot = sR / cR; rotSet = 1; }
    else { rot = cA ? sA / cA : 2; rotSet = 0; }
    const nRot = rotSet === 3 ? (rIdx >= 0 ? 1 : 0) : rotSet === 2 ? cG : rotSet === 1 ? cR : cA;
    const each = openT > 1e-6 && nRot ? openT / nRot : 0;
    let single = -1;
    for (let k = 0; k < memN[t]; k++) {
      const i = mem[base + k];
      const inRot = rotSet === 3 ? i === rIdx : rotSet === 2 ? M.will[i] >= 2 : rotSet === 1 ? M.will[i] >= 1 : true;
      occI[i] = inRot ? each : 0;
      if (inRot && nRot === 1) single = i;
    }
    sc.gkS[t] = s;
    sc.rotV[t] = rot;
    sc.rotN[t] = openT > 1e-6 ? nRot : 0;
    sc.rotI[t] = openT > 1e-6 ? single : -1;
    sc.occ[t] = sc.rotI[t] >= 0 ? openT : 0;
    sc.goalV[t] = M.gkW * (s * keeperV + openT * rot);

    // Feldzeit: Verfügbarkeit je Spieler (abzüglich der eigenen Zeit im Tor)
    let cnt = 0, avail = 0;
    for (let k = 0; k < memN[t]; k++) {
      const i = mem[base + k];
      lI[cnt] = i; lA[cnt] = Math.max(0, 1 - occI[i]); avail += lA[cnt]; cnt++;
    }
    if (gi >= 0 && kAvail > 0) { lI[cnt] = gi; lA[cnt] = kAvail; avail += kAvail; cnt++; }
    for (let k = 0; k < cnt; k++) shr[lI[k]] = 0;
    if (gi >= 0 && kAvail <= 0) shr[gi] = 0;

    let used;
    if (avail <= slotsF + 1e-9) {
      for (let k = 0; k < cnt; k++) shr[lI[k]] = lA[k];
      used = avail;
    } else if (!subs) {
      // keine Wechsler, aber mehr Spieler als Feldplätze (z. B. alle wechseln sich im Tor ab): gleichmäßig
      const c = slotsF / avail;
      for (let k = 0; k < cnt; k++) shr[lI[k]] = lA[k] * c;
      used = slotsF;
    } else {
      // Wechsler: „spielt durch“ zuerst, der Rest teilt sich die Plätze nach Pausengewicht (Wasserfüllung)
      let thru = 0;
      for (let k = 0; k < cnt; k++) if (M.thru[lI[k]]) thru += lA[k];
      if (thru >= slotsF) {
        const c = thru > 0 ? slotsF / thru : 0;
        for (let k = 0; k < cnt; k++) if (M.thru[lI[k]]) shr[lI[k]] = lA[k] * c;
      } else {
        let R = slotsF - thru, no = 0;
        for (let k = 0; k < cnt; k++) { if (M.thru[lI[k]]) shr[lI[k]] = lA[k]; else open[no++] = k; }
        while (no > 0) {
          let wsum = 0;
          for (let q = 0; q < no; q++) { const k = open[q]; wsum += lA[k] * M.pw[lI[k]]; }
          if (wsum <= 0) break;
          const c = R / wsum;
          let keep = 0, capped = false;
          for (let q = 0; q < no; q++) {
            const k = open[q], i = lI[k];
            if (c * M.pw[i] >= 1) { shr[i] = lA[k]; R -= lA[k]; capped = true; } else open[keep++] = k;
          }
          no = keep;
          if (!capped) { for (let q = 0; q < no; q++) { const k = open[q], i = lI[k]; shr[i] = c * M.pw[i] * lA[k]; } break; }
        }
      }
      used = slotsF;
    }
    sc.used[t] = used;
    sc.pool[t] = avail;
    sc.tf[t] = avail > 0 ? used / avail : 0;

    let fs = 0, stp = 0, wkp = 0;
    for (let k = 0; k < cnt; k++) {
      const i = lI[k], sh = shr[i];
      fs += sh * M.v[i];
      stp += sh * TM.star * M.star[i]; wkp += sh * TM.weak * M.weak[i];
    }
    sc.fsum[t] = fs; sc.starP[t] = stp; sc.weakP[t] = wkp;
  }

  /* ---------- Bewertung einer Aufteilung a (a[i] = Teamindex) ---------- */
  function evaluate(M, a, detail) {
    const { T, n, D, NT, W, sc } = M;
    const { sz, gk, fc, st, at, df, ak, fx, tg, un, mem, memN, used, tf, val } = sc;
    sz.fill(0); gk.fill(-1); fc.fill(0); st.fill(0); at.fill(0); df.fill(0); ak.fill(0); fx.fill(0); tg.fill(0); un.fill(0); memN.fill(0);
    sc.duoV.fill(0); sc.ploss.fill(0);
    let hard = 0;
    const hardList = detail ? [] : null;
    const addHard = (k, msg) => { hard += k; if (hardList) hardList.push(msg); };

    // Feste Torhüter: je Team steht der mit dem höchsten Torwartwert im Tor. Gerät (z. B. von Hand)
    // ein zweiter ins selbe Team, spielt er dort im Feld – mit Feldrolle, Fähigkeiten und Spielzeit.
    for (let i = 0; i < n; i++) {
      const t = a[i];
      if (!M.goal[i] || t < 0 || t >= T) continue;
      if (gk[t] < 0 || M.gkv[i] > M.gkv[gk[t]]) gk[t] = i;
    }
    for (let i = 0; i < n; i++) {
      const t = a[i];
      if (t < 0 || t >= T) { addHard(1, 'Ein Spieler ist keinem Team zugeordnet.'); continue; }
      sz[t]++;
      un[t] += M.uns[i];
      const tl = M.tagsOf[i];
      for (let k = 0; k < tl.length; k++) tg[t * NT + tl[k]]++;
      if (M.goal[i]) {
        if (gk[t] === i) continue;
        addHard(1, 'Zwei feste Torhüter im selben Team.');
      }
      fc[t]++; st[t] += M.star[i];
      mem[t * n + memN[t]++] = i;
      const o = t * D, p = i * D;
      for (let d = 0; d < D; d++) at[o + d] += M.abs[p + d];
      df[t] += M.rDef[i]; ak[t] += M.rAtt[i]; fx[t] += M.flex[i];
    }
    let mxSz = -1, mnSz = 1e9;
    for (let t = 0; t < T; t++) { if (sz[t] > mxSz) mxSz = sz[t]; if (sz[t] < mnSz) mnSz = sz[t]; }
    if (mnSz < 1) addHard(1, 'Ein Team hat keine Spieler.');
    if (mxSz - mnSz > M.maxDiff) addHard(mxSz - mnSz - M.maxDiff, `Die Teamgrößen unterscheiden sich um mehr als ${M.maxDiff}.`);
    if (M.mode === 'full') for (let t = 0; t < T; t++) if (gk[t] < 0) addHard(1, 'Ein Team hat keinen festen Torwart.');

    // 1. Spielzeit, Tor und Feldanteil je Team
    let minUsed = 1e9;
    for (let t = 0; t < T; t++) { teamTime(M, t); if (used[t] < minUsed) minUsed = used[t]; }
    // 2. Überzahl und Positionen
    for (let t = 0; t < T; t++) {
      const eff = minUsed + extraWeight(used[t] - minUsed, M.TM.extra);
      sc.effF[t] = used[t] > 0 ? eff / used[t] : 0;
      if (M.posModel && used[t] >= M.posMin) sc.ploss[t] = positionLoss(M, t, used[t]);
      sc.fieldV[t] = sc.effF[t] * sc.fsum[t] - sc.ploss[t];
    }
    // 3. Regeln
    let R = 0;
    const viol = detail ? [] : null, duoOk = detail ? [] : null;
    for (let k = 0; k < M.rules.length; k++) {
      const r = M.rules[k], same = a[r.i] === a[r.j];
      if (r.type === 'duo') { if (same) { sc.duoV[a[r.i]] += r.bonus * tf[a[r.i]]; if (duoOk) duoOk.push(r.id); } continue; }
      if (r.type === 'together' ? !same : same) {
        if (r.hard) addHard(1, 'rule:' + r.id);
        else { R += r.w; if (viol) viol.push(r.id); }
      }
    }
    // 4. Teamstärke
    let vmax = -1e9, vmin = 1e9, mean = 0, usedMean = 0, smax = -1e9, smin = 1e9;
    for (let t = 0; t < T; t++) {
      val[t] = sc.fieldV[t] + sc.goalV[t] + sc.duoV[t] + sc.starP[t] - sc.weakP[t];
      mean += val[t]; usedMean += used[t];
      if (val[t] > vmax) vmax = val[t];
      if (val[t] < vmin) vmin = val[t];
      const s = st[t] * tf[t];
      if (s > smax) smax = s;
      if (s < smin) smin = s;
    }
    mean /= T; usedMean /= T;
    const dS = vmax - vmin, dStar = smax - smin;
    const pct = mean > 0 ? dS / mean * 100 : 0;
    let spread = dS;
    if (T > 2) { let mad = 0; for (let t = 0; t < T; t++) mad += Math.abs(val[t] - mean); spread += 0.5 * mad / T; }

    // 5. Weitere Kriterien
    let dA = 0;
    const dimCost = detail ? new Array(D).fill(0) : null;
    for (let d = 0; d < D; d++) {
      if (!M.dw[d]) continue;
      let mx = -1e9, mn = 1e9;
      for (let t = 0; t < T; t++) { if (!fc[t]) continue; const x = at[t * D + d] / fc[t]; if (x > mx) mx = x; if (x < mn) mn = x; }
      if (mx < mn) continue;
      const c = M.dw[d] * (mx - mn);
      dA += c;
      if (dimCost) dimCost[d] = c;
    }
    let dPos = 0;
    const posOn = M.posActive && usedMean >= M.posMin;
    if (posOn) {
      let mxD = -1e9, mnD = 1e9, mxA = -1e9, mnA = 1e9;
      for (let t = 0; t < T; t++) {
        if (df[t] > mxD) mxD = df[t]; if (df[t] < mnD) mnD = df[t];
        if (ak[t] > mxA) mxA = ak[t]; if (ak[t] < mnA) mnA = ak[t];
      }
      for (let t = 0; t < T; t++) dPos += Math.max(0, Math.max(0, mxD - df[t] - 1) + Math.max(0, mxA - ak[t] - 1) - fx[t]);
      dPos += 0.2 * ((mxD - mnD) + (mxA - mnA));
    }
    let dTag = 0;
    for (let k = 0; k < NT; k++) {
      let mx = -1e9, mn = 1e9;
      for (let t = 0; t < T; t++) { const x = tg[t * NT + k]; if (x > mx) mx = x; if (x < mn) mn = x; }
      dTag += Math.max(0, (mx - mn) - (M.tagTot[k] % T ? 1 : 0));
    }
    let dUns = 0;
    if (M.unsTot) {
      let mx = -1e9, mn = 1e9;
      for (let t = 0; t < T; t++) { if (un[t] > mx) mx = un[t]; if (un[t] < mn) mn = un[t]; }
      dUns = Math.max(0, (mx - mn) - (M.unsTot % T ? 1 : 0));
    }
    const dSize = Math.max(0, mxSz - mnSz - 1);
    // Ersatztorhüter: nur zwischen Teams, deren Tor nicht die ganze Zeit fest besetzt ist
    let dGk = 0, nNeed = 0, totR = 0, totG = 0, mxR = -1, mnR = 1e9, mxG = -1, mnG = 1e9;
    for (let t = 0; t < T; t++) {
      if (sc.gkS[t] >= 0.999) continue;
      nNeed++; totR += sc.cR[t]; totG += sc.cG[t];
      if (sc.cR[t] > mxR) mxR = sc.cR[t]; if (sc.cR[t] < mnR) mnR = sc.cR[t];
      if (sc.cG[t] > mxG) mxG = sc.cG[t]; if (sc.cG[t] < mnG) mnG = sc.cG[t];
    }
    if (nNeed > 1) dGk = Math.max(0, mxG - mnG - (totG % nNeed ? 1 : 0)) + 0.5 * Math.max(0, mxR - mnR - (totR % nNeed ? 1 : 0));
    // Abwechslung: Anteil der Mitspieler-Paare, die früher schon zusammen spielten (0–10)
    let dVary = 0, repShare = 0;
    if (M.varyOn) {
      let rep = 0, pairs = 0;
      const P = M.pair;
      for (let t = 0; t < T; t++) {
        const m = memN[t], b = t * n, g = gk[t];
        for (let x = 0; x < m; x++) {
          const i = mem[b + x], row = i * n;
          for (let y = x + 1; y < m; y++) rep += P[row + mem[b + y]];
          if (g >= 0) rep += P[row + g];
        }
        const s = m + (g >= 0 ? 1 : 0);
        pairs += s * (s - 1) / 2;
      }
      repShare = pairs > 0 ? rep / (pairs * M.pairNorm) : 0;
      dVary = 10 * repShare;
    }

    const parts = {
      S: W.S * spread * (1 + W.Sq * pct / 5), top: W.top * dStar, attr: dA, pos: W.pos * dPos, rule: W.rule * R,
      tags: W.tags * dTag, unsure: W.unsure * dUns, size: W.size * dSize, gks: W.gks * dGk, vary: W.vary * dVary
    };
    let U = 0;
    for (const k in parts) U += parts[k];
    if (!detail) return U + HARD * hard;

    // ---------- Aufschlüsselung für die Anzeige ----------
    const vals = Array.from(val);
    const attrAvg = [];
    for (let t = 0; t < T; t++) attrAvg.push(Array.from({ length: D }, (_, d) => (fc[t] ? at[t * D + d] / fc[t] : 0)));
    const sdT = [], posRole = new Int8Array(n).fill(-2);
    for (let t = 0; t < T; t++) {
      let q = 0;
      for (let k = 0; k < memN[t]; k++) { const i = mem[t * n + k]; q += (M.sd[i] * sc.shr[i]) ** 2; }
      const g = gk[t];
      const gUnc = M.gkW * (sc.gkS[t] * (g >= 0 ? M.gsd[g] : 0) + (1 - sc.gkS[t]) * 1.0);
      q += gUnc * gUnc;
      sdT.push(Math.sqrt(q));
      const posT = M.posModel && used[t] >= M.posMin;
      if (posT) positionLoss(M, t, used[t]);
      for (let k = 0; k < memN[t]; k++) { const i = mem[t * n + k]; posRole[i] = posT ? sc.asg[i] : (sc.occI[i] >= 0.999 ? -3 : -1); }
    }
    const sizes = Array.from(sz), pitch = Array.from(sc.pitch);
    return {
      U, hard, hardList, R, viol, duoOk, vals, sizes, gk: Array.from(gk), mean, dS, pct, dStar, attrAvg, dimCost,
      def: Array.from(df), att: Array.from(ak), tags: M.tagNames.map((name, k) => ({ name, counts: Array.from({ length: T }, (_, t) => tg[t * NT + k]) })),
      parts, posOn, raw: { dS, dStar, dA, dPos, R, dTag, dUns, dSize, dGk, nNeed, dVary, repShare },
      fieldCount: Array.from(fc), unsure: Array.from(un), pitch, subs: sizes.map((s, t) => Math.max(0, s - pitch[t])),
      shr: Array.from(sc.shr), used: Array.from(used), minUsed, tf: Array.from(tf),
      fieldV: Array.from(sc.fieldV), goalV: Array.from(sc.goalV), duoV: Array.from(sc.duoV), fsum: Array.from(sc.fsum), effF: Array.from(sc.effF),
      starP: Array.from(sc.starP), weakP: Array.from(sc.weakP), posLoss: Array.from(sc.ploss),
      rotV: Array.from(sc.rotV), rotI: Array.from(sc.rotI), rotN: Array.from(sc.rotN), occ: Array.from(sc.occ), occI: Array.from(sc.occI), gkS: Array.from(sc.gkS), cR: Array.from(sc.cR), cG: Array.from(sc.cG),
      sd: sdT, posRole: Array.from(posRole)
    };
  }

  /* ---------- Suche ---------- */
  function setUnit(M, a, u, t) { const m = M.units[u].members; for (let k = 0; k < m.length; k++) a[m[k]] = t; }
  function unitTeam(M, a, u) { return a[M.units[u].members[0]]; }

  /* Kanonische Form: austauschbare Teams (ohne Fixierungen) werden nach ihrem ersten Spieler
     benannt, damit gespiegelte Aufteilungen als gleich erkannt werden. */
  function canon(M, a) {
    const T = M.T, map = new Int8Array(T).fill(-1), free = [];
    for (let t = 0; t < T; t++) { if (M.fixedTeams[t]) map[t] = t; else free.push(t); }
    let k = 0;
    const out = new Int8Array(M.n);
    for (let i = 0; i < M.n; i++) { const t = a[i]; if (map[t] < 0) map[t] = free[k++]; out[i] = map[t]; }
    return { key: out.join(','), a: out };
  }

  const TOP = 2000;
  function makeTop(limit) {
    let arr = [], cut = Infinity;
    return {
      add(U, getA) {
        if (arr.length >= limit && U >= cut) return;
        arr.push({ U, a: getA() });
        if (arr.length >= limit * 2) { arr.sort((x, y) => x.U - y.U); arr.length = limit; cut = arr[limit - 1].U; }
      },
      list() { arr.sort((x, y) => x.U - y.U); if (arr.length > limit) arr.length = limit; return arr; }
    };
  }

  /* Anzahl der Aufteilungen (für die Wahl zwischen exakter Suche und Näherung). */
  function estimateCount(M) {
    const T = M.T, free = M.freeUnits, n = M.n;
    const freeTeams = T - M.fixedTeams.reduce((s, x) => s + x, 0);
    let fact = 1; for (let k = 2; k <= freeTeams; k++) fact *= k;
    if (T === 2) {
      let fixed0 = 0;
      M.units.forEach(u => { if (u.fix === 0) fixed0 += u.members.length; });
      let ways = new Float64Array(n + 1); ways[0] = 1;
      free.forEach(u => {
        const s = M.units[u].members.length, nx = new Float64Array(n + 1);
        for (let k = 0; k <= n; k++) if (ways[k]) { nx[k] += ways[k]; if (k + s <= n) nx[k + s] += ways[k]; }
        ways = nx;
      });
      let c = 0;
      for (let k = 0; k <= n; k++) { const s0 = fixed0 + k, s1 = n - s0; if (ways[k] && s0 >= 1 && s1 >= 1 && Math.abs(s0 - s1) <= M.maxDiff) c += ways[k]; }
      return c / (freeTeams === 2 ? 2 : 1);
    }
    if (M.maxDiff > 3) return Math.pow(T, free.length) / fact;
    const f0 = new Int32Array(T);
    M.units.forEach(u => { if (u.fix >= 0) f0[u.fix] += u.members.length; });
    const LF = [0];
    for (let k = 1; k <= n; k++) LF[k] = LF[k - 1] + Math.log(k);
    const freeN = n - f0.reduce((s, x) => s + x, 0);
    let total = 0;
    const sizes = new Int32Array(T);
    const rec = (t, left, mn, mx) => {
      if (t === T) {
        if (left !== 0 || mx - mn > M.maxDiff) return;
        let lg = LF[freeN];
        for (let k = 0; k < T; k++) lg -= LF[sizes[k] - f0[k]];
        total += Math.exp(lg);
        return;
      }
      for (let s = Math.max(1, f0[t]); s <= M.maxUnit; s++) {
        const add = s - f0[t];
        if (add > left) break;
        const nmn = Math.min(mn, s), nmx = Math.max(mx, s);
        if (nmx - nmn > M.maxDiff) continue;
        sizes[t] = s; rec(t + 1, left - add, nmn, nmx);
      }
    };
    rec(0, freeN, 1e9, -1);
    return total / fact;
  }

  function randomInit(M) {
    const a = new Int8Array(M.n), sz = new Int32Array(M.T);
    M.units.forEach(u => { if (u.fix >= 0) { u.members.forEach(i => { a[i] = u.fix; }); sz[u.fix] += u.members.length; } });
    const order = shuffle(M.freeUnits.slice()).sort((x, y) => M.units[y].members.length - M.units[x].members.length);
    for (const u of order) {
      let bestT = 0, bs = Infinity;
      for (const t of shuffle([...Array(M.T).keys()])) if (sz[t] < bs) { bs = sz[t]; bestT = t; }
      setUnit(M, a, u, bestT);
      sz[bestT] += M.units[u].members.length;
    }
    return a;
  }

  function measureRate(M) {
    const a = randomInit(M), t0 = now();
    let k = 0;
    while (k < 400 && (k < 30 || now() - t0 < 15)) { evaluate(M, a); k++; }
    return k / Math.max(0.05, now() - t0);   // Bewertungen je Millisekunde
  }

  /* Exakte Suche: jede Aufteilung genau einmal (austauschbare Teams nur in einer Reihenfolge). */
  function exhaustive(M, budget) {
    const t0 = now(), T = M.T, n = M.n;
    const free = M.freeUnits, m = free.length;
    const a = new Int8Array(n), sz = new Int32Array(T);
    M.units.forEach(u => { if (u.fix >= 0) { u.members.forEach(i => { a[i] = u.fix; }); sz[u.fix] += u.members.length; } });
    const usz = free.map(u => M.units[u].members.length);
    const remainN = new Int32Array(m + 1);
    for (let k = m - 1; k >= 0; k--) remainN[k] = remainN[k + 1] + usz[k];
    const freeIdx = new Int32Array(T).fill(-1);
    let nf = 0;
    for (let t = 0; t < T; t++) if (!M.fixedTeams[t]) freeIdx[t] = nf++;
    const top = makeTop(TOP);
    let evals = 0, aborted = false;
    const rec = (k, opened) => {
      if (k === m) {
        let mx = -1, mn = 1e9;
        for (let t = 0; t < T; t++) { if (sz[t] > mx) mx = sz[t]; if (sz[t] < mn) mn = sz[t]; }
        if (mn < 1 || mx - mn > M.maxDiff) return;
        const U = evaluate(M, a);
        evals++;
        if (U < HARD) top.add(U, () => a.slice());
        if ((evals & 1023) === 0 && now() - t0 > budget) aborted = true;
        return;
      }
      // Reichen die übrigen Spieler noch, um jedes Team auf die Mindestgröße zu bringen?
      let mx = 0, deficit = 0, empty = 0;
      for (let t = 0; t < T; t++) { if (sz[t] > mx) mx = sz[t]; if (sz[t] === 0) empty++; }
      const minSize = Math.max(1, mx - M.maxDiff);
      for (let t = 0; t < T; t++) if (sz[t] < minSize) deficit += minSize - sz[t];
      if (deficit > remainN[k] || empty > m - k) return;
      const u = free[k], s = usz[k];
      for (let t = 0; t < T; t++) {
        const fi = freeIdx[t];
        if (fi >= 0 && fi > opened) continue;
        if (sz[t] + s > M.maxUnit) continue;
        setUnit(M, a, u, t); sz[t] += s;
        rec(k + 1, fi >= 0 && fi === opened ? opened + 1 : opened);
        sz[t] -= s;
        if (aborted) return;
      }
    };
    rec(0, 0);
    if (aborted) return null;
    return { sols: top.list().map(s => ({ U: s.U, ...canon(M, s.a) })), exact: true, evals };
  }

  /* Lokale Verbesserung: Gruppen verschieben und tauschen, solange es besser wird. */
  function climb(M, a, deadline) {
    let cur = evaluate(M, a);
    const T = M.T;
    let improved = true, guard = 0;
    while (improved && guard++ < 80) {
      improved = false;
      const order = shuffle(M.freeUnits.slice());
      for (const u of order) {
        const from = unitTeam(M, a, u);
        for (let t = 0; t < T; t++) {
          if (t === from) continue;
          setUnit(M, a, u, t);
          const v = evaluate(M, a);
          if (v < cur - 1e-9) { cur = v; improved = true; break; }
          setUnit(M, a, u, from);
        }
      }
      for (let x = 0; x < order.length; x++) {
        for (let y = x + 1; y < order.length; y++) {
          const u = order[x], w = order[y];
          const tu = unitTeam(M, a, u), tw = unitTeam(M, a, w);
          if (tu === tw) continue;
          setUnit(M, a, u, tw); setUnit(M, a, w, tu);
          const v = evaluate(M, a);
          if (v < cur - 1e-9) { cur = v; improved = true; } else { setUnit(M, a, u, tu); setUnit(M, a, w, tw); }
        }
        if (now() > deadline) break;
      }
      if (now() > deadline) break;
    }
    return cur;
  }

  /* Näherung: viele zufällige Startaufteilungen, jede lokal verbessert, dazu kleine Störungen. */
  function localSearch(M, budget) {
    const deadline = now() + budget;
    let seen = new Map(), restarts = 0;
    const store = (a, U) => {
      if (U >= HARD) return;
      const c = canon(M, a);
      if (seen.has(c.key)) return;
      seen.set(c.key, { U, ...c });
      if (seen.size > 6000) seen = new Map([...seen.entries()].sort((x, y) => x[1].U - y[1].U).slice(0, TOP));
    };
    while ((now() < deadline || restarts < 3) && restarts < 100000) {
      restarts++;
      const a = randomInit(M);
      store(a, climb(M, a, deadline + 200));
      for (let k = 0; k < 4 && M.freeUnits.length > 1; k++) {
        const b = a.slice();
        for (let s = 0; s < 2; s++) {
          const u = M.freeUnits[Math.floor(Math.random() * M.freeUnits.length)];
          const w = M.freeUnits[Math.floor(Math.random() * M.freeUnits.length)];
          const tu = unitTeam(M, b, u), tw = unitTeam(M, b, w);
          if (tu !== tw) { setUnit(M, b, u, tw); setUnit(M, b, w, tu); }

   VOREINSTELLUNGEN DER AUSWERTUNG

/* ============================================================

   Je Spieltag speichert die App einen Schnappschuss: Bewertungen und Einstellungen zum Zeitpunkt
   der Teambildung. Daraus rechnet der Rechenkern jederzeit die Teamstärken nach – auch mit den
   HEUTIGEN Bewertungen, für korrigierte Aufstellungen oder für ein einzelnes Spiel mit Aushilfe.

   Grundgröße ist der Toranteil eines Teams in einem Spiel (7:3 → 70 %).
   Annahme: Tore A ~ Poisson(λA), Tore B ~ Poisson(λB). Bei gegebener Torzahl n = a + b gilt dann

   kürzen sich heraus: 10 Tore in der Halle in 15 Minuten und 10 Tore draußen in 2 Stunden sagen
   gleich viel. Mehr Tore = mehr Information; ein 0:0 sagt nichts darüber, wer besser war.

   Überstreuung φ: Jedes Tor zählt als 1/φ Beobachtung, ältere Spieltage mit Halbwertszeit weniger.
   Schätzung: Maximum der Posterior (logistische Regression mit Vorwissen, Newton-Verfahren).
   Unsicherheit: Laplace-Näherung (Kehrwert der Krümmung).
   Beitrag eines Spiels g zur Schätzung von Spieler i: (P⁻¹ a_g)_i · W_g · r_g. Alle Beiträge

      tired: over.tired || {}, tiredPct: over.tiredPct || 0,

    const day = (m.snap && m.snap.day) || {}, rt = day.roleToday || {};

  /* Torniveau je Ort: Ø Tore je Spiel (für Tendenzen und zur Anzeige), Tore je Stunde, wo Dauer angegeben */
  function levels(matches) {
    const cls = new Map();
    let G = 0, n = 0;
    matches.forEach(m => {
      if (!m || m.status !== 'done' || m.exclude || !Array.isArray(m.games)) return;
      const key = placeKey(m);
      const c = cls.get(key) || { key, place: String(m.place || '').trim(), surface: ((((m.snap || {}).set || {}).ctx) || {}).surface || '', days: new Set(), goals: 0, games: 0, min: 0, minGoals: 0, tend: 0 };
      cls.set(key, c);
      c.days.add(m.id);
      m.games.forEach(g => {

        const t = +g.ga + +g.gb;
        c.goals += t; c.games++; G += t; n++;
        // Echte Minuten des Spiels; sonst die Spielzeit des Spieltags, auf die Spiele der Runde verteilt
        const gm = isNum(g.min) && +g.min > 0 ? +g.min : isNum(m.gameMin) && +m.gameMin > 0 ? +m.gameMin : isNum(m.minutes) && +m.minutes > 0 ? +m.minutes / m.games.length : 0;

  function snapKeeper(snap, id, sport) {

    const eff = Engine.effective({ strength: q.s, attrs: q.a || {}, gk: q.g, autoStrength: q.au, rated: q.rr }, sport, snap.set.attrW, snap.set.autoStrength);
    return Engine.keeperBase({ eff, roleMain: q.rm || 'FLEX', roleSub: q.rs || '', gkWill: q.gw || 'never' }, sport);

  function tendScore(tend, N) { const s = TEND[tend]; return s == null ? null : [N * s, N * (1 - s)]; }

  const R = S.result;

  const pick = o => { const out = {}; Object.keys(o || {}).sort().forEach(id => { if (inT.has(id)) out[id] = o[id]; }); return out; };

  const frame = (cap, maxDiff, format, ctx, adjust, gkRule, day) => JSON.stringify([cap || 0, maxDiff, format || 'all', cleanCtx(ctx), cleanMap(adjust, ATTR_KEYS, 0.3, 3), gkRule, day]);
  const now = frame(capOf(d), d.maxDiff, d.format, d.ctx, d.adjust, gkRuleOf(d), dayOf(d));
  if (now !== frame(st.cap, st.maxDiff, st.format, st.ctx, st.adjust, st.gkRule, dayOf(m.snap.day || {}))) {
    const M = buildModel();
    if (M.errors.length || isStale(R, M)) return;   // Anwesenheit oder Teamzahl geändert: erst neu bilden
    const snap = clone(m.snap);
    Object.assign(snap.set, { cap: capOf(d), maxDiff: d.maxDiff, format: d.format, ctx: { ...d.ctx }, adjust: { ...d.adjust }, gkRule: gkRuleOf(d), mix: mixFor(d) });
    Engine.contextKeys({ ...d.ctx, subs: true }, SPORT).forEach(k => { if (!snap.set.profiles[k]) snap.set.profiles[k] = { ...(SET().profiles[k] || {}) }; });
    snap.day = dayOf(d);
    const pred = Analysis.prediction(snap, m.teams, SPORT);
    if (!pred) return;
    m.snap = snap; m.pred = pred; m.upd = Date.now();
  }
  const dpl = placeByName(d.place), dfl = dpl && dpl.fields.find(f => f.id === d.field);
  const meta = { field: dfl ? dfl.name : '', minutes: d.minutes || null, gameMin: d.gameMin || null, weather: d.weather ? clone(d.weather) : null };
  if (JSON.stringify([m.field || '', m.minutes || null, m.gameMin || null, m.weather || null]) !== JSON.stringify([meta.field, meta.minutes, meta.gameMin, meta.weather])) { Object.assign(m, meta); m.upd = Date.now(); }
}
/* Paarungen: bei zwei Teams ein Spiel, sonst die vorhandenen, soweit sie zur Teamzahl passen */
function defaultGames(T, games) {
  const ok = (games || []).filter(g => g.a < T && g.b < T && g.a !== g.b).map(g => ({ ...g, x: g.x || [] }));
  if (ok.length) return ok;
  // Zwei oder drei Teams: erst ein Spiel (bei dreien bleibt der Sieger drauf, siehe nextPairing).
  // Ab vier Teams: die erste Runde wie im Turnier – A gegen B, C gegen D …
  const pairs = T >= 4 ? roundRobin(T).slice(0, Math.floor(T / 2)) : [[0, 1]];
  return pairs.map(([a, b]) => ({ a, b, ga: null, gb: null, tend: '', min: null, x: [], feel: '' }));
}
/* Spielplan „jeder gegen jeden“, Runde für Runde; die erste Runde ist A–B, C–D, E–F … */
function roundRobin(T) {
  const n = T % 2 ? T + 1 : T, lab = new Array(n), out = [];
  for (let k = 0; k < n / 2; k++) {
    const a = k, b = n - 1 - k;
    if (T % 2 && k === 0) { lab[b] = T; lab[a] = T - 1; } else { const j = T % 2 ? k - 1 : k; lab[a] = 2 * j; lab[b] = 2 * j + 1; }
  }
  let arr = [...Array(n).keys()];
  for (let r = 0; r < n - 1; r++) {
    for (let k = 0; k < n / 2; k++) { const x = lab[arr[k]], y = lab[arr[n - 1 - k]]; if (x < T && y < T) out.push([Math.min(x, y), Math.max(x, y)]); }
    arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
  }
  return out;
}
/* Vorschlag für das nächste Spiel einer Runde.
   Drei Teams: Der Sieger bleibt drauf, der Verlierer geht runter. Ab dem dritten Spiel geht, wer zweimal
   in Folge gespielt hat – so rotiert es fair. Vier und mehr: wie im Turnier die Paarung, die bisher am
   seltensten gespielt wurde, in der Reihenfolge A–B, C–D, A–D … */
function nextPairing(games, T) {
  if (!games.length || T === 2) return games.length ? [games[games.length - 1].a, games[games.length - 1].b] : [0, 1];
  const last = games[games.length - 1], prev = games[games.length - 2];
  if (T === 3) {
    const out = [0, 1, 2].find(t => t !== last.a && t !== last.b);
    const r = isNum(last.ga) && isNum(last.gb) ? Math.sign(last.ga - last.gb) : TENDS.includes(last.tend) ? (last.tend[0] === 'a' ? 1 : last.tend[0] === 'b' ? -1 : 0) : 0;
    let stay = prev ? [last.a, last.b].find(t => t !== prev.a && t !== prev.b) : null;
    if (stay == null) stay = r < 0 ? last.b : last.a;
    return [stay, out];
  }
  const cnt = {};
  games.forEach(g => { const k = [Math.min(g.a, g.b), Math.max(g.a, g.b)].join(); cnt[k] = (cnt[k] || 0) + 1; });
  let best = null, bc = Infinity;
  roundRobin(T).forEach(p => { const c = cnt[p.join()] || 0; if (c < bc) { bc = c; best = p; } });
  return best || [0, 1];
}
/* Fehlt eine Vorhersage (z. B. nach einer neuen Rechenversion), wird sie aus dem Schnappschuss neu berechnet. */
function ensurePred(m) {

}
async function generate() {

  if (hadManual) remember('Neu berechnet');
  try {

    const input = buildInput();
    const M = Engine.prepare(input, SPORT);

    if (M.errors.length) {

      }

/* Rein zufällige Teams: gleich große Teams, feste Torhüter je eins pro Team – sonst nur der Zufall.
   Regeln, Stärken und Fixierungen spielen keine Rolle; die App zeigt danach trotzdem, wie fair es ist. */
function randomTeams() {
  const had = S.result && S.result.teams && !S.result.error;
  if (had) remember('Zufällige Teams');
  const input = buildInput(), M = Engine.prepare(input, SPORT);
  const base = { T: M.T, date: S.day.date, mid: S.result ? S.result.mid || null : null, colors: keepCols() };
  if (M.errors.length) { S.result = { ...base, error: true, errors: M.errors }; ui.tab = 'teams'; render(); return; }
  const a = new Int8Array(M.n).fill(-1), sz = new Int32Array(M.T);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  // Fixierte Spieler bleiben in ihrem Team; nur die anderen werden zufällig verteilt
  const pins = S.day.pins || {}, pinned = new Set(), gkN = new Int32Array(M.T);
  Object.keys(pins).forEach(id => { const i = M.idx.get(id), t = pins[id]; if (i == null || !(t >= 0 && t < M.T)) return; a[i] = t; sz[t]++; pinned.add(i); if (M.goalIds.includes(id)) gkN[t]++; });
  // Feste Torhüter: reihum auf die Teams mit den wenigsten Torhütern
  shuffle(M.goalIds.filter(id => !pinned.has(M.idx.get(id)))).forEach(id => {
    const i = M.idx.get(id), min = Math.min(...gkN), t = shuffle([...Array(M.T).keys()].filter(x => gkN[x] === min))[0];
    a[i] = t; sz[t]++; gkN[t]++;
  });
  shuffle([...Array(M.n).keys()].filter(i => a[i] < 0)).forEach(i => {
    const min = Math.min(...sz), cand = shuffle([...Array(M.T).keys()].filter(t => sz[t] === min));
    a[i] = cand[0]; sz[cand[0]]++;
  });
  // Erlaubte Teamgrößen ausnutzen: einzelne Spieler zufällig umsetzen, solange der Unterschied erlaubt ist
  // (beliebig = höchstens so, dass jedes Team mindestens 2 Spieler behält)
  const maxD = S.day.maxDiff >= 99 ? M.n : S.day.maxDiff;
  if (maxD > 1) {
    const moves = Math.floor(Math.random() * (M.n + 1));
    for (let k = 0; k < moves; k++) {
      const i = Math.floor(Math.random() * M.n), from = a[i], to = Math.floor(Math.random() * M.T);
      if (to === from || pinned.has(i) || M.goalIds.includes(M.ids[i]) || sz[from] <= 2) continue;
      sz[from]--; sz[to]++;
      if (Math.max(...sz) - Math.min(...sz) > maxD) { sz[from]++; sz[to]--; continue; }
      a[i] = to;
    }
  }
  const teams = teamsFromAssign(M, a);
  ui.sel = []; ui.suggest = null; ui.late = false;
  ui.fxTeams = true;
  S.result = { ...base, sig: sigOf(input), vars: [{ teams: clone(teams), U: 0, eq: true }], vsel: 0, teams, manual: false, random: true, stats: { exact: false, ms: 0, evals: 0, restarts: 0, nEqual: 1, bestU: 0, tol: S.settings.tol } };
  syncMatch('new');
  ui.tab = 'teams'; render(); window.scrollTo(0, 0);
  toast(pinned.size ? `Zufällig eingeteilt – ${plural(pinned.size, 'fixierter Spieler blieb', 'fixierte Spieler blieben')} im Team.` : 'Zufällig eingeteilt.', had ? { label: 'Rückgängig', act: 'undo' } : null);
}

/* ---------- Teamfarben ----------
   Jede Runde merkt sich ihre eigenen Farben (m.colors), die aktuellen Teams ebenso (S.result.colors).
   Ein neuer Spieltag beginnt wieder mit der Standard-Reihenfolge Rot, Blau, Gelb …

/* ---------- Bewertung in Worten ---------- */
const lampClass = pct => (pct < 5 ? 'good' : pct <= 10 ? 'warn' : 'bad');

/* ---------- Teilen ---------- */
function shareText() {

/* ---------- Dateien: Export ----------

    D.matches.forEach(m => { if (m.snap) Object.values(m.snap.pl).forEach(q => { Object.assign(q, { s: 5, a: {}, g: null, au: null, pf: {}, rt: false, cf: null }); }); m.fb.marks = []; });
  };

/* Import erst prüfen und zeigen, dann auf Wunsch übernehmen (mit Rückgängig). */

  svScale: () => 'Die Gruppenwerte werden so verschoben und gestreckt, dass ihr Durchschnitt und ihre Streuung zu deinen bisherigen Bewertungen passen. Die Gruppe bestimmt dann Reihenfolge und Abstände, deine gewohnte Skala bleibt – so ändern sich die Teamstärken nicht insgesamt. Aus: die Werte der Gruppe, wie abgegeben.',
  howCmp: () => `Jede Runde merkt sich, wie ihre Teams entstanden sind: von der App fair berechnet, per Zufall, selbst eingeteilt oder von Kapitänen gewählt. Das wird automatisch übernommen; ändern und den Wähler eintragen kannst du im Ergebnis der Runde. Verglichen wird, wie knapp die Spiele ausgingen: Je kleiner der Tor-Unterschied und je näher der Anteil des Siegers an 50 %, desto ausgeglichener waren die Teams. Das ist beschreibend – an verschiedenen Tagen spielen verschiedene Leute, und mit wenigen Spielen entscheidet der Zufall viel.`,
  dayTime: () => 'Die Spielzeit gesamt zählt für die Kondition (kurz, mittel, lang); Spielfluss und Zuschauer können je nach Einstellungen einzelne Fähigkeiten stärker gewichten. Die Spielzeit pro Spiel ändert die Teams nicht – sie wird beim Ergebnis als Dauer jedes Spiels vorbelegt und für die Prognose genutzt. Beim Ergebnis lassen sich die echten Minuten je Spiel eintragen.',
  teamsHelp: () => `Spieler antippen zum Auswählen (auch mehrere), dann unten tauschen oder in ein anderes Team schieben. Oder direkt ziehen – ${ui.tview === 'pitch' ? 'am Kreis mit der Stärke' : 'am Kürzel'} – auf ein Team oder auf einen Spieler zum Tauschen. Zahlen wie „17 : 67 : 17“ = Anteil der Spielzeit im Tor : im Feld : auf der Bank (in %). „5,3 → 4,9“ = Stärke → Wert heute mit Platz, Tagesform und Position.`,
  strength: () => 'Gesamtstärke 1–10 im Vergleich zur eigenen Gruppe: 5–6 ist Gruppenschnitt. Es geht nicht um ein absolutes Niveau, sondern darum, wer im Vergleich stärker oder schwächer ist.',
  quickAdd: () => 'Mehrere Namen auf einmal: mit Komma oder je Zeile trennen. Eine Zahl dahinter ist die Stärke (1–10), z. B. „Jonas 7“ oder „Jonas 7,5“. Ohne Zahl gilt 5 und die Stärke zählt als unsicher. Bekannte Namen werden angekreuzt; steht eine Zahl dahinter, wird sie als neue Stärke übernommen.',
  format: () => 'Wie viele Spieler eines Teams gleichzeitig auf dem Platz stehen, Torwart eingerechnet. Hat ein Team mehr Spieler, wird gewechselt: Die App rechnet dann mit der Spielzeit jedes Einzelnen. „Alle spielen“ = keine Wechsler.',
  maxDiff: () => 'Wie viele Spieler ein Team mehr haben darf. „Gleich groß“ heißt höchstens einer mehr, wenn es nicht aufgeht. „Beliebig“ erlaubt z. B. 3 Erwachsene gegen 8 Kinder, wenn es die Stärke ausgleicht.',
  keepers: () => 'Feste Torhüter sind Spieler mit Hauptrolle Torwart oder „heute im Tor“. Pro Team steht höchstens einer fest im Tor; „heute im Tor“ hat Vorrang, danach entscheidet die Torwart-Stärke. Wer übrig bleibt, spielt im Feld.',
  gkRule: () => 'Gilt für Teams ohne festen Torwart und für die Zeit, in der ein fester Torwart im Feld spielt. „Kann ins Tor“ heißt: im Profil „wenn nötig“ oder „gern“ angegeben. „Abwechselnd“: Diese Spieler teilen sich die Torzeit und fehlen genau so lange im Feld; gerechnet wird mit dem Schnitt ihrer Torwartwerte. Kann im Team niemand ins Tor, wechseln sich alle ab. „Einer bleibt drin“: Der Beste steht die ganze Zeit im Tor und fehlt dafür im Feld. Die Grundeinstellung steht unter Einstellungen, am Spieltag lässt sie sich für den Tag ändern.',
  gkShare: () => 'Wie lange der feste Torwart im Tor steht. Den Rest der Zeit spielt er im Feld, und das Tor wird nach der Regel „Ohne festen Torwart“ besetzt.',
  pause: () => 'Wirkt nur, wenn es Wechselspieler gibt. „spielt durch“: wird nie ausgewechselt. „mehr Pausen“: bekommt weniger Spielzeit (Anteil unter Einstellungen → Teamstärke). Feste Torhüter spielen automatisch durch.',
  form: () => 'Tagesform ändert den Wert des Spielers nur für heute, z. B. „gut drauf“ +10 %. Die Prozentwerte stellst du unter Einstellungen → Tagesform ein.',
  context: () => 'Spielfeld, Tore, Untergrund und Wetter werden mit der Runde gespeichert – für den Überblick und spätere Auswertungen. Für die Teams verschieben sie, wie stark einzelne Fähigkeiten zählen, etwa Technik in der Halle. Das wirkt nur bei Spielern, deren Fähigkeiten bewertet sind, und nur auf das Verhältnis der Fähigkeiten zueinander. Treffen mehrere Bedingungen zusammen, zählt je Fähigkeit die stärkste Wirkung voll, die zweite halb, die dritte ein Viertel. „Keine Angabe“ wirkt gar nicht.',
  conf: () => 'Wie gut du den Spieler kennst. „Sehr unsicher“ passt für jemanden, den du kaum gesehen hast. Unsichere werden wie Gäste gleichmäßig auf die Teams verteilt, die Teamstärke bekommt eine größere Schwankungsbreite, und in der Auswertung bewegen Ergebnisse die Schätzung schneller. „Automatisch“ leitet es aus Status, „neu“ und der Zahl bewerteter Fähigkeiten ab.',
  posPick: () => 'Die Schnellwahl füllt Hauptrolle, Nebenrolle und Seite aus – danach lässt sich alles einzeln ändern. Die Nebenrolle ändert die Hauptrolle nie. Für die Teams zählen nur die groben Rollen Abwehr, Mittelfeld und Sturm; die genaue Position und die Seite helfen, Spieler auf der Positionstafel (Spieler → nach Position sortieren) richtig zu platzieren. Die kleine Tafel färbt den Bereich der Haupt- (kräftig) und Nebenrolle (blass) ein.',
  pct: () => 'Unterschied zwischen stärkstem und schwächstem Team, geteilt durch die durchschnittliche Teamstärke. Unter 2 % sehr ausgeglichen, unter 5 % gut, bis 10 % okay, bis 20 % unausgeglichen, darüber stark unausgeglichen. Die Teamstärke enthält Feldspieler, Torwart, Duo-Bonus und Star-Effekt; die Rechnung siehst du im erweiterten Modus an jedem Team.',
  unc: () => 'Bewertungen sind Schätzungen. Aus der Datenlage (Gäste, Neue, nur grob eingeschätzte oder detailliert bewertete Spieler) schätzt die App, wie stark die Teamstärke danebenliegen kann. Ist der Unterschied kleiner, sind die Teams im Rahmen der Genauigkeit gleich stark.',
  variants: () => 'Alle Kriterien werden zu Strafpunkten zusammengerechnet; A hat die wenigsten. B und C sind fast genauso gut, aber möglichst anders zusammengesetzt. Deshalb kann eine Alternative z. B. bei der Stärke knapper sein, dafür einen Wunsch nicht erfüllen.',
  profile: () => 'Bestimmt, wie stark Stärke, Wünsche, Merkmale und Abwechslung gegeneinander abgewogen werden. Im erweiterten Modus kannst du jedes Gewicht einzeln einstellen.',
  status: () => 'Aktiv: normaler Mitspieler. Pausiert: fehlt eine Weile, am Spieltag ausgeblendet. Gast: nur ab und zu dabei, gilt automatisch als unsicher eingeschätzt. Archiviert: kommt voraussichtlich nicht mehr – überall ausgeblendet, bleibt aber in alten Runden und der Auswertung erhalten.',
  isNew: () => 'Neue Spieler kennt man noch kaum: Ihre Stärke gilt als unsicher, und sie werden wie Gäste gleichmäßig auf die Teams verteilt.',
  auto: () => 'An: Die Gesamtstärke ist das gewichtete Mittel der Fähigkeiten; nicht bewertete Fähigkeiten zählen mit der groben Einschätzung – solange keine gesetzt ist, wie der Schnitt der bewerteten Fähigkeiten. Aus: Es zählt die grobe Einschätzung, die Fähigkeiten dienen nur zum Ausgleichen der einzelnen Fähigkeiten.',
  posFit: () => `Wie viel seiner Stärke der Spieler auf jeder Position bringt. „auto“: Hauptposition 100 %, Nebenposition ${pctTxt(S.settings.fit.sub)}, fremde ${pctTxt(S.settings.fit.other)}. Spieler ohne Positionsangabe (flexibel) zählen überall ${pctTxt(S.settings.fit.flex)}. 0 heißt: spielt dort nie.`,
  tags: () => 'Spieler mit gleichem Merkmal werden gleichmäßig auf die Teams verteilt, z. B. Kinder oder Frauen. Unter „Regeln“ schaltest du einzelne Merkmale ab.',
  mix: () => 'So viele Feldspieler braucht ein Team mindestens je Position. Fehlt jemand, rückt ein Spieler einer überbesetzten Position nach und zählt dort mit seiner Eignung. Alles darüber ist frei – drei Stürmer sind also kein Problem. Das ist keine Formation, nur eine Mindestbesetzung.',
  posMin: () => 'In sehr kleinen Teams spielt jeder überall. Positionen zählen erst ab so vielen Feldspielern je Team (ohne Torwart).',
  fit: () => 'Für Spieler ohne eigene Eignungswerte: wie viel ihrer Stärke sie auf Neben- oder fremden Positionen bringen. „Flexibel“ gilt für alle ohne Positionsangabe; 100 % ist dort richtig, weil sonst jeder ohne Angabe benachteiligt wäre.',
  attrW: () => 'Wie stark jede Fähigkeit in die berechnete Gesamtstärke eingeht und beim Ausgleichen der Fähigkeiten zählt. 0 = zählt nicht, 1 = normal, 2 = doppelt.',
  tol: () => `Aufteilungen mit höchstens ${fmtS(S.settings.tol)} % mehr Strafpunkten als die beste gelten als gleichwertig. Daraus werden die Varianten B und C gewählt; gibt es zu wenige gleichwertige, zeigt die App die nächstbesten und nennt dabei, wie viel mehr Strafpunkte sie haben. Das ist kein Stärkeunterschied in Prozent.`,
  time: () => 'Reicht die Zeit, prüft die App alle Möglichkeiten und findet garantiert die beste Aufteilung (bei 1 s etwa bis 18 Spieler in 2 Teams). Sonst sucht sie in dieser Zeit mit vielen Startpunkten – in Tests traf das fast immer ebenfalls das Optimum.',
  review: () => 'Jede Teambildung wird als Spieltag gespeichert, samt den Bewertungen und Einstellungen von diesem Moment. Nach dem Spiel trägst du das Ergebnis ein. Daraus erkennt die App mit der Zeit, wessen Bewertung nicht zu den Spielen passt, und zeigt dir die Zahlen dazu. Ändern tust nur du.',
  result: () => 'Das Ergebnis jedes Spiels als Tore – genau oder ungefähr. Speichern geht auch ohne Ergebnis, die Runde wartet dann darauf. Wer wann wechselte, ins Tor ging oder einsprang, gibst du beim jeweiligen Spiel unter „Besetzung und Umstellungen“ an.',
  snapshot: () => 'Beim Bilden der Teams merkt sich die App die damaligen Bewertungen und Einstellungen. Die Auswertung rechnet jedes Spiel aber mit den heutigen Bewertungen nach. So wird eine übernommene Änderung nicht doppelt gezählt: Passt der neue Wert, verschwindet die Abweichung.',
  marks: () => 'Neben jedem Spieler steht der Wert, mit dem die App an diesem Tag gerechnet hat. „Besser“ oder „schlechter“ gilt nur für dieses eine Spiel: Er zählt dort etwa 1 Punkt stärker oder schwächer – wie eine Tagesform. Das hilft, das Ergebnis richtig zuzuordnen (wer hat es getragen?). Seine Stärke auf Dauer ändert eine Markierung nicht direkt; sie verschiebt nur, wie viel vom Ergebnis ihm und seinen Mitspielern zugerechnet wird.',
  correct: () => 'Für den ganzen Spieltag: Wer tatsächlich in welchem Team war (Tausch, Nachzügler, Ausfall). Die Teamstärken werden dann mit den Bewertungen vom Zeitpunkt der Teambildung neu gerechnet. Betrifft eine Änderung nur ein einzelnes Spiel, trägst du sie dort unter „Besetzung und Umstellungen“ ein.',
  rec: () => `Ein Vorschlag erscheint, wenn die Ergebnisse laut Modell mit mindestens ${pctTxt(ana().conf)} Wahrscheinlichkeit zeigen, dass eine Bewertung in eine Richtung danebenliegt – um mindestens ${fmt(ana().minChange, 1)} Punkte und nach mindestens ${ana().minGames} Spielen mit Toren. „Spiele ansehen“ zeigt jedes einzelne Spiel und wie viel es beiträgt. Nichts ändert sich ohne deinen Klick, jede Übernahme lässt sich rückgängig machen.`,
  forest: () => 'Ring = aktuelle Bewertung. Punkt = Modellschätzung aus Bewertung und Ergebnissen. Balken = wahrscheinlicher Bereich: Laut Modell liegt die Stärke mit ' + ciPct() + ' Wahrscheinlichkeit darin. Ein langer Balken heißt: noch wenig Daten. Liegt der Ring weit außerhalb des Balkens, passt die Bewertung nicht zu den Spielen. Raute = Wertung allein aus Ergebnissen. Der Punkt liegt oft zwischen Ring und Raute, aber nicht immer: Die Raute rechnet alle Spieler vom Gruppenschnitt aus, der Punkt dagegen mit den Bewertungen aller Mit- und Gegenspieler. Gewann z. B. ein Team, dessen übrige Spieler laut Bewertung schwach sind, spricht das im Punkt für den Starken darin – auch dann, wenn die Raute ihn niedriger sieht, weil sie seine Mitspieler für stärker hält.',
  gkLab: () => 'Wer im Tor stand, bekommt aus diesen Spielen eine eigene Schätzung seiner Torwart-Stärke – unabhängig von seiner Feldstärke. Gerechnet wird wie bei den Feldspielern: Ließ ein Team mit ihm im Tor weniger Tore zu bzw. holte mehr Toranteil als erwartet, spricht das für eine höhere Torwart-Stärke. Zeit im Tor zählt anteilig (½ Spiel im Tor = halbes Gewicht). Mit einem Klick übernimmst du einen deutlichen Vorschlag als Torwart-Stärke.',
  backups: () => 'Vor jedem Ersetzen, Teile-Übernehmen, Wiederherstellen und vor „Alle Runden“ bzw. „Alle Bewertungen“ löschen legt die App automatisch eine Sicherung des geöffneten Projekts an – die letzten drei je Projekt, nur in diesem Browser. Sie ersetzt keine Sicherungsdatei.',
  calib: () => 'Prüft alle Spiele auf einmal: Lassen die heutigen Bewertungen die Ergebnisse erwarten? Toranteil = Anteil der Tore, den ein Team erzielt hat (7:3 = 70 %). Er ist unabhängig davon, wie lange gespielt wurde und wie viele Tore an einem Ort typisch fallen.',
  share: () => 'Alle Tore aus Spielen mit Spielstand zusammengezählt, aus Sicht seines Teams. „Erwartet“ ist der Anteil, den die heutigen Bewertungen aller Beteiligten nahelegen – je Spiel gewichtet mit der Zahl der Tore.',
  prob: () => 'Die Schätzung verbindet die Bewertung mit allen Spielen, in denen er dabei war, und rechnet Mit- und Gegenspieler heraus. Laut Modell liegt die Stärke mit ' + ciPct() + ' Wahrscheinlichkeit im angegebenen Bereich. Die Wahrscheinlichkeit sagt, wie sicher die Richtung ist – sie gilt unter den Annahmen des Modells und ist keine garantierte Trefferquote.',
  combine: () => 'Bewertung und Ergebnisse werden wie zwei Messungen mit unterschiedlicher Genauigkeit verrechnet: Jede zählt umso mehr, je sicherer sie ist (Kehrwert der Unsicherheit zum Quadrat). Deine Bewertung startet mit der Unsicherheit aus „Wie sicher bist du?“. Jedes Spiel macht die Ergebnisse genauer, ältere Spiele zählen nach der Halbwertszeit weniger. Weil Mit- und Gegenspieler mitgeschätzt werden, ist der Anteil eine gute Näherung, keine exakte Aufteilung.',
  contrib: () => 'Um wie viel jedes Spiel die Schätzung verschoben hat. Die Beiträge sind bereits um den Zufall bereinigt: Ein einzelnes Spiel bewegt wenig, viele gleichgerichtete viel. Alle Zeilen zusammen ergeben genau den Unterschied zwischen Bewertung und Schätzung. „Über Mit- und Gegenspieler“: Andere Spiele verändern, was über seine Mitspieler bekannt ist – und damit, was für ihn übrig bleibt.',
  confound: () => 'Die Ergebnisse zeigen nur, wie Teams im Vergleich abschneiden. Spielen zwei Spieler immer gegeneinander, ist nur ihr Unterschied bekannt; spielen sie immer zusammen, nur ihre Summe. Die App teilt die Abweichung dann zu gleichen Teilen auf, so wie es zu ihren Bewertungen passt.',
  place: () => 'Je Ort (ohne Ortsangabe getrennt nach Untergrund): wie viele Tore typischerweise fallen. Für die Bewertung ist das nicht nötig, weil nur der Toranteil zählt. Die Tabelle zeigt es zur Kontrolle und für Ergebnisse, die nur als Tendenz eingetragen sind.',
  feel: () => `Nur du weißt, ob das Ergebnis dem Spielverlauf entsprach. Ohne Angabe zählt das Ergebnis normal. „Passt“ bestätigt es: Es zählt dann 1,25-fach – ein Spiel, an das du dich erinnerst, sagt mehr als eines, bei dem du es nicht mehr weißt. Glückstore, Patzer oder eine Verletzung gehören auch hierher: Hat das Glück das Ergebnis deutlicher gemacht, als das Spiel war, ist es „ausgeglichener“. „Etwas/deutlich ausgeglichener“ und „etwas/deutlich einseitiger“ gehen als zweite Messung desselben Spiels ein: bei derselben Torzahl, aber mit einem Toranteil, der näher an der Mitte bzw. weiter außen liegt (gerechnet im Verhältnis der Tore, auf beiden Seiten gleich stark: etwas = Hälfte bzw. 1,5-fach, deutlich = ein Fünftel bzw. 2,2-fach). Wie viel diese zweite Messung zählt, stellst du unter Einstellungen → Auswertung ein (jetzt: ${({ 0: 'gar nicht', 0.5: 'halb so viel wie ein Ergebnis', 1: 'so viel wie ein Ergebnis', 2: 'doppelt so viel wie ein Ergebnis' })[ana().feelW]}).`,
  lineupEx: () => 'Ausgangspunkt sind die Teams der Runde. Jede Umstellung gilt ab ihrem Zeitpunkt bis zum Spielende oder zur nächsten Umstellung desselben Spielers. „Kommt dazu“: spielte vorher nicht mit – auch für Spieler von außen, die einspringen. „Wechselt zu“: spielt ab da für das andere Team (auch hin und zurück möglich). „Geht raus“: ab da nicht mehr dabei. Wer im Tor stand, trägst du darunter als Anteil der Spielzeit ein; zusammen höchstens 100 % je Team. Die übrige Zeit steht der eingeplante feste Torwart im Tor. Ohne Spieldauer gibst du den Zeitpunkt als Anteil an (½ = zur Hälfte). Die App rechnet jeden Abschnitt mit seiner Besetzung und gewichtet ihn nach seiner Dauer – auch Unterzahl. „Müde“: Das Team hat direkt vorher gespielt; jeder zählt dann um den eingestellten Abschlag schwächer (Einstellungen → Auswertung).',
  tend: () => 'Für Spiele ohne genauen Stand, z. B. wenn ihr nur die Differenz mitzählt. Mit Tor-Unterschied (z. B. +5) zählt das Spiel so viel wie ein Ergebnis mit Toren. Die Torzahl ist dabei optional: +5 bei etwa 125 Toren (65:60) ist ein enges Spiel, +5 bei 9 Toren (7:2) ein klares – ohne Angabe rechnet die App mit der üblichen Torzahl des Ortes. „Nur ungefähr“ halbiert das Gewicht. Weißt du nur „knapp“ (etwa 4:3) oder „klar“ (etwa 2:1), zählt das Spiel halb so viel, weil das viel ungenauer ist.',
  approx: () => 'Wenn du die Tore nicht genau weißt, z. B. „ungefähr 11:1“. So ein Ergebnis zählt halb so viel wie ein genaues. Weißt du nur, wer gewonnen hat, stell oben auf „Sieger und Unterschied“.',
  resDay: () => 'Alles, was du am Spieltag für den Tag einstellst – Tagesform, fester Torwart samt Zeit im Tor, Rolle, Pausen und die Regel ohne festen Torwart –, lässt sich hier nachträglich richtigstellen. Fest bleibt nur der Bewertungsstand der Spieler vom Anlegen der Runde. Beim Speichern rechnet die App Teamstärken und Erwartung dieser Runde mit diesen Angaben neu, die Auswertung nutzt dann die korrigierten Werte.',
  cancelled: () => 'Beides brauchst du nur selten. „Runde ist ausgefallen“: Sie fand nicht statt, bleibt in der Liste, zählt in keiner Auswertung, und die Erinnerung ans Eintragen verschwindet. „Nicht auswerten“: gespielt, aber nicht werten (z. B. Spaßspiel mit vertauschten Rollen).',
  ci: () => 'Jede Schätzung hat eine Unsicherheit σ (Standardabweichung, in Punkten). Angezeigt wird der Bereich Schätzung ± z·σ, in dem der wahre Wert mit der gewählten Wahrscheinlichkeit liegt: 68 % (±1σ), 80 % (±1,28σ, Standard), 90 % (±1,64σ) oder 95 % (±1,96σ). Die Skala endet nicht bei 0 und 10, weil ein Bereich ein Wahrscheinlichkeitsbereich ist, nicht „alles ist möglich“.',
  basis: () => 'Womit die Teamstärke gerechnet wird. „Bewertungen + Ergebnisse“ nimmt für jeden Spieler die Schätzung aus dem Rückblick: deine Bewertung, verschoben um das, was die Spiele zeigen. Bei neuen Spielern zählt fast nur die Bewertung, mit vielen Spielen immer mehr das Ergebnis. Die Bewertungen selbst bleiben unverändert.',
  dataOnly: () => 'Eine zweite, unabhängige Wertung: Alle Spieler starten beim Gruppenschnitt, die eingestellten Stärken werden nicht verwendet, Einschätzungen und Markierungen auch nicht. Was hier steht, sagen allein die Ergebnisse. Für Vorschläge zählt sie nicht – dort ist die Bewertung das Fundament –, aber sie zeigt, wo Bewertung und Spiele auseinanderliegen. Bei sehr einseitigen Ergebnissen kann sie über das Ende der Skala hinausgehen (z. B. „über 10“).',
  rounds: () => 'Eine Runde = eine Teameinteilung mit allen Spielen, die in dieser Besetzung gespielt wurden (bei drei Teams z. B. jeder gegen jeden). Wird neu eingeteilt, beginnt eine neue Runde – auch am selben Tag. Die Liste zeigt sie nach Tagen. Je Spiel: Ergebnis, was die Teamstärken beim Bilden erwarten ließen (bei derselben Torzahl), und die Abweichung; rot = überraschend.',
  lab: () => 'Erst mit vielen Spielen lässt sich mehr ablesen als der Zufall. Jede Auswertung erscheint deshalb erst ab einer Mindestzahl; der Balken zeigt, wie viel noch fehlt. Zählt nur, was in die Auswertung eingeht: Runden mit Ergebnis, nicht ausgeschlossen. Der Regler-Check rechnet alle Spiele mit anderen Reglerwerten durch und vergleicht, unter welchem Wert eure Ergebnisse am wahrscheinlichsten sind. Ein Hinweis ist ein Anlass zum Nachdenken, kein Befehl – die App ändert nie selbst etwas.',
  surprise: () => 'Bei wenigen Toren ist viel Zufall normal: 2:1 statt 1:2 sagt kaum etwas. „Wie erwartet“: Abweichung kleiner als der übliche Zufall. „Etwas überraschend“: ein- bis zweimal so groß. „Sehr überraschend“: mehr als das Doppelte – kommt bei etwa jedem zwanzigsten Spiel vor.',
  gammaCheck: () => 'Die App rechnet eure Spiele mit allen drei Stufen durch und vergleicht, unter welcher Annahme die Ergebnisse am wahrscheinlichsten sind (Modellvergleich mit Bayes-Faktor). Ein Hinweis erscheint erst, wenn eine andere Stufe mindestens zehnmal besser passt.',
  byPlace: () => 'Toranteil seines Teams je Ort, zusammengezählt über die Spiele mit Toren. Das ist beschreibend: Mit- und Gegenspieler sind hier nicht herausgerechnet, und bei wenigen Spielen je Ort ist viel Zufall dabei.',
  keeper: () => 'Gegentore in Spielen, in denen er fester Torwart war, verglichen mit dem, was die Teamstärken erwarten ließen. Roh gezählt: Die Feldspieler sind hier nicht herausgerechnet. Die Schätzung der Torwart-Stärke aus den Ergebnissen steht direkt darunter und im Rückblick unter „Torhüter“.',
  spread: () => 'Teams und Auswertung rechnen mit Stärkeunterschieden in Prozent der Teamstärke. Liegen alle zwischen 8 und 10, wirkt ein guter Spieler kaum anders als ein schwacher; liegen alle zwischen 5 und 6, sind alle Teams scheinbar gleich. Beides verwässert die Teambildung. Geprüft wird nur, wer aktiv und eingeschätzt ist.',
  forecast: () => 'Der Balken rechnet mit den Bewertungen – genau den Teamstärken oben. Aus dem Stärkeunterschied in % folgt der erwartete Toranteil, aus dem Torniveau des Ortes die Torzahl (mit geplanter Spielzeit: Tore je Stunde × Minuten). Daraus ergibt sich, wie oft jedes Team gewinnen würde. Wichtig: Je mehr Tore fallen, desto seltener entscheidet der Zufall. Bei 38 Toren gewinnt ein Team, dem 66 % der Tore zugetraut werden, fast immer – obwohl die Teamstärken „nur“ 17 % auseinanderliegen. Im erweiterten Modus steht darunter zum Vergleich dieselbe Prognose mit den Schätzungen aus euren bisherigen Ergebnissen statt der Bewertungen. „Kaum Unterschied“ heißt: Die Ergebnisse bestätigen die Bewertungen.',
  expect: () => 'So viel der Tore lassen die Teamstärken beim Bilden erwarten. Ein einzelnes Ergebnis widerlegt das nicht – erst über viele Spiele zeigt sich, ob Bewertungen danebenliegen.',
  halfLife: () => 'Spieler entwickeln sich. Mit einer Halbwertszeit zählen ältere Spieltage schrittweise weniger: nach einer Halbwertszeit halb, nach zwei ein Viertel. „Alle gleich“ ist sinnvoll, wenn sich die Gruppe kaum verändert.',
  move: () => `Legt fest, wie sicher die App den heutigen Bewertungen vertraut. Normal gilt die Unsicherheit aus „Wie sicher bist du?“ im Profil: ${CONF_KEYS.map(k => `${CONF[k].label} ±${fmtS(CONF[k].prior)}`).join(', ')} Punkte. Vorsichtig nimmt 70 %, schnell 140 % davon.`,
  recConf: () => 'Ein Vorschlag erscheint erst, wenn die Bewertung mindestens mit dieser Wahrscheinlichkeit in eine Richtung danebenliegt. Höher = seltener, dafür seltener falsch.',
