/* Rasengrün als Grundton, Teamfarben wie Leibchen. Eine Spalte am Handy, Bedienleiste unten für den Daumen. */
:root {
  --bg: #f1f0ea; --surface: #fffefb; --surface-2: #e9e8df; --line: #d8d5c8;
  --ink: #142019; --muted: #56655c; --turf: #1d5c3a; --turf-ink: #ffffff; --turf-soft: #d6e8dc;
  --good: #1f8048; --warn: #a56a00; --bad: #b9382a;
  --r: 12px; --r-sm: 8px;
  --shadow: 0 1px 2px rgba(20, 40, 28, .07), 0 6px 20px -12px rgba(20, 40, 28, .3);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Bahnschrift SemiCondensed', 'Bahnschrift', 'Avenir Next Condensed', 'Roboto Condensed', 'sans-serif-condensed', 'Arial Narrow', 'DejaVu Sans Condensed', system-ui, sans-serif;
  --nav-h: 62px; --top-bg: #1d5c3a; --top-ink: #ffffff; --lamp-ink: #ffffff;
  --est: #2f63b4;   /* Werte, die die App aus Ergebnissen schätzt */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #161e19; --surface-2: #1e2822; --line: #2c3a31;
    --ink: #e4ece6; --muted: #98a89e; --turf: #5cc48b; --turf-ink: #06200f; --turf-soft: #1c3a29;
    --good: #52c67b; --warn: #e2ab43; --bad: #f0705f; --top-bg: #15382a; --top-ink: #e4ece6; --lamp-ink: #08140d; --est: #86b2f2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #161e19; --surface-2: #1e2822; --line: #2c3a31;
  --ink: #e4ece6; --muted: #98a89e; --turf: #5cc48b; --turf-ink: #06200f; --turf-soft: #1c3a29;
  --good: #52c67b; --warn: #e2ab43; --bad: #f0705f; --top-bg: #15382a; --top-ink: #e4ece6; --lamp-ink: #08140d; --est: #86b2f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-tap-highlight-color: transparent; }
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h2, h3, .projbtn, .lamp, .team-head, .strength .bigval .num, .welcome h2, .tglbl, .balance span { font-family: var(--font-display); }
h2 { letter-spacing: .01em; }
.block-head h2, .block > h2 { font-size: 1.22rem; font-weight: 700; }
.vtext h2 { font-weight: 700; letter-spacing: .005em; }
.team-head h3 { font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.lamp { font-weight: 700; }
h2 { font-size: 1.12rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hint { font-size: .86rem; color: var(--muted); }
.errtxt { color: var(--bad); font-size: .88rem; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* ---------- Kopf und Navigation ---------- */
.top { position: sticky; top: 0; z-index: 20; background-color: var(--top-bg); background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .055) 0 64px, rgba(0, 0, 0, .03) 64px 128px), linear-gradient(180deg, rgba(255, 255, 255, .06), transparent 60%); color: var(--top-ink); padding-top: env(safe-area-inset-top); box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 6px 18px -12px rgba(0, 0, 0, .5); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .5) 0 14px, transparent 14px 24px); opacity: .35; pointer-events: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background-image: radial-gradient(900px 420px at 50% -160px, rgba(120, 220, 160, .10), transparent 70%); background-attachment: fixed; } }
:root[data-theme="dark"] body { background-image: radial-gradient(900px 420px at 50% -160px, rgba(120, 220, 160, .10), transparent 70%); background-attachment: fixed; }
.top-in { display: flex; align-items: center; gap: 14px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand svg { display: block; opacity: .9; }
#logo img { display: block; width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .3), 0 2px 6px rgba(0, 0, 0, .25); }
.brand h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: .01em; white-space: nowrap; }
.brand .sub { font-size: .8rem; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); color: var(--ink); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; min-height: var(--nav-h); border: 0; background: none; color: var(--muted); font-size: .7rem; font-weight: 600; }
.nav button.on { color: var(--turf); }
.nav button.on svg { stroke-width: 2.3; }
@media (min-width: 900px) {
  .nav { position: static; background: none; border: 0; padding: 0; gap: 2px; color: inherit; flex: none; }
  .nav button { flex-direction: row; gap: 7px; min-height: 40px; padding: 0 12px; border-radius: 999px; color: var(--top-ink); opacity: .8; font-size: .9rem; }
  .nav button svg { width: 18px; height: 18px; }
  .nav button.on { opacity: 1; background: color-mix(in srgb, var(--top-ink) 16%, transparent); color: var(--top-ink); }
  :root { --nav-h: 0px; }
}

/* ---------- Seite und Blöcke ---------- */
main.wrap { padding-top: 16px; padding-bottom: calc(var(--nav-h) + 110px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.block.empty { text-align: left; }
.lbl { font-size: .82rem; font-weight: 650; color: var(--muted); }
.lblrow { display: flex; align-items: center; gap: 6px; }
.field { display: grid; gap: 7px; min-width: 0; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.fields > .field { align-content: start; }
.fields.three { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow, .grow { flex: 1 1 180px; min-width: 0; }
.summary { font-weight: 600; }
.banner { border-radius: var(--r); padding: 12px 14px; border: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner p { flex: 1 1 240px; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 11%, var(--surface)); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 9%, var(--surface)); }
.banner.newdone p { flex-basis: 100%; font-size: .9rem; }
.banner .ndlist { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.banner .ndlist .btn { white-space: nowrap; }
.banner.ok { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.coll .collhead { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: left; flex: 1; min-height: 32px; }
.coll .chev { transition: transform .18s; display: inline-flex; color: var(--muted); }
.coll.open .chev { transform: rotate(180deg); }
details > summary { cursor: pointer; padding: 4px 0; }
details[open] > summary { margin-bottom: 6px; }

/* ---------- Eingaben ---------- */
input[type=text], input[type=search], input[type=number], input[type=date], input[type=time], input[type=tel], select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; min-height: 44px; width: 100%; min-width: 0;
}
textarea { resize: vertical; }
input.numin { width: 4.6em; min-height: 36px; padding: 5px 6px; text-align: center; }
input[type=range] { width: 100%; accent-color: var(--turf); min-height: 30px; }
/* Kein automatisches Hineinzoomen beim Antippen von Eingabefeldern (iPhone zoomt bei Schrift unter 16 px) */
@media (hover: none) and (pointer: coarse) { input:not([type=range]):not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px !important; } }
html { touch-action: manipulation; }
/* Noch nicht eingeschätzt: Regler grau, bis man ihn bewegt */
input[type=range].unr { accent-color: #9aa59e; opacity: .85; }
.chk { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; }
.chk input { width: 18px; height: 18px; accent-color: var(--turf); }
.chk input.numin { width: 4.6em; height: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); font-weight: 650; white-space: nowrap; }
/* Knöpfe mit langem Text (in Hinweisen, Zeilen, Feld-Angaben) dürfen umbrechen, statt die Seite zu verbreitern */
.banner .btn, .row .btn, .fieldnote .btn { white-space: normal; text-align: center; line-height: 1.2; padding-top: 5px; padding-bottom: 5px; max-width: 100%; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn.on { background: var(--turf-soft); border-color: var(--turf); }
.btn.big { min-height: 50px; padding: 0 22px; font-size: 1.02rem; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--turf); font-weight: 650; text-decoration: underline; }
.mini { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; color: var(--muted); flex: none; }
.mini:hover:not(:disabled) { border-color: var(--line); }
.mini.on { background: var(--turf-soft); color: var(--turf); border-color: var(--turf); }
.ib { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: italic 700 .78rem/1 Georgia, serif; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; vertical-align: middle; }
.ib.on { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
/* Herkunft eines Werts: eure Bewertung (Person) oder Schätzung der App aus Ergebnissen (Verlauf) */
.src { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 650; line-height: 1.2; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; vertical-align: middle; }
.src svg { flex: none; }
.src.src-r { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.src.src-m { background: color-mix(in srgb, var(--est) 13%, var(--surface)); color: var(--est); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--est) 40%, transparent); }
.srci { display: inline-flex; vertical-align: -2px; margin-right: 3px; }
.srci.src-r { color: var(--muted); }
.srci.src-m { color: var(--est); }
.srclegend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.lblrow:has(> .src) { flex-wrap: wrap; }
.vtext { flex: 1 1 auto; }
@media (pointer: coarse) { .ib { position: relative; } .ib::after { content: ""; position: absolute; inset: -9px; } }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { min-height: 38px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-size: .9rem; font-weight: 550; }
.seg button.on { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
.seg.stack { flex-direction: column; align-items: stretch; }
.seg.stack button { text-align: left; }
/* Ruhige Umschalter für Ansichten: klein, ohne kräftiges Grün */
.seg.pill { display: inline-flex; flex-wrap: nowrap; gap: 0; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.seg.pill button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-size: .82rem; color: var(--muted); }
.seg.pill button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 40, 28, .15); }
.viewbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
@media (pointer: coarse) { .linkbtn { padding: 6px 0; } }
.linkbtn.quiet { color: var(--muted); font-weight: 550; font-size: .82rem; }
.seg.big button { min-height: 44px; padding: 0 22px; font-size: 1rem; }
.seg.ten button { min-width: 34px; padding: 0 6px; }
.seg.ten button.half { background: color-mix(in srgb, var(--turf) 45%, var(--surface)); color: var(--ink); border-color: var(--turf); }

.seg.ten button.ghost { border-style: dashed; border-color: var(--turf); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; flex: none; }
.stepper button { width: 36px; height: 36px; border: 0; background: transparent; font-size: 1.15rem; font-weight: 600; color: var(--ink); }
.stepper button:hover { background: var(--surface-2); }
.stepper .val { min-width: 34px; text-align: center; font-weight: 700; }
.stepper.big button { width: 44px; height: 44px; }
.stepper.big .val { min-width: 46px; font-size: 1.1rem; }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch.on { background: var(--turf); border-color: var(--turf); }
.switch.on::after { transform: translateX(18px); }
.tag { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 650; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
.tag.gk { background: color-mix(in srgb, var(--turf) 16%, var(--surface)); color: var(--turf); }
.tag.form { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.tag.alert { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); color: var(--bad); }
.tag.pinned { background: var(--turf-soft); color: var(--turf); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 650; color: var(--muted); white-space: nowrap; }
tr.sum td { font-weight: 700; }
td:last-child, th:last-child { text-align: right; }
table.grid td:last-child, table.grid th:last-child { text-align: left; }
.up { color: var(--good); font-weight: 650; }
.down { color: var(--bad); font-weight: 650; }

/* ---------- Start ---------- */
.welcome { background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--turf) 4%, transparent) 0 40px, transparent 40px 80px); background-color: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 20px; display: grid; gap: 16px; max-width: 640px; margin: 8px auto 0; width: 100%; }
.welcome-pitch { color: var(--turf); }
.welcome-pitch svg { width: 52px; height: 52px; }
.welcome-pitch img { display: block; width: 64px; height: 64px; border-radius: 16px; box-shadow: var(--shadow); }
.welcome h2 { font-size: 1.6rem; font-weight: 800; }
.welcome .lead { font-size: 1.02rem; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-weight: 600; }

/* ---------- Spieltag ---------- */
.addrow { display: flex; gap: 8px; align-items: flex-start; }
.addrow textarea { min-height: 44px; flex: 1; }
.listtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.listtools input[type=search] { flex: 1 1 200px; }
.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 6px 4px 4px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); }
.prow.on { border-color: color-mix(in srgb, var(--turf) 55%, var(--line)); background: color-mix(in srgb, var(--turf) 6%, var(--surface)); }
.pcheck { flex: 1 1 0; display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; background: none; text-align: left; padding: 0 4px; min-width: 0; }
.pcheck .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); flex: none; position: relative; }
.prow.on .pcheck .box { background: var(--turf); border-color: var(--turf); }
.prow.on .pcheck .box::after { content: ""; position: absolute; left: 6px; top: 1px; width: 6px; height: 12px; border: solid var(--turf-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.pname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.pname small { font-weight: 400; color: var(--muted); }
.prow:not(.on) .stepper { opacity: .55; }
.pday { flex-basis: 100%; display: grid; gap: 12px; padding: 10px 6px 8px; border-top: 1px dashed var(--line); }

/* ---------- Teams: Urteil ---------- */
.verdict { display: flex; gap: 16px; align-items: center; }
.lamp { width: 84px; height: 84px; border-radius: 50%; flex: none; display: flex; align-items: baseline; justify-content: center; padding-top: 26px; color: var(--lamp-ink); font-weight: 800; font-size: 1.55rem; line-height: 1; }
.lamp small { font-size: .85rem; margin-left: 1px; }
@media (max-width: 560px) {
  .verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: center; }
  .verdict .lamp { width: 62px; height: 62px; padding-top: 19px; font-size: 1.2rem; grid-row: 1; }
  .verdict .vtext { display: contents; }
  .verdict .vtext > * { grid-column: 1 / -1; }
  .verdict .vtext > .lblrow { grid-column: 2; grid-row: 1; }
  .vtext h2 { font-size: 1.25rem; }
  .report li { grid-template-columns: 12px minmax(0, 1fr); } .report li .rt { grid-column: 2; }
}
details.vdet > summary { font-weight: 650; font-size: .9rem; }
.lamp.good { background: var(--good); }
.lamp.warn { background: var(--warn); }
.lamp.bad { background: var(--bad); }
.vtext { display: grid; gap: 5px; min-width: 0; }
.vtext h2 { font-size: 1.45rem; font-weight: 800; }
.balance { display: flex; border-radius: var(--r-sm); overflow: hidden; position: relative; min-height: 36px; border: 1px solid var(--line); }
.balance span { position: relative; background: var(--bib-bg, var(--bib)); color: var(--bib-ink); display: flex; align-items: center; justify-content: center; gap: 5px; font-size: .84rem; white-space: nowrap; overflow: hidden; padding: 0 6px; min-width: 0; font-variant-numeric: tabular-nums; }
.balance .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; transform: translateX(-1px); }
.report { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.report li { display: grid; grid-template-columns: 12px 9.5em 1fr; gap: 8px; align-items: baseline; font-size: .9rem; }
.report .dotst { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); align-self: start; margin-top: .32em; }
.report .st-good .dotst { background: var(--good); }
.report .st-warn .dotst { background: var(--warn); }
.report .st-bad .dotst { background: var(--bad); }
.report .st-off .dotst { background: transparent; border: 1.5px solid var(--muted); }
.report .st-off .rt { color: var(--muted); }
@media (max-width: 520px) { .report li { grid-template-columns: 12px 1fr; row-gap: 0; } .report .rt { grid-column: 2; } }
.utable td:nth-child(2), .utable td:nth-child(3) { text-align: right; }

/* ---------- Varianten ---------- */
.vars { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.var { text-align: left; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 10px 12px; display: grid; gap: 4px; align-content: start; }
.var.on { border-color: var(--turf); background: color-mix(in srgb, var(--turf) 7%, var(--surface)); }
.vh { display: flex; align-items: center; gap: 10px; }
.vh b { font-size: 1.15rem; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.var.on .vh b { background: var(--turf); color: var(--turf-ink); }
.vstat { flex: 1; font-weight: 650; font-size: .9rem; }
.vpct { font-weight: 800; font-variant-numeric: tabular-nums; }
.vpct.good { color: var(--good); } .vpct.warn { color: var(--warn); } .vpct.bad { color: var(--bad); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Teamkarten (Leibchen) ---------- */
.teams { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
/* Mit Rechnung: höchstens zwei Teams nebeneinander, damit die Tabelle ohne Querscrollen passt */
.teams.calc { grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr)); }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.team.drop { outline: 3px solid var(--turf); outline-offset: 2px; }
.team-head { background: var(--bib-bg, var(--bib)); color: var(--bib-ink); display: flex; align-items: baseline; gap: 10px; padding: 12px 14px 10px; position: relative; }
.team-head::before, .balance span::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(255, 255, 255, .2) 1px, transparent 1.7px), radial-gradient(circle, rgba(0, 0, 0, .12) 1px, transparent 1.7px); background-size: 7px 7px, 7px 7px; background-position: 0 0, 3.5px 3.5px; }
.team-head > *, .balance span > * { position: relative; }
.team-head h3 { font-size: 1.35rem; font-weight: 850; flex: 1; letter-spacing: .01em; }
.tcount { font-size: .85rem; opacity: .85; }
.tval { font-size: 1.35rem; font-weight: 800; }
.tval small { font-size: .78rem; font-weight: 600; opacity: .8; }
.team-sub { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 8px 14px; font-size: .84rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.team-tools { margin-left: auto; display: flex; gap: 4px; }
.colors { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cdot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--cbg, var(--c)); padding: 0; }
.cdot.on { outline: 3px solid var(--turf); outline-offset: 2px; }
.tlist { list-style: none; margin: 0; padding: 4px 6px; }
.tp { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: var(--r-sm); }
.tp + .tp { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.tp.sel { background: var(--turf-soft); }
.rb { flex: none; width: 40px; text-align: center; font-size: .72rem; font-weight: 800; padding: 4px 0; border-radius: 6px; background: var(--surface-2); color: var(--muted); cursor: grab; touch-action: none; user-select: none; }
.rb.gk { background: var(--turf); color: var(--turf-ink); }
.rb.off { box-shadow: inset 0 0 0 1.5px var(--warn); color: var(--warn); }
.rb.loose { opacity: .7; }
.nm { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 7px 2px; font-weight: 600; overflow-wrap: anywhere; min-height: 40px; }
.sv { font-weight: 700; min-width: 2.4em; text-align: right; }
.tp .mini { width: 34px; height: 34px; }
.calc td { white-space: nowrap; }
.calc td[colspan] { white-space: normal; min-width: 14em; }
/* Teamkarten nebeneinander: gemeinsame Zeilen (subgrid), damit Liste, Rechnung und Balken auf gleicher Höhe stehen */
@supports (grid-template-rows: subgrid) {
  .teams { align-items: stretch; }
  .team { display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: 0; align-content: start; }
  .team > .tlist, .team > .tbody { align-self: start; }
}
.team .tcalc > .calc { padding: 8px 14px 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.team > .calc { padding: 8px 14px 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.dims { padding: 10px 14px 14px; display: grid; gap: 5px; border-top: 1px solid var(--line); }
.dim { display: grid; grid-template-columns: 8.5em 1fr 2.4em 2.6em; gap: 8px; align-items: center; font-size: .82rem; }
.dim .bar { height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.dim .bar i { display: block; height: 100%; background: var(--bib-bg, var(--bib)); border-radius: 4px; }
.dim .num { text-align: right; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
.dragghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -130%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 999px; font-weight: 650; font-size: .9rem; white-space: nowrap; }

/* ---------- Spielfeld ---------- */
.pitch { margin: 10px 12px 12px; border-radius: var(--r-sm); background: repeating-linear-gradient(180deg, #2f7d4b 0 34px, #2a7444 34px 68px); padding: 10px 4px; display: grid; gap: 8px; border: 2px solid rgba(255, 255, 255, .55); }
.prow3 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.zone { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.pchip { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 2px; max-width: 72px; color: #fff; }
.pchip .dot { touch-action: none; cursor: grab; width: 34px; height: 34px; border-radius: 50%; background: var(--bib-bg, var(--bib)); color: var(--bib-ink); display: flex; align-items: center; justify-content: center; font-size: .76rem; font-weight: 800; border: 2px solid rgba(255, 255, 255, .85); }
.pchip .dot.offp { border-color: #ffcf5a; }
.pchip.sel .dot { outline: 3px solid #fff; }
.pchip .cn { font-size: .7rem; font-weight: 650; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Spieler ---------- */
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pl { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 10px 12px; }
.pl:hover { border-color: var(--muted); }
.pl .score { grid-row: span 2; align-self: center; font-size: 1.3rem; font-weight: 800; color: var(--turf); }
.pl .meta { font-size: .82rem; color: var(--muted); }
.bulk { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.bulk li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--line); }
.bulk .bn { flex: 0 0 9em; font-weight: 600; }

/* ---------- Profil (Blatt) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; border: 0; background: rgba(8, 16, 11, .45); }
.sheet { position: relative; width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 16px; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
@media (min-width: 760px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 16px; max-height: 88vh; } }
.sheet-head { position: sticky; top: 0; z-index: 20; background: var(--surface); display: flex; align-items: center; gap: 6px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 1.25rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strength .bigval { display: flex; align-items: baseline; gap: 12px; }
.strength .bigval .num { font-size: 2.3rem; font-weight: 850; color: var(--turf); line-height: 1; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; font-size: .82rem; align-items: center; }
.refs span:not(.muted) { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); }
.refs .me { background: var(--turf) !important; color: var(--turf-ink); font-weight: 700; }
.rangerow { display: flex; gap: 12px; align-items: center; }
.rangerow .num { min-width: 2em; font-weight: 700; }
.attr { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.fitrow { display: grid; grid-template-columns: 6.5em 1fr; gap: 8px; align-items: center; }
.impact { font-size: .9rem; }

/* ---------- Regeln ---------- */
.rform { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.rform .full { grid-column: 1 / -1; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; }
.rules li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rules li:last-child { border-bottom: 0; }
.rules li.off .grow { opacity: .5; }
.rprio { display: block; margin-top: 6px; }
.rprio .seg button { min-height: 30px; font-size: .8rem; padding: 0 9px; }

/* ---------- Einstellungen ---------- */
.profiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pcard { display: grid; gap: 4px; text-align: left; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 12px; }
.pcard.on { border-color: var(--turf); background: color-mix(in srgb, var(--turf) 8%, var(--surface)); }
.pcard.static { cursor: default; }
.wrow { display: grid; grid-template-columns: 1fr minmax(120px, 220px) 3.6em; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.wrow .wl { display: grid; gap: 2px; }
.wrow output { text-align: right; font-weight: 700; }
/* Empfehlung als kleine Kerbe über dem Regler; bei abweichendem Wert zusätzlich als Text */
.rng { position: relative; display: block; min-width: 0; }
.rng input { position: relative; z-index: 1; display: block; }
.refmk { position: absolute; top: -1px; left: calc(9px + (100% - 18px) * var(--p)); width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; border-top: 7px solid var(--muted); border-bottom: 0; opacity: .7; pointer-events: none; }
.wrow.moved .refmk { border-top-color: var(--warn); opacity: 1; }
.refline { grid-column: 2 / -1; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: -2px; }
.refkey { width: 0; height: 0; border: 5px solid transparent; border-top: 6px solid var(--warn); border-bottom: 0; }
@media (max-width: 600px) { .refline { grid-column: 1 / -1; } }
.wrow .ex { grid-column: 1 / -1; color: var(--turf); }
.wrow .seg { grid-column: 2 / -1; }
@media (max-width: 600px) { .wrow { grid-template-columns: 1fr 3.6em; } .wrow .wl { grid-column: 1 / -1; } .wrow .seg { grid-column: 1 / -1; } }
.help { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.copybox textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }

/* ---------- Leisten und Hinweise ---------- */
.actionbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 22; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
@media (min-width: 900px) { .actionbar { bottom: 0; padding-bottom: env(safe-area-inset-bottom); } }
.actionbar .inner { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.actionbar .info { flex: 1; font-size: .9rem; line-height: 1.3; min-width: 0; }
.actionbar .info .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; max-width: 100%; }
.selbar { flex-wrap: wrap; }
.selbtns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bibbtn { gap: 7px; }
.bibbtn::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--bib-bg, var(--bib)); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ink) 25%, transparent); flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 86px + env(safe-area-inset-bottom)); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: .92rem; max-width: min(92vw, 520px); display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 50%, transparent); }
.pop { position: fixed; z-index: 55; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; font-size: .88rem; line-height: 1.45; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.busy { position: fixed; inset: 0; z-index: 70; background: color-mix(in srgb, var(--bg) 70%, transparent); display: flex; align-items: center; justify-content: center; font-weight: 750; font-size: 1.1rem; }
/* ---------- Rückblick und Ergebnis ---------- */
.nav button > span { position: relative; display: inline-flex; align-items: center; gap: 4px; }
.nav .ns { display: none; }
@media (max-width: 440px) { .nav .nl { display: none; } .nav .ns { display: inline; } .nav button { font-size: .66rem; } }
.badge { font-style: normal; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .68rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.tchip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--bib-bg, var(--bib)); color: var(--bib-ink); font-weight: 750; font-size: .82rem; border: 1px solid color-mix(in srgb, var(--ink) 18%, var(--surface)); background-clip: padding-box; }
.sheet { grid-template-columns: minmax(0, 1fr); }
.sheet > * { min-width: 0; }
.game { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.gamehead select { width: auto; min-height: 36px; padding: 4px 8px; }
.game .score { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.goal { display: grid; justify-items: center; gap: 6px; }
.colon { font-size: 1.6rem; font-weight: 800; color: var(--muted); align-self: flex-end; line-height: 1; padding-bottom: 12px; }
input.goalin { width: 2.4em; min-width: 0; border: 0; background: transparent; text-align: center; font-size: 1.35rem; font-weight: 800; min-height: 44px; padding: 0; -moz-appearance: textfield; }
.goalin::-webkit-outer-spin-button, .goalin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.corr { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.corr li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.corr .seg button { min-height: 32px; font-size: .82rem; padding: 0 9px; }
.rec { border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); }
.rec.conf-hoch { border-left-color: var(--good); }
.rec.conf-mittel { border-left-color: var(--turf); }
.rec-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
.rec-btns .btn { flex: 0 0 auto; }
.tag.conf { margin-left: 0; }
.hintbox { border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 6px; font-size: .9rem; }
.hintbox ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.sheet-head.withtabs { flex-wrap: wrap; padding-bottom: 8px; }
.restabs { flex: 1 1 100%; }
.restabs .seg.pill button { min-height: 32px; padding: 0 16px; font-size: .88rem; }
.upen .pcol { width: 42%; }
.upen th.r { text-align: right; }
.upen tr.sum td { border-top: 1.5px solid var(--line); border-bottom: 0; }
.upen .pwrap { display: flex; align-items: center; gap: 8px; }
.upen .pwrap .num { min-width: 3em; text-align: right; }
.pbar2 { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.pbar2 i { display: block; height: 100%; border-radius: 4px; }
.upen tr.p1 .pbar2 i { background: color-mix(in srgb, var(--good) 70%, transparent); }
.upen tr.p2 .pbar2 i { background: var(--warn); }
.upen tr.p3 .pbar2 i { background: var(--bad); }
.upen tr.p3 td:first-child { font-weight: 700; color: var(--bad); }
.upen tr.p2 td:first-child { font-weight: 650; color: var(--warn); }
.upen tr.p0 td { color: var(--muted); }
.rhandle { cursor: grab; color: var(--muted); padding: 6px 8px 6px 2px; touch-action: none; user-select: none; display: inline-flex; align-items: center; opacity: .7; }
.rhandle:hover { opacity: 1; color: var(--ink); }
.rules li.rdragging { opacity: .5; }
.rules li.dropb { box-shadow: inset 0 3px 0 var(--turf); }
.rules li.dropa { box-shadow: inset 0 -3px 0 var(--turf); }
.rnotebox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.rnote { flex: 1 1 200px; padding: 6px 10px; min-height: 0; font-size: .88rem; }
.rnotebtn { text-decoration: none; }
/* Handy: Kopfzeilen von Fenstern schlank halten, damit der Name lesbar bleibt */
@media (max-width: 480px) { .sheet-head .hidesm { display: none; } }
.showsm { display: none; }
@media (max-width: 480px) { .showsm { display: flex; } .edpa { justify-content: flex-start; width: 100%; } }
.sroster { gap: 4px; }
.prow.simple { padding: 0 6px 0 2px; }
.prow.simple .pcheck { min-height: 44px; }
.shareic { flex: none; width: 18px; height: 18px; margin-right: 4px; vertical-align: -3px; }
.simpletb { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.simpletb .btn { padding: 0 6px; min-height: 44px; }
/* Spieltag einfach */
.sdate { display: flex; align-items: center; gap: 4px; margin: -4px 0 10px; font-weight: 600; }
.sdate .dpnav { width: 34px; height: 34px; border: 0; background: none; font-size: 1.2rem; color: var(--muted); }
.prow.simple { align-items: center; }
.sstr { min-width: 36px; height: 30px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: .9rem; padding: 0 8px; }
.prow.simple.on .sstr { background: color-mix(in srgb, var(--turf) 14%, var(--surface)); }
.rb.plain { background: none; color: var(--muted); cursor: grab; touch-action: none; display: inline-flex; align-items: center; justify-content: center; opacity: .65; }

.seg.pill.wrap { flex-wrap: wrap; border-radius: 14px; }
.wreset { margin: 6px 0 12px; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 10px; }
@media (max-width: 520px) { .kpis.k3 { grid-template-columns: 1fr; } }
.labprog { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.labp { display: grid; grid-template-columns: minmax(0, 1fr) 120px 7.5em; align-items: center; gap: 4px 12px; font-size: .9rem; }
.labp .pbar { width: 120px; height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; flex: none; }
.labp .pbar i { display: block; height: 100%; background: color-mix(in srgb, var(--turf) 55%, transparent); border-radius: 4px; }
.labp.ok .pbar i { background: var(--turf); }
.labp .num { text-align: right; }
.labp .linkbtn { text-align: left; }
@media (max-width: 560px) { .labp { grid-template-columns: minmax(0, 1fr) auto; row-gap: 5px; } .labp .pbar { grid-column: 1 / -1; grid-row: 2; width: 100%; } }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.kv { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
.kv small { font-size: .9rem; font-weight: 650; color: var(--muted); }
.kl { font-size: .84rem; color: var(--muted); }
.chart { margin: 0; display: grid; gap: 4px; }
.chart svg { width: 100%; max-width: 560px; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .bar { fill: var(--turf); }
.chart .bar.close { fill: color-mix(in srgb, var(--turf) 45%, var(--surface)); }
.chart .hitbox { fill: transparent; }
.chart .hit:hover .bar { fill: var(--ink); }
.chart .dot { fill: var(--turf); stroke: var(--surface); stroke-width: 2; }
.chart .dot:hover { fill: var(--ink); }

.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mcard { width: 100%; display: grid; gap: 7px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 14px; color: var(--ink); }
.mcard:hover { border-color: var(--muted); box-shadow: var(--shadow); }
.mc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mc-facts { display: flex; flex-wrap: wrap; gap: 5px; }
.mc-facts .fact { font-size: .8rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.mc-teams { display: grid; gap: 3px; }
.mteam { display: flex; align-items: baseline; gap: 7px; font-size: .86rem; }
.mteam .tdot { width: 10px; height: 10px; border-radius: 50%; flex: none; align-self: center; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 20%, transparent); }
.mteam b { flex: none; min-width: 3.2em; }
.mteam .tl { color: var(--muted); }
.mrow { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 9px 12px; }
button.mrow:hover { border-color: var(--muted); }
.mrow .grow { min-width: 0; overflow-wrap: anywhere; }
.facts { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 2px 18px; font-size: .88rem; }
.facts li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.chart .avg { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; opacity: .75; }
.chart .mark { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 3 3; }
.msum { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface-2); border-radius: var(--r-sm); font-size: .86rem; }
.msum li { display: flex; gap: 8px; align-items: baseline; }
.msum .tchip { flex: none; }

/* ---------- Auswertung: Spielerübersicht und Diagramme ---------- */
.flist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.frow { width: 100%; display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'name num' 'bar bar'; gap: 2px 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 7px 10px; }
button.frow:hover { border-color: var(--muted); }
.frow.head { border: 0; background: none; padding: 0 10px; }
.frow .fname { grid-area: name; } .frow .fnum { grid-area: num; }
.frow.head > span:not(.fbar) { display: none; }
@media (min-width: 700px) { .frow { grid-template-columns: minmax(10em, 1.1fr) minmax(220px, 2fr) 4.4em; grid-template-areas: 'name bar num'; gap: 10px; } .frow.head > span:not(.fbar) { display: block; } }
.clist { list-style: none; margin: 0; padding: 0; display: grid; }
.crow { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crow .cmain { flex: 1; min-width: 0; line-height: 1.6; overflow-wrap: anywhere; }
.crow .cval { flex: none; font-weight: 750; min-width: 3.4em; text-align: right; }
.crow.sum { font-weight: 700; border-bottom: 0; }
.stateline { display: grid; gap: 6px; justify-items: start; }
.fname { min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.fnum { text-align: right; font-weight: 750; line-height: 1.25; }
.fbar { grid-area: bar; position: relative; display: block; height: 24px; margin: 0 8px; }
.fbar > i, .fbar > b { position: absolute; top: 50%; transform: translate(-50%, -50%); font-style: normal; }
.fbar .fline { left: 0 !important; right: 0; transform: translateY(-50%); height: 2px; background: var(--line); }
.fbar .fband { transform: translateY(-50%); height: 10px; border-radius: 5px; opacity: .3; }
/* Bewertung heute = Gesicht des Spielers, Schätzung = Pfeil von oben, nur aus Ergebnissen = Ball */
.fbar .fbase { line-height: 0; z-index: 1; }
.avatar.fav { width: 22px; height: 22px; margin: 0; font-size: .55rem; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px color-mix(in srgb, var(--ink) 45%, transparent); }
.fbar .fest { width: 4px; height: 28px; border-radius: 2px; background: var(--c, var(--muted)); box-shadow: 0 0 0 1.5px var(--surface); z-index: 0; }
.fbar .fdata { font-size: 12px; line-height: 1; z-index: 0; opacity: .9; }
.lgav { margin-right: 0; }
.lg.est3 { width: 4px; height: 16px; border-radius: 2px; background: var(--muted); }

.lg.ball { width: auto; height: auto; background: none; font-style: normal; font-size: 12px; }
.fbar.axisrow { height: 16px; }
.fbar.axisrow b { font-size: .7rem; font-weight: 600; color: var(--muted); }
.lg.data { width: 8px; height: 8px; border-radius: 0; background: var(--ink); opacity: .55; transform: rotate(45deg); }
.flegend { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.flegend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.lg.base { border: 2px solid var(--ink); background: var(--surface); }
.lg.est { background: var(--turf); width: 9px; height: 9px; }
.lg.band { width: 22px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--turf) 30%, transparent); }
.st { font-weight: 650; }
.st-good { color: var(--good); } .st-bad { color: var(--bad); } .st-warn { color: var(--warn); } .st-ok { color: var(--turf); } .st-off { color: var(--muted); }
.tag.big { font-size: .85rem; padding: 3px 10px; margin-left: 0; }
.tag.st-good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.tag.st-bad { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); }
.tag.st-warn { background: color-mix(in srgb, var(--warn) 15%, var(--surface)); }
.tag.st-ok { background: var(--turf-soft); }
.chart .line { fill: none; stroke: var(--turf); stroke-width: 2.2; stroke-linejoin: round; }
.chart .band { fill: color-mix(in srgb, var(--turf) 18%, transparent); stroke: none; }
.chart .stem { stroke: var(--muted); stroke-width: 2; }
.chart .stem.pos, .chart .dot.pos { stroke: var(--good); }
.chart .dot.pos { fill: var(--good); }
.chart .stem.neg { stroke: var(--bad); }
.chart .dot.neg { fill: var(--bad); }
.chart .expd { stroke: var(--ink); stroke-width: 2; opacity: .7; }
.chart .dot.soft { fill: color-mix(in srgb, var(--turf) 55%, transparent); }
.chart .hit:hover .dot { stroke: var(--ink); stroke-width: 2; }
.gx { border-top: 1px dashed var(--line); padding-top: 6px; }
.gx > summary { color: var(--muted); }

.sheet h3 { margin-top: 4px; }
/* ---------- Prognose und Selbst einteilen ---------- */
.fcrow { display: grid; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.fcrow:last-of-type { border-bottom: 0; }
.fcbar { display: flex; border-radius: var(--r-sm); overflow: hidden; min-height: 28px; border: 1px solid var(--line); }
.fcbar span { background: var(--bib-bg, var(--bib)); color: var(--bib-ink); display: flex; align-items: center; justify-content: center; font-size: .82rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }
.fcbar span.draw { background: var(--surface-2); color: var(--muted); }
.mblist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

/* ---------- Bewegung und Effekte ---------- */
:root { --ease: cubic-bezier(.2, .8, .2, 1); --ease-spring: cubic-bezier(.34, 1.4, .64, 1); }
@keyframes fxUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fxFromR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes fxFromL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@keyframes fxFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fxGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes fxPop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes fxTick { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes fxGlow { from { background: color-mix(in srgb, var(--turf) 22%, var(--surface)); } }
@keyframes fxSheet { from { opacity: .4; transform: translateY(48px); } to { opacity: 1; transform: none; } }
@keyframes fxBall {
  0% { transform: translateY(0) scale(1.14, .84); animation-timing-function: cubic-bezier(.2, .7, .35, 1); }
  10% { transform: translateY(-6px) scale(.94, 1.07); animation-timing-function: cubic-bezier(.2, .7, .35, 1); }
  50% { transform: translateY(-46px) scale(1, 1); animation-timing-function: cubic-bezier(.65, 0, .8, .35); }
  92% { transform: translateY(0) scale(.97, 1.04); animation-timing-function: ease-out; }
  100% { transform: translateY(0) scale(1.14, .84); }
}
@keyframes fxBallShadow {
  0%, 100% { transform: scaleX(1); opacity: .32; animation-timing-function: cubic-bezier(.2, .7, .35, 1); }
  50% { transform: scaleX(.45); opacity: .1; animation-timing-function: cubic-bezier(.65, 0, .8, .35); }
}
@keyframes fxSpin { to { transform: rotate(360deg); } }
@keyframes fxShimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
/* Bereich wechseln: Blöcke gleiten nacheinander herein, Richtung wie in der Navigation */
#main.pg-in.pg-r > *, #main.pg-in.pg-l > * { animation: fxFade .3s ease both; }
/* Neue Teams: Karten und Spieler erscheinen gestaffelt, Kräftebalken wächst, Kreis springt auf */
#main.teams-in .verdict-block { animation: fxUp .55s var(--ease) both; }
#main.teams-in .lamp { animation: fxPop .8s var(--ease-spring) both .15s; }
#main.teams-in .balance { animation: fxReveal 1.1s var(--ease) both .25s; }
@keyframes fxReveal { from { clip-path: inset(0 100% 0 0 round 10px); } to { clip-path: inset(0 0 0 0 round 10px); } }
#main.teams-in .teams > .team { animation: fxUp .65s var(--ease) both; animation-delay: calc(.3s + var(--t, 0) * 160ms); }
#main.teams-in .tp { animation: fxUp .5s var(--ease) both; animation-delay: calc(.5s + var(--t, 0) * 160ms + var(--i, 0) * 55ms); }
/* Fenster: von unten herein, Hintergrund blendet ein */
#sheet.sheet-in .sheet { animation: fxSheet .45s var(--ease) both; }
#sheet.sheet-in .sheet-bg { animation: fxFade .25s ease both; }
.sheet-bg { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
/* Aufgeklappte Bereiche */
.coll.just-opened > :not(.block-head), details.just-opened > :not(summary) { animation: fxFade .3s ease both; }
.chev { transition: transform .25s var(--ease); }
/* Spieler angekreuzt */
.prow.flash { animation: fxGlow .9s ease-out; }
.prow.flash .box { animation: fxTick .35s var(--ease-spring); }
.pcheck .box::after { transition: transform .2s var(--ease-spring); }
/* Hinweis unten */
.toast.toast-in { animation: fxToast .45s var(--ease-spring) both; }
@keyframes fxToast { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
/* Rechnen: hüpfender Ball statt nur Text */
.busy { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); flex-direction: column; gap: 14px; animation: fxFade .2s ease both; }
.busy .busyball { position: relative; display: block; width: 60px; height: 74px; }
.busy .bb { position: absolute; left: 50%; bottom: 8px; width: 42px; height: 42px; margin-left: -21px; transform-origin: 50% 100%; animation: fxBall .95s infinite; }
.busy .bs { display: block; font-size: 38px; line-height: 42px; text-align: center; animation: fxSpin 1.9s linear infinite; }
.busy .bshadow { position: absolute; left: 50%; bottom: 2px; width: 36px; height: 7px; margin-left: -18px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); animation: fxBallShadow .95s infinite; }
.busy .busytxt { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .02em; }
/* Knöpfe: sanfte Farbwechsel und ein spürbares Drücken */
.btn, .seg button, .chip, .showchip, .nav button, .pcheck, .sstr, .mini, .switch, .linkbtn { transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease, transform .12s ease; }
.btn:active:not(:disabled), .seg button:active, .chip:active, .showchip:active, .stepper button:active, .mini:active { transform: scale(.96); }
.btn.primary { box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 4px 14px -6px color-mix(in srgb, var(--turf) 70%, transparent); }
.btn.primary:hover:not(:disabled) { box-shadow: 0 2px 4px rgba(0, 0, 0, .14), 0 8px 20px -8px color-mix(in srgb, var(--turf) 80%, transparent); }
/* Karten mit etwas Tiefe */
.block { box-shadow: 0 1px 2px rgba(20, 40, 28, .04), 0 4px 16px -10px rgba(20, 40, 28, .18); }
@media (hover: hover) { .team { transition: transform .2s var(--ease), box-shadow .2s ease; } .team:hover { transform: translateY(-2px); } }
/* Navigation am Handy: halbtransparent mit Unschärfe, aktiver Bereich als Pille */
@media (max-width: 899px) {
  .nav { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); }
  .nav button svg { padding: 3px 16px; box-sizing: content-box; border-radius: 999px; transition: background-color .25s var(--ease); }
  .nav button.on svg { background: color-mix(in srgb, var(--turf) 16%, transparent); }
  .actionbar { backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script id="engine-src">
/* ============================================================
   SPORTART: Fußball
   Der Rechenkern weiter unten kennt keine Fußball-Begriffe. Er liest
   Fähigkeiten, Rollen, Torwart-Regeln und Bedingungen aus diesem Objekt.
   Alle Bewertungen nutzen die Skala 1–10 (5–6 = Gruppenschnitt).
   ============================================================ */
const SPORT = {
  name: 'Fußball',
  attrs: [
    { key: 'tech', label: 'Technik', core: true, what: 'Ballannahme, Dribbling, Passgenauigkeit', a1: 'Ball springt oft weg', a10: 'Verliert unter Druck kaum Bälle', phrase: 'technisch stärker' },
    { key: 'cond', label: 'Kondition', core: true, what: 'Laufleistung über die ganze Spielzeit', a1: 'Braucht früh Pausen', a10: 'Läuft am Ende wie am Anfang', phrase: 'konditionell stärker' },
    { key: 'def', label: 'Defensive', core: true, what: 'Zweikampf, Stellungsspiel, Rückwärtsarbeit', a1: 'Wird leicht überlaufen', a10: 'Gegner kommen selten vorbei', phrase: 'defensiv stärker' },
    { key: 'off', label: 'Offensive', core: true, what: 'Torgefahr, Abschluss, Durchsetzen vorne', a1: 'Trifft selten', a10: 'Macht aus wenigen Chancen Tore', phrase: 'offensiv stärker' },
    { key: 'iq', label: 'Spielverständnis', core: false, what: 'Übersicht, Laufwege, Entscheidungen', a1: 'Steht oft falsch', a10: 'Steht fast immer richtig', phrase: 'taktisch stärker' },
    { key: 'team', label: 'Zusammenspiel', core: false, what: 'Spielt ab, bindet andere ein', a1: 'Spielt fast nur allein', a10: 'Macht Mitspieler besser', phrase: 'mannschaftsdienlicher' },
    { key: 'pace', label: 'Tempo', core: false, what: 'Antritt und Sprint', a1: 'Verliert fast jedes Laufduell', a10: 'Gewinnt fast jedes Laufduell', phrase: 'schneller' },
    { key: 'phys', label: 'Physis', core: false, what: 'Körpereinsatz, Kopfball, Standfestigkeit', a1: 'Wird leicht abgedrängt', a10: 'Kaum vom Ball zu trennen', phrase: 'robuster' }
  ],
  // Vier Hauptfähigkeiten zählen voll, vier Nebenfähigkeiten halb – leicht zu merken, passt für Hobby- und Vereinsgruppen
  defaultAttrW: { tech: 1, cond: 1, def: 1, off: 1, iq: 0.5, team: 0.5, pace: 0.5, phys: 0.5 },
  roles: [
    { key: 'GK', label: 'Torwart', short: 'TW' },
    { key: 'DEF', label: 'Abwehr', short: 'ABW' },
    { key: 'MID', label: 'Mittelfeld', short: 'MF' },
    { key: 'ATT', label: 'Sturm', short: 'ST' },
    { key: 'FLEX', label: 'flexibel', short: 'FLX' }
  ],
  fieldRoles: ['DEF', 'MID', 'ATT'],
  // Diese beiden Rollen werden zusätzlich gleichmäßig verteilt; flexible und Mittelfeldspieler füllen Lücken
