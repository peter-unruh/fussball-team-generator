/* Linien eines Fußballfelds als Hintergrund jeder Positionstafel (Angriff oben) */
const PITCH_LINES = `<svg class="plines" viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true">
  <rect x="2" y="2" width="96" height="156" /><line x1="2" y1="80" x2="98" y2="80" /><circle cx="50" cy="80" r="12" />
  <rect x="22" y="2" width="56" height="24" /><rect x="36" y="2" width="28" height="9" /><rect x="22" y="134" width="56" height="24" /><rect x="36" y="149" width="28" height="9" />
  <circle cx="50" cy="80" r="1" class="dotc" /></svg>`;
/* ---------- Positionstafel: alle Spieler nach Position ----------
   Reihe aus der Position (Kürzel) oder der Hauptrolle, Spalte aus der Seite. Die Felder sind wie eine
   Taktiktafel eingefärbt: Sturm, Mittelfeld, Abwehr, Tor. */
const POS_COLS = { links: 0, halblinks: 1, innen: 2, halbrechts: 3, rechts: 4 };
const posChipLabel = c => (c.tag ? `${c.short} (${c.tag})` : c.short);
const ZONE_OF_ROW = r => (r <= 1 ? 'att' : r <= 4 ? 'mid' : r <= 6 ? 'def' : 'gk');
const ZONE_OF_ROLE = { ATT: 'att', MID: 'mid', DEF: 'def', GK: 'gk' };
const ZONE_NAME = { att: 'Sturm', mid: 'Mittelfeld', def: 'Abwehr', gk: 'Tor' };
function posPlace(p) {
  const c = findPosCode(p.posCode);
  if (c && c.main === p.roleMain) return { row: c.row, col: c.main === 'GK' ? 2 : POS_COLS[p.side || c.side] ?? 2, code: c.short };
  if (p.roleMain === 'FLEX') return null;
  return { row: SPORT.roleRow[p.roleMain], col: p.roleMain === 'GK' ? 2 : POS_COLS[p.side] ?? null, code: roleShort(p.roleMain) };
}
/* Kurzer Name für enge Stellen: „Siegfried Enns“ → „Siegfried E.“ */
function shortName(p) {
  const n = disp(p), w = n.split(/\s+/);
  return w.length >= 2 && n.length > 11 ? `${w[0]} ${w[w.length - 1][0]}.` : n;
}
function posBoard(players, opt = {}) {
  opt = opt || {};
  const cells = {}, flex = [], free = {};
  players.slice().sort((a, b) => effOf(b).strength - effOf(a).strength).forEach(p => {
    const pp = posPlace(p);
    if (!pp) { flex.push(p); return; }
    if (pp.col == null) { (free[pp.row] = free[pp.row] || []).push({ p, code: pp.code }); return; }
    (cells[pp.row + ':' + pp.col] = cells[pp.row + ':' + pp.col] || []).push({ p, code: pp.code });
  });
  // Spieler ohne Seite symmetrisch um die Mitte verteilen: 1 → Mitte, 2 → halblinks/halbrechts, 3 → Mitte und beide halben …
  const PAT = { 1: [2], 2: [1, 3], 3: [1, 2, 3], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4] };
  Object.keys(free).forEach(r => {
    const list = free[r];
    for (let k = 0; k < list.length; k += 5) {
      const chunk = list.slice(k, k + 5), cols = PAT[chunk.length].slice().sort((x, y) => Math.abs(x - 2) - Math.abs(y - 2) || x - y);   // Stärkste in die Mitte
      chunk.forEach((x, j) => { const key = r + ':' + cols[j]; (cells[key] = cells[key] || []).push(x); });
    }
  });
  const st = p => (!opt.toggle ? '' : S.day.present[p.id] ? ' in' : S.day.maybe[p.id] ? ' maybe' : ' out');
  const kind = p => (p.status === 'paused' || p.status === 'archived' ? 'paused' : p.status === 'guest' ? 'guest' : p.isNew ? 'new' : '');
  const KMARK = { paused: 'P', guest: 'G', new: 'N' };
  const chip = (p, code) => `<button type="button" class="bchip${kind(p) ? ' ' + kind(p) : ''}${st(p)}" data-act="${opt.toggle ? 'presentCycle' : 'edit'}" data-id="${p.id}" ${opt.toggle ? `aria-pressed="${!!S.day.present[p.id]}"` : ''} title="${esc(label(p))} · ${esc(roleLabel(p.roleMain))}${p.roleSub ? ' / ' + esc(roleLabel(p.roleSub)) : ''}${opt.toggle ? (S.day.present[p.id] ? ' · dabei' : S.day.maybe[p.id] ? ' · vielleicht' : ' · nicht angekreuzt') : ''}"><span class="bcode">${esc(code)}</span><span class="bnm">${esc(shortName(p))}</span>${kind(p) ? `<span class="bmark">${KMARK[kind(p)]}</span>` : ''}</button>`;
  let lastZone = '', hMin = 0;
  const tracks = [];
  const rows = Array.from({ length: SPORT.posRows }, (_, r) => {
    const z = ZONE_OF_ROW(r), filled = [0, 1, 2, 3, 4].map(c => (cells[r + ':' + c] || []).length), any = filled.some(Boolean), first = z !== lastZone;
    const head = first ? `<span class="zlabel">${ZONE_NAME[z]}</span>` : '';
    lastZone = z;
    // Reihen mit Spielern bekommen Platz nach Anzahl untereinander, leere bleiben schmal – die Tafel behält Spielfeldform
    const mn = any ? 30 + 34 * Math.max(...filled) + (first ? 12 : 0) : first ? 30 : 20; hMin += mn;
    tracks.push(any ? `minmax(${mn}px, ${Math.max(...filled) + .4}fr)` : `minmax(${mn}px, .5fr)`);
    return `<div class="brow z-${z}${any ? '' : ' empty'}${first ? ' zfirst' : ''}">${head}${[0, 1, 2, 3, 4].map(c => `<div class="bcell">${(cells[r + ':' + c] || []).map(x => chip(x.p, x.code)).join('')}</div>`).join('')}</div>`;
  }).join('');
  /* Spielfeldform: Breite : Länge ≈ 68 : 100 (echtes Feld 68 × 105 m). Braucht die Tafel wegen vieler Spieler mehr
     Höhe, wird sie im gleichen Verhältnis breiter – statt nur in die Länge gezogen (Breite 460–820 px) */
  const bw = Math.round(clamp(hMin * 0.68, 460, 820));
  return `<div class="boardwrap${bw > 640 ? ' wide' : ''}" style="--bw:${bw}px"><div class="board" style="grid-template-rows:${tracks.join(' ')};min-height:${hMin + 10}px" aria-label="Positionstafel, Angriff oben">${PITCH_LINES}${rows}</div>
    <div class="boardside">${flex.length ? `<div class="flexrow"><span class="small muted">Ohne feste Position (spielen überall):</span> ${flex.map(p => chip(p, 'FLX')).join(' ')}</div>` : ''}
    ${opt.legend && players.some(kind) ? `<div class="blegend small muted">${['paused', 'guest', 'new'].filter(k => players.some(p => kind(p) === k)).map(k => `<span class="bl"><span class="bchip ${k}" aria-hidden="true">Name<span class="bmark">${KMARK[k]}</span></span> ${{ paused: 'pausiert', guest: 'Gast', new: 'neu in der Gruppe' }[k]}</span>`).join('')}</div>` : ''}
    <p class="hint">${opt.hint || 'Angriff oben. Die Spalte ergibt sich aus der Seite im Profil (links, halblinks, zentral …). Antippen öffnet das Profil.'}</p></div></div>`;
}
/* Kleine Tafel im Profil: Bereich der Haupt- und Nebenrolle eingefärbt, die Position markiert */
/* Positionstafel im Profil: jede Position ist ein Punkt zum Antippen. Der Bereich der Hauptrolle ist
   kräftig, der der Nebenrolle blass eingefärbt; die gewählte Position ist hervorgehoben. */
function posMini(p) {
  const mainZ = ZONE_OF_ROLE[p.roleMain], subZ = ZONE_OF_ROLE[p.roleSub], cur = findPosCode(p.posCode), pp = posPlace(p);
  let lastZone = '';
  const rows = Array.from({ length: SPORT.posRows }, (_, r) => {
    const z = ZONE_OF_ROW(r), head = z !== lastZone ? `<span class="zlabel">${ZONE_NAME[z]}${z === mainZ ? ' · Haupt' : z === subZ ? ' · Neben' : ''}</span>` : '';
    lastZone = z;
    const cells = [0, 1, 2, 3, 4].map(col => {
      const c = SPORT.posCodes.find(x => x.row === r && (x.main === 'GK' ? 2 : POS_COLS[x.side] ?? 2) === col);
      // Eigene Seite abweichend von der Standardseite der Position: dort einen Punkt zeigen
      const here = pp && !cur && pp.row === r && (pp.col ?? 2) === col;
      if (!c) return `<div class="mcell">${here ? `<span class="mdot" title="Seite: ${esc(p.side || '')}"></span>` : ''}</div>`;
      const on = cur === c;
      // Eigene Seite abweichend (z. B. HS, aber rechts): Pfeil an der gewählten Position statt Punkt daneben
      const sc = on && pp ? pp.col - (POS_COLS[c.side] ?? 2) : 0, arrow = sc > 0 ? ' ›' : sc < 0 ? '‹ ' : '';
      return `<div class="mcell"><button type="button" class="mpos${on ? ' on' : ''}${here ? ' here' : ''}" data-act="edPos" data-v="${c.codes[0]}" aria-pressed="${on}" title="${esc(c.label)}${on && arrow ? ' · Seite: ' + esc(p.side) : ''}">${sc < 0 ? arrow : ''}${c.short}${sc > 0 ? arrow : ''}</button></div>`;
    }).join('');
    return `<div class="mprow z-${z}${z === mainZ ? ' main' : z === subZ ? ' sub' : ''}${head ? ' zfirst' : ''}">${head}${cells}</div>`;
  }).join('');
  return `<div class="minipitch" role="group" aria-label="Position auf dem Spielfeld wählen, Angriff oben">${PITCH_LINES}${rows}</div>`;
}

/* ---------- Wetter (Open-Meteo, kostenlos, ohne Schlüssel) ----------
   Braucht die Lage des Ortes. Für vergangene Tage nutzt die App das Archiv, für die nächsten 16 Tage
   die Vorhersage. Gespeichert werden nur die Zahlen für die Spielzeit. */
const WX_ICON = c => (c >= 95 ? '⛈️' : c >= 71 && c <= 77 ? '🌨️' : c >= 61 ? '🌧️' : c >= 51 ? '🌦️' : c >= 45 ? '🌫️' : c >= 2 ? '☁️' : '☀️');
/* Wetter-Angabe aus den Messwerten; mehreres zugleich möglich, z. B. „kalt und nass“ */
function wxSuggest(w) {
  if (!w) return '';
  const out = [];
  if (w.rain >= 0.3 || w.code >= 51) out.push('nass');
  if (w.wind >= 30 || w.gust >= 50) out.push('wind');
  if (w.temp >= 28) out.push('hitze');
  if (w.temp <= 5) out.push('kaelte');
  return cleanCtx({ weather: out.length ? out.join('+') : 'normal' }).weather;
}
const wxShort = w => `${WX_ICON(w.code)} ${fmt(w.temp, 0)} °C, ${fmt(w.rain, 1)} mm Niederschlag, Wind ${fmt(w.wind, 0)} km/h`;
const wxText = w => `${WX_ICON(w.code)} ${fmt(w.temp, 0)} °C · Niederschlag ${fmt(w.rain, 1)} mm · Wind ${fmt(w.wind, 0)} km/h${w.gust >= w.wind + 10 ? ` (Böen ${fmt(w.gust, 0)})` : ''}`;
async function fetchWeather(date, time, pl) {
  if (!pl || pl.lat == null) throw new Error('Für das Wetter braucht der Ort eine Lage. Tippe beim Ort auf „Ort prüfen“.');
  const days = (new Date(date + 'T12:00:00') - new Date(isoToday() + 'T12:00:00')) / 864e5;

  const v = k => (h[k] && isNum(h[k][i]) ? +h[k][i] : 0);

  const rain = v('precipitation') + (i > 0 && h.precipitation && isNum(h.precipitation[i - 1]) ? +h.precipitation[i - 1] * 0.5 : 0);

}

  const busy = ui.wxBusy === target, err = ui.wxErr && ui.wxErr.t === target ? ui.wxErr.msg : '';

  if (cur === 'drinnen') return `<span class="small muted">🏠 Drinnen – das Wetter spielt keine Rolle.</span>`;
  if (!pl) return `<span class="small muted">Mit einem Ort (und dessen Lage) kann die App das Wetter abrufen.</span>`;
  if (pl.lat == null) return `<div class="row small"><span class="grow muted">Für das Wetter muss die Lage des Ortes bekannt sein.</span><button type="button" class="btn sm" data-act="placeEdit" data-v="${esc(pl.name)}">📍 Ort prüfen</button></div>`;
  return `<div class="row small">${w ? `<span class="grow">${wxText(w)} <span class="muted">(${esc(w.src)}${!isTime(time) ? ', ohne Uhrzeit 18 Uhr angenommen' : ''})</span></span>` : '<span class="grow muted">Wetter für Ort, Datum und Uhrzeit abrufen.</span>'}${btn}
    ${w && sug && sug !== cur ? `<button type="button" class="btn sm primary" data-act="wxUse" data-t="${target}" data-v="${sug}">„${esc(ctxOpt('weather', sug))}“ übernehmen</button>` : ''}</div>${err ? `<span class="small errtxt">${esc(err)}</span>` : ''}`;
}

/* ---------- Ort auf der Karte prüfen ----------
   Google Maps lässt sich ohne Schlüssel nicht automatisch abfragen. Die App sucht deshalb in
   OpenStreetMap (Nominatim, ersatzweise Photon), zeigt, ob der Ort eindeutig gefunden wird, und
   bietet den Link zu Google Maps zum Gegencheck. Gespeichert werden nur Name, Adresse und Lage. */
/* Sucht mehrere Varianten nacheinander: erst die Adresse, dann Name + Stadt, dann der Name allein.
   Photon (OpenStreetMap) zuerst – es funktioniert auch aus einer lokal geöffneten Datei –, Nominatim
   als zweiter Dienst. Findet keiner etwas, liefert Open-Meteo wenigstens die Stadt (für das Wetter). */
async function geoSearch(name, address, onStep) {
  const nm = str(name), ad = str(address);
  const city = ad ? str(ad.split(',').pop()).replace(/^\d{4,5}\s*/, '') : '';
  const variants = [...new Set([ad, nm && city ? `${nm}, ${city}` : '', nm, nm && ad ? `${nm}, ${ad}` : ''].filter(Boolean))];
  const out = [], seen = new Set();
  let reached = false;
  const add = (list, via) => list.forEach(h => { const k = h.lat.toFixed(4) + ',' + h.lon.toFixed(4); if (!seen.has(k) && out.length < 6) { seen.add(k); out.push({ ...h, via }); } });
  // Großzügige Wartezeit (45 s): die kostenlosen Dienste sind manchmal langsam, aber finden den Ort dann doch
  const get = (url, opt = {}) => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 45000); return fetch(url, { ...opt, signal: ac.signal }).finally(() => clearTimeout(tm)); };
  const total = variants.length;
  let step = 0;
  const photon = async q => {
    const r = await get(`https://photon.komoot.io/api/?limit=5&lang=de&q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error(String(r.status));
    reached = true;
    const j = await r.json();
    return (j.features || []).map(f => { const p = f.properties || {}; return { name: [p.name, p.street && (p.street + (p.housenumber ? ' ' + p.housenumber : '')), [p.postcode, p.city || p.town || p.village].filter(Boolean).join(' '), p.country].filter(Boolean).join(', '), lat: +f.geometry.coordinates[1], lon: +f.geometry.coordinates[0], kind: p.osm_value || p.type || '' }; });
  };
  const nomi = async q => {
    const r = await get(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&accept-language=de&q=${encodeURIComponent(q)}`, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error(String(r.status));
    reached = true;
    return (await r.json()).map(x => {
      const a = x.address || {}, road = a.road ? a.road + (a.house_number ? ' ' + a.house_number : '') : '', town = a.city || a.town || a.village || a.municipality || '';
      const nice = [x.name && x.name !== a.road ? x.name : '', road, [a.postcode, town].filter(Boolean).join(' ')].filter(Boolean).join(', ');
      return { name: nice || x.display_name, lat: +x.lat, lon: +x.lon, kind: x.type || x.category || '' };
    });
  };
  // Je Schreibweise beide Dienste gleichzeitig fragen; die nächste Schreibweise nur, wenn nichts gefunden wurde
  for (const q of variants) {
    step++; if (onStep) onStep(step, total, q, 'Photon + Nominatim');
    const res = await Promise.allSettled([photon(q), nomi(q)]);
    res.forEach((r, k) => { if (r.status === 'fulfilled') add(r.value, k ? 'Nominatim' : 'Photon'); });
    if (out.length) break;
  }
  if (!out.length && (city || nm)) {
    try {
      if (onStep) onStep(total, total, city || nm, 'Open-Meteo');
      const r = await get(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city || nm)}&count=3&language=de&format=json`);
      if (r.ok) { reached = true; const j = await r.json(); add((j.results || []).map(x => ({ name: [x.name, x.admin1, x.country].filter(Boolean).join(', ') + ' (nur die Stadt)', lat: +x.latitude, lon: +x.longitude, kind: 'Stadt' })), 'Open-Meteo'); }
    } catch (e) { /* egal */ }
  }
  if (!reached) throw new Error('offline');
  return out;
}

    <div class="row"><button type="button" class="btn primary" data-act="plSearch" ${E.busy ? 'disabled' : ''}>${E.busy ? '<span class="spin" aria-hidden="true"></span> Suche läuft …' : '🔎 Auf der Karte suchen'}</button>${mapsLink(tmp)}</div>
    ${E.busy ? `<p class="small muted" id="plProg" role="status">${esc(E.prog || '')}</p><p class="hint">Die kostenlosen Kartendienste (OpenStreetMap) brauchen manchmal 5–30 Sekunden – bitte warten, die Suche bricht nicht vorzeitig ab. Probiert werden nacheinander Adresse, Name mit Stadt und Name allein.</p>` : ''}

}

/* ---------- Prognose zu den Teams ----------
   Erwartete Torzahl aus dem Torniveau des Ortes (mit geplanter Spielzeit: Tore je Stunde × Minuten),
   Toranteil aus den Teamstärken wie in der Auswertung, daraus Sieg/Remis/Niederlage (Poisson). */
function expectedGoals(place, minutes) {
  const L = Analysis.levels(S.matches), key = Analysis.placeKey({ place, snap: { set: { ctx: S.day.ctx } } }), c = L.cls.get(key);
  const nm = place ? `„${esc(place)}“` : 'diesem Untergrund';
  if (c && c.perH && isNum(minutes)) return { N: c.perH * minutes / 60, src: `${nm}: ${fmt(c.perH, 0)} Tore je Stunde (aus ${plural(c.games, 'Spiel', 'Spielen')}) × ${minutes} Min.` };
  if (c && c.games) return { N: c.typ, src: `${nm}: Ø ${fmt(c.goals / c.games, 1)} Tore je Spiel (aus ${plural(c.games, 'Spiel', 'Spielen')})${isNum(minutes) ? '; Spielzeit wird erst genutzt, wenn hier Spiele mit Dauer erfasst sind' : ''}` };
  let H = 0, G = 0;
  L.cls.forEach(x => { if (x.perH) { H += x.min; G += x.minGoals; } });
  if (H && isNum(minutes)) return { N: G / (H / 60) * minutes / 60, src: `alle Orte: ${fmt(G / (H / 60), 0)} Tore je Stunde × ${minutes} Min. (an diesem Ort noch keine Daten)` };
  if (L.n) return { N: L.avg, src: `alle Orte: Ø ${fmt(L.avg, 1)} Tore je Spiel (an diesem Ort noch keine Daten)` };
  return { N: 8, src: 'Annahme: 8 Tore je Spiel (noch keine Ergebnisse erfasst)' };
}
/* Teamstärken derselben Aufteilung, wenn jeder Spieler um ds[id] stärker wäre (Schätzung aus den Ergebnissen) */
function teamValsWith(R, ds) {
  FORCE_BASIS = 'rating'; const inp = buildInput(); FORCE_BASIS = null;
  inp.players.forEach(p => { if (isNum(ds[p.id])) p.eff = { ...p.eff, strength: p.eff.strength + ds[p.id] }; });
  const M = Engine.prepare(inp, SPORT);
  return M.errors.length ? null : Engine.evaluate(M, assignFrom(M, R.teams), true).vals;
}

  S.matches.forEach(m => { if (m.snap) ensurePred(m); });
  const o = ana(), cur = {}, prior = {}, base = {};
  // Gelöschte Spieler: Werte aus dem jüngsten Schnappschuss
  S.matches.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(m => {
    if (!m.snap || !m.pred) return;
    Object.keys(m.snap.pl).forEach(id => { prior[id] = priorSdSnap(m.snap.pl[id]); if (isNum(m.pred.s[id])) base[id] = m.pred.s[id] - (m.snap.pl[id].bd || 0); });
  });
  S.players.forEach(p => {
    const e = effOf(p);
    cur[p.id] = e.strength; base[p.id] = cur[p.id]; prior[p.id] = priorSd(p);
    // Torwart-Stärke als eigene Größe: eingetragen = mittel sicher, nur aus der Rolle geschätzt = unsicher
    const q = PV(p); cur['gk:' + p.id] = Engine.keeperBase({ eff: e, roleMain: q.roleMain, roleSub: q.roleSub, gkWill: q.gkWill }, SPORT);
    prior['gk:' + p.id] = e.gk && !e.gk.est ? 1.2 : 1.8;
  });
  if (predCache.size > 3000) predCache.clear();
  const obs = Analysis.observations(S.matches, cur, o, SPORT, isoToday(), predCache);
  const F = Analysis.fit(obs, prior, o);
  const A = { key, o, cur, base, prior, obs, F, used: new Set([...obs.games.map(g => g.mid), ...obs.marks.map(m => m.mid)]), tl: null };
  // Wertung nur aus Ergebnissen: ohne die eingestellten Stärken, alle starten beim Gruppenschnitt
  const ids = [...new Set(obs.games.flatMap(g => [...g.A, ...g.B]))];
  if (ids.length) {
    const mean = ids.reduce((t, id) => t + (isNum(base[id]) ? base[id] : 5), 0) / ids.length, cur0 = {}, prior0 = {};
    ids.forEach(id => { cur0[id] = mean; prior0[id] = o.dataSd; });
    const obs0 = Analysis.observations(S.matches, cur0, o, SPORT, isoToday(), predCache);
    A.data = { mean, res: Analysis.fit(obs0, prior0, { ...o, move: 1 }, null, { resultsOnly: true }).res };
  } else A.data = { mean: 5, res: {} };
  // Passt „Wie stark entscheidet die Teamstärke?“ zu euren Spielen? Vergleich der Modellgüte ab 20 Spielen mit Toren
  const nScore = obs.games.filter(g => g.kind === 'score' && g.ga + g.gb > 0).length;
  A.gammaCheck = nScore >= 20 ? ANA_CHOICES.gamma.map(gm => ({ g: gm, ev: gm === o.gamma ? F.evidence : Analysis.fit(obs, prior, { ...o, gamma: gm }).evidence })) : null;
  A.nScore = nScore;
  A.pl = playerStats(A);
  A.recs = buildRecs(A);
  anaCache = A;
  return A;
}

/* Zahlen je Spieler: Bilanz, Toranteil erwartet/tatsächlich, Schätzung und Einordnung */
const STATE = {
  up: { t: 'stärker als bewertet', c: 'good' }, down: { t: 'schwächer als bewertet', c: 'bad' },
  upish: { t: 'eher stärker', c: 'warn' }, downish: { t: 'eher schwächer', c: 'warn' },
  ok: { t: 'Bewertung passt', c: 'ok' }, open: { t: 'noch unklar', c: 'off' }, none: { t: 'noch keine Aussage', c: 'off' }
};
function playerStats(A) {
  const { obs, F, o } = A, out = {};
  const get = id => out[id] || (out[id] = { id, own: [], marks: [], w: 0, dr: 0, l: 0, gf: 0, ga: 0, n: 0, nAll: 0, days: new Set(), exp: 0, act: 0, goals: 0, mUp: 0, mDown: 0 });
  obs.games.forEach(g => {
    if (g.kind === 'feel') return;
    [[g.A, 0], [g.B, 1]].forEach(([ids, side]) => ids.forEach(id => {
      const s = get(id), gf = side ? g.gb : g.ga, gx = side ? g.ga : g.gb, n = gf + gx, pe = side ? 1 - g.p0 : g.p0;
      s.nAll++; s.days.add(g.mid);
      if (gf > gx + 1e-9) s.w++; else if (gf < gx - 1e-9) s.l++; else s.dr++;
      if (g.kind === 'score') {
        s.gf += gf; s.ga += gx;
        if (n > 0) {
          s.exp += pe * n; s.act += gf; s.goals += n;
          const pl = (s.byPlace = s.byPlace || {})[g.place] || (s.byPlace[g.place] = { n: 0, exp: 0, act: 0, goals: 0, gf: 0, ga: 0 });
          pl.n++; pl.exp += pe * n; pl.act += gf; pl.goals += n; pl.gf += gf; pl.ga += gx;
        }
        // Als fester Torwart: Gegentore gegen die Erwartung
        if (g.keeper && g.keeper[side] === id) { const k = s.keep || (s.keep = { n: 0, ga: 0, exp: 0 }); k.n++; k.ga += gx; k.exp += (1 - pe) * n; }
      }
      if (n > 0) s.n++;
    }));
  });
  obs.marks.forEach(mk => { const s = get(mk.id); s[mk.d > 0 ? 'mUp' : 'mDown']++; });
  Object.values(out).forEach(s => {
    const r = F.res[s.id], b = A.base[s.id];
    s.base = isNum(b) ? b : 5;
    s.d = r ? r.d : 0;
    s.sd = r ? r.sd : (A.prior[s.id] || 1) * o.move;
    s.est = s.base + s.d;
    s.lo = s.est - ZC() * s.sd; s.hi = s.est + ZC() * s.sd;
    s.p = r && s.sd > 0 ? Analysis.Phi(Math.abs(s.d) / s.sd) : 0.5;
    s.shareAct = s.goals ? s.act / s.goals : null; s.shareExp = s.goals ? s.exp / s.goals : null;
    s.own = r ? r.games.filter(x => x.own).sort((x, y) => x.g.date.localeCompare(y.g.date) || x.g.k - y.g.k) : [];
    s.marks = r ? r.marks.filter(x => x.own) : [];
    s.indirect = s.d - s.own.reduce((t, x) => t + x.c, 0) - s.marks.reduce((t, x) => t + x.c, 0);
    const r0 = A.data && A.data.res[s.id];
    s.data = r0 ? { est: A.data.mean + r0.d, sd: r0.sd } : null;
    const big = Math.abs(s.d) >= o.minChange - 1e-9;
    s.state = !r ? 'none'
      : s.p >= o.conf && big ? (s.d > 0 ? 'up' : 'down')
      : s.p >= 0.75 && Math.abs(s.d) >= 0.3 ? (s.d > 0 ? 'upish' : 'downish')
      : Z80 * s.sd <= 1 && Math.abs(s.d) < 0.5 ? 'ok' : 'open';
  });
  return out;
}

/* Wer stand in ALLEN Spielen eines Spielers mit ihm zusammen oder ihm gegenüber? Dann können die
   Ergebnisse nicht trennen, wer von beiden den Ausschlag gab. */
function confounds(A, id) {
  const mine = A.obs.games.filter(g => g.kind !== 'feel' && g.ga + g.gb > 0 && (g.A.includes(id) || g.B.includes(id)));
  if (mine.length < 2) return [];
  const cnt = new Map();
  mine.forEach(g => {
    const inA = g.A.includes(id), same = inA ? g.A : g.B, opp = inA ? g.B : g.A;
    same.forEach(j => { if (j !== id) { const c = cnt.get(j) || { t: 0, a: 0 }; c.t++; cnt.set(j, c); } });
    opp.forEach(j => { const c = cnt.get(j) || { t: 0, a: 0 }; c.a++; cnt.set(j, c); });
  });
  const out = [];
  cnt.forEach((c, j) => { if ((c.t === mine.length && !c.a) || (c.a === mine.length && !c.t)) out.push({ id: j, rel: c.t ? 'with' : 'against', n: mine.length }); });
  return out;
}
function confoundText(A, s) {
  const cf = confounds(A, s.id);
  if (!cf.length || s.state === 'ok' || s.state === 'none') return '';
  const nm = esc(nameAny(s.id));
  const w = cf.filter(x => x.rel === 'with'), ag = cf.filter(x => x.rel === 'against');
  const names = list => list.map(x => esc(nameAny(x.id))).join(', ');
  const parts = [];
  if (false) parts.push(`${nm} stand ${names(ag)} in allen ${plural(ag[0].n, 'Spiel', 'Spielen')} gegenüber. Die Ergebnisse zeigen deshalb nur den Unterschied: Ob ${nm} ${s.d > 0 ? 'stark' : 'schwach'} ist oder ${names(ag)} ${s.d > 0 ? 'schwach' : 'stark'}, lässt sich daraus nicht trennen.`);
  if (w.length) parts.push(`${nm} spielte in allen ${plural(w[0].n, 'Spiel', 'Spielen')} mit ${names(w)} zusammen. Wer von ihnen den Ausschlag gab, lässt sich aus den Ergebnissen nicht trennen.`);
  const n = (ag[0] || w[0]).n;
  return `<div class="banner warn small"><p><b>In allen ${plural(n, 'Spiel', 'Spielen')} von ${nm} gleich besetzt:</b></p>
    <ul class="small">${ag.length ? `<li>immer <b>gegen</b> ${names(ag)} – die Ergebnisse zeigen nur den Unterschied. Ob ${nm} ${s.d > 0 ? 'stark' : 'schwach'} ist oder ${ag.length > 1 ? 'die anderen' : names(ag)} ${s.d > 0 ? 'schwach' : 'stark'}, bleibt offen.</li>` : ''}
    ${w.length ? `<li>immer <b>mit</b> ${names(w)} – wer von ihnen den Ausschlag gab, bleibt offen.</li>` : ''}</ul>
    <p class="small">Klarheit bringt ein Spiel in anderer Besetzung oder eine Markierung beim Eintragen. ${ib('confound')}</p></div>`;
}

/* ---------- Vorschläge ---------- */
function buildRecs(A) {
  const o = A.o, out = [];
  Object.values(A.pl).forEach(s => {
    const p = byId(s.id);
    if (!p) return;
    const to = clamp(roundStep(s.est, 0.5), 1, 10);
    if ((s.state === 'up' || s.state === 'down') && s.n >= o.minGames && Math.abs(to - s.base) >= 0.5 - 1e-9) {
      out.push({ type: 'str', key: 'str:' + s.id, id: s.id, from: s.base, to, n: s.n, p: s.p, score: 10 + s.p * Math.abs(to - s.base) });
    } else if ((p.isNew || !ratedOf(p)) && s.state === 'ok' && s.n >= 4) {
      out.push({ type: 'ok', key: 'ok:' + s.id, id: s.id, from: s.base, to: s.base, n: s.n, p: s.p, score: 1 });
    }
  });
  return out.sort((a, b) => b.score - a.score);
}
function recVisible(r) {
  const d = S.recs.find(x => x.key === r.key);
  if (!d) return true;
  if (d.st === 'later') return r.n > d.n;
  if (d.st === 'done') return r.n >= d.n + 3;
  // Abgelehnt: erst bei deutlich neuer Datenlage oder wenn der Vorschlag weiter in dieselbe Richtung geht
  const further = d.v != null && isNum(r.from) && Math.sign(r.to - r.from) === Math.sign(d.v - r.from) && Math.abs(r.to - r.from) >= Math.abs(d.v - r.from) + 0.5 - 1e-9;
  return r.n >= d.n + 4 || further;
}
const recTitle = (r, plain) => {
  const e = plain ? (x => x) : esc, nm = e(nameAny(r.id));
  if (r.type === 'ok') return `${nm}: Stärke ${fmtV(r.from)} passt`;
  return `${nm}: Stärke ${fmtV(r.from)} → ${fmtS(r.to)}`;
};
/* Begründung in Worten – dieselben Zahlen wie in der Spielerauswertung */
function evidenceText(s) {
  const nm = esc(nameAny(s.id)), parts = [];
  parts.push(`${plural(s.nAll, 'Spiel', 'Spiele')} (${s.w} gewonnen · ${s.dr} unentschieden · ${s.l} verloren)`);
  if (s.goals) parts.push(`Toranteil seines Teams ${pctTxt(s.shareAct)} (${goalsTxt(s.gf)}:${goalsTxt(s.ga)}), erwartet ${pctTxt(s.shareExp)}`);
  if (s.mUp || s.mDown) parts.push([s.mUp ? `${s.mUp}× als stärker` : '', s.mDown ? `${s.mDown}× als schwächer` : ''].filter(Boolean).join(' und ') + ' markiert');
  return `${parts.join(' · ')}. Mit Mit- und Gegenspielern verrechnet ergibt das etwa <b>${r10(s.est)}</b> (wahrscheinlich ${rangeTxt(s)}). Wahrscheinlichkeit, dass ${nm} ${s.d > 0 ? 'stärker' : 'schwächer'} ist als ${fmtV(s.base)}: <b>${probTxt(s.p)}</b>.`;
}
function whatIfNow(r) {
  const R = S.result;
  if (!R || !R.teams || r.type !== 'str' || !S.day.present[r.id]) return '';
  const M0 = buildModel();
  if (M0.errors.length || isStale(R, M0)) return '';
  const inp = buildInput(), pl = inp.players.find(x => x.id === r.id);
  if (!pl) return '';
  const before = Engine.evaluate(M0, assignFrom(M0, R.teams), true).pct;
  pl.eff = { ...pl.eff, strength: r.to };
  const M1 = Engine.prepare(inp, SPORT);
  if (M1.errors.length) return '';
  const after = Engine.evaluate(M1, assignFrom(M1, R.teams), true).pct;
  return `Die heutigen Teams hätten damit ${fmt(after, 1)} % statt ${fmt(before, 1)} % Unterschied.`;
}
function recCard(r, A, inSheet) {
  const own = ui.recOwn === r.key, s = A.pl[r.id], p = byId(r.id);
  let note = '';
  if (r.type === 'str' && p && effOf(p).auto) note = ' Die Stärke wird bisher aus Fähigkeiten berechnet; Übernehmen setzt sie als feste Zahl.';
  if (r.type === 'str' && p && (p.isNew || !ratedOf(p))) note += ` ${esc(disp(p))} gilt danach als eingeschätzt${p.isNew ? ' und nicht mehr als neu' : ''}.`;
  const body = r.type === 'ok'
    ? `${evidenceText(s)} Die Ergebnisse bestätigen die Bewertung. ${esc(disp(p))} kann als eingeschätzt gelten${p.isNew ? ' und nicht mehr als neu' : ''}.`
    : evidenceText(s) + note;
  const wi = r.type === 'str' ? whatIfNow(r) : '';
  return `<article class="rec conf-${r.type === 'ok' ? 'mittel' : 'hoch'}">
    <div class="rec-head"><b>${recTitle(r)}</b>${inSheet ? '' : `<button type="button" class="btn sm ghost" data-act="paOpen" data-id="${r.id}">Spiele ansehen</button>`}</div>
    <p class="small">${body}</p>
    ${r.n < 4 && r.type === 'str' ? `<p class="small muted">Erst ${plural(r.n, 'Spiel', 'Spiele')} mit Toren – ein vorläufiger Vorschlag.</p>` : ''}
    ${confoundText(A, s)}
    ${wi ? `<p class="small muted">${wi}</p>` : ''}
    ${own ? `<div class="row"><label class="lbl" for="recOwn">Eigener Wert</label><input type="number" id="recOwn" class="numin" step="0.5" min="1" max="10" inputmode="decimal" value="${r.to}"><button type="button" class="btn sm primary" data-act="recApplyOwn" data-k="${esc(r.key)}">Setzen</button><button type="button" class="btn sm ghost" data-act="recOwn" data-k="">Abbrechen</button></div>` : ''}
    <div class="row rec-btns">
      <button type="button" class="btn sm primary" data-act="recApply" data-k="${esc(r.key)}">${r.type === 'ok' ? 'Bestätigen' : `Auf ${fmtS(r.to)} setzen`}</button>
      ${r.type === 'str' && !own ? `<button type="button" class="btn sm" data-act="recOwn" data-k="${esc(r.key)}">Eigener Wert</button>` : ''}
      <button type="button" class="btn sm ghost" data-act="recLater" data-k="${esc(r.key)}">Später</button>
      <button type="button" class="btn sm ghost" data-act="recReject" data-k="${esc(r.key)}">Ablehnen</button>
    </div>
  </article>`;
}
function findRec(key) { return anaNow().recs.find(r => r.key === key) || null; }
function decide(r, st, v) {
  S.recs = S.recs.filter(x => x.key !== r.key);
  S.recs.push({ key: r.key, st, at: isoToday(), n: r.n, v: isNum(v) ? +v : isNum(r.to) ? +r.to : null });
}

/* ---------- Übernehmen und Rückgängig ---------- */
/* Spieler schnell um delta korrigieren. Wird die Stärke aus Fähigkeiten berechnet, verschieben sich alle bewerteten
   Fähigkeiten und die grobe Einschätzung gleich mit – so wirkt die Korrektur auch auf die Teambildung (halbe Schritte). */
function shiftPlayer(p, delta) {
  const r2 = v => Math.round(v * 2) / 2, top = p.star ? 15 : 10;
  if (effOf(p).auto) Object.keys(p.attrs).forEach(k => { p.attrs[k] = clamp(r2(+p.attrs[k] + delta), 1, 10); });
  p.strength = clamp(r2((isNum(p.strength) ? +p.strength : 5) + delta), 1, top);
  markRated(p);
}
/* Welche Werte stoßen beim Verschieben an eine Grenze (1 bzw. 10, Ausnahmespieler 15)? */
function shiftCaps(p, d) {
  const out = [], top = p.star ? 15 : 10;
  if (effOf(p).auto) Object.keys(p.attrs).forEach(k => { const v = +p.attrs[k] + d; if (v > 10 + 1e-9 || v < 1 - 1e-9) out.push(attrLabel(k)); });
  const s = (isNum(p.strength) ? +p.strength : 5) + d;
  if (s > top + 1e-9 || s < 1 - 1e-9) out.push('die grobe Einschätzung');
  return out;
}
function applyRec(r, value) {
  const p = byId(r.id);
  if (!p) return;
  const v = isNum(value) ? clamp(Math.round(+value * 2) / 2, 1, 10) : r.to;
  const extra = { isNew: p.isNew, rated: p.rated, autoStrength: p.autoStrength };
  const old = p.strength, oldEff = effOf(p).strength, oldAttrs = { ...p.attrs };
  if (r.type === 'str') {
    // Aus Fähigkeiten berechnet: alle Fähigkeiten um den Unterschied verschieben (Berechnung bleibt an), sonst die Stärke setzen
    if (effOf(p).auto) {
      const caps = shiftCaps(p, v - oldEff);
      shiftPlayer(p, v - oldEff);
      if (caps.length) setTimeout(() => toast(`${caps.join(', ')} ${caps.length === 1 ? 'stand' : 'standen'} schon an der Grenze – berechnet jetzt ${fmtS(effOf(p).strength)} statt ${fmtS(v)}.`), 60);
    } else p.strength = v;
  }
  p.rated = true; p.isNew = false;
  const label = r.type === 'ok' ? `${nameAny(p.id)}: Stärke ${fmtV(oldEff)} bestätigt` : `${nameAny(p.id)}: Stärke ${fmtV(oldEff)} → ${fmtS(v)}`;
  S.log.push({ id: uid(), at: Date.now(), src: isNum(value) && v !== r.to ? 'own' : 'rec', kind: 'player', target: p.id, field: r.type === 'ok' ? 'new' : 'strength', old, new: p.strength, oldAttrs, extra, label });
  decide(r, 'done', v);
}
function undoLog(id) {
  const e = S.log.find(x => x.id === id);
  if (!e) return;
  const p = byId(e.target);
  if (e.kind !== 'player' || !['strength', 'new'].includes(e.field)) { toast('Diese ältere Änderung bitte von Hand zurücksetzen.'); return; }
  if (!p) { toast('Den Spieler gibt es nicht mehr.'); return; }
  if (p.strength !== e.new) { toast('Der Wert wurde seitdem geändert – bitte von Hand anpassen.'); return; }
  p.strength = e.old;
  if (e.oldAttrs && typeof e.oldAttrs === 'object') p.attrs = { ...e.oldAttrs };
  if (e.extra) { p.isNew = e.extra.isNew; p.rated = e.extra.rated; p.autoStrength = e.extra.autoStrength; }
  S.log = S.log.filter(x => x.id !== id);
  S.recs = S.recs.filter(x => x.key !== (e.field === 'new' ? 'ok:' : 'str:') + e.target);
  toast('Änderung zurückgenommen.');
}

/* ---------- Diagramme (SVG, Farben aus dem Thema) ---------- */
const stateColor = st => ({ good: 'var(--good)', bad: 'var(--bad)', warn: 'var(--warn)', ok: 'var(--turf)', off: 'var(--muted)' }[STATE[st].c]);
/* Eine Zeile der Spielerübersicht auf der Skala 1–10: Bewertung (Ring), Schätzung (Punkt),
   wahrscheinlicher Bereich (Balken), Wertung nur aus Ergebnissen (Raute). In Prozent positioniert,
   damit Achse und Zeilen bei jeder Breite übereinanderliegen. */
let FMAX = 10;   // rechtes Ende der Skala in der Spielerübersicht: 10, bei Ausnahmespielern bis 15
const fX = v => ((clamp(v, 1, FMAX) - 1) / (FMAX - 1) * 100).toFixed(2);
function forestSvg(s) {
  const col = stateColor(s.state);
  return `<span class="fbar" role="img" aria-label="Bewertung ${fmtV(s.base)}, Schätzung ${r10(s.est)}, Bereich ${rangeTxt(s)}${s.data ? `, nur aus Ergebnissen ${r10(s.data.est)}` : ''}">
    <i class="fline"></i><i class="fband" style="left:${fX(s.lo)}%;width:${(fX(s.hi) - fX(s.lo)).toFixed(2)}%;background:${col}"></i>
    ${s.data ? `<i class="fdata" style="left:${fX(s.data.est)}%" title="Nur aus Ergebnissen: ${r10(s.data.est)}">⚽</i>` : ''}
    <i class="fbase" style="left:${fX(s.base)}%" title="Bewertung heute: ${fmtV(s.base)}">${avatar(byId(s.id) || { name: nameAny(s.id) }, 'fav')}</i><i class="fest" style="left:${fX(s.est)}%;--c:${col}" title="Schätzung aus Bewertung und Ergebnissen: ${r10(s.est)}"></i></span>`;
}
const forestAxis = () => `<span class="fbar axisrow" aria-hidden="true">${Array.from({ length: FMAX }, (_, i) => i + 1).map(v => `<b style="left:${fX(v)}%">${v}</b>`).join('')}</span>`;

/* Verlauf: Schätzung aus allen Spielen bis zu jedem Spieltag, dazu die Bewertung von damals */
function timelineOf(A) {
  if (A.tl) return A.tl;
  const dates = [...new Set([...A.obs.games.map(g => g.date), ...A.obs.marks.map(m => m.date)])].sort();
  A.tl = dates.map(d => {
    const F = Analysis.fit(A.obs, A.prior, A.o, d), est = {};
    Object.entries(F.res).forEach(([id, r]) => { est[id] = [r.d, r.sd]; });
    return { d, est };
  });
  return A.tl;
}
function ratingThen(id, date) {
  const ms = S.matches.filter(m => m.pred && m.date <= date && m.pred.s && isNum(m.pred.s[id])).sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  return ms.length ? ms[0].pred.s[id] - ((ms[0].snap && ms[0].snap.pl[id] && ms[0].snap.pl[id].bd) || 0) : null;
}
function timelineChart(A, s) {
  const pts = timelineOf(A).filter(t => t.est[s.id] && s.days.size).map(t => {
    const [d, sd] = t.est[s.id], e = s.base + d;
    return { d: t.d, e, lo: e - ZC() * sd, hi: e + ZC() * sd, r: ratingThen(s.id, t.d) };

/* Export aller Spieltage als CSV (Semikolon, für Tabellenkalkulationen) */
const formatName = k => (SPORT.formats.find(x => x.key === k) || { label: k === 'custom' ? 'eigene Spielform' : k || '' }).label;
const TEND_CSV = { a2: 'A klar', a1: 'A knapp', d: 'unentschieden', b1: 'B knapp', b2: 'B klar' };
function matchesCSV() {
  // Text, der mit = + - @ beginnt, würde ein Tabellenprogramm als Formel lesen: mit ' entschärfen
  const q = v => { let t = v == null ? '' : String(v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const num = v => (isNum(v) ? String(Math.round(v * 100) / 100).replace('.', ',') : '');
  const head = ['Datum', 'Uhrzeit', 'Ort', 'Spielfeld', 'Tore', 'Untergrund', 'Wetter', 'Temperatur °C', 'Niederschlag mm', 'Wind km/h', 'Status', 'Spielform', 'Spiel', 'Team A', 'Team B', 'Tore A', 'Tore B', 'genau/ungefähr', 'Minuten', 'Umstellungen in diesem Spiel', 'Stärke A (beim Bilden)', 'Stärke B (beim Bilden)', 'Unterschied % (beim Bilden)', 'Markierungen', 'Ausgewertet', 'Spieler A', 'Spieler B', 'Notiz'];
  const lines = [head.map(q).join(';')];
  S.matches.slice().sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created).forEach(m => {
    const games = m.games.length ? m.games : [{ a: 0, b: 1 }];
    const marks = m.fb.marks.map(k => `${matchName(m, k.id)} ${k.d > 0 ? 'stärker' : 'schwächer'}`).join(', ');
    games.forEach((g, k) => inCols(m.colors, () => {
      if (g.a >= m.teams.length || g.b >= m.teams.length) return;
      const ex = [...(g.ev || []).map(e => `${e.at > 0 ? `ab ${pctTxt(e.at)}: ` : ''}${matchName(m, e.id)} ${e.t < 0 ? 'raus' : `→ ${teamCol(e.t).name}${e.gk ? ' ins Tor' : ''}`}`),
        ...Object.entries(g.gkp || {}).map(([id, v]) => `${matchName(m, id)} ca. ${pctTxt(v)} im Tor`), ...(g.tired || []).map(t => `${teamCol(t).name} müde`)].join(', ');
      lines.push([
        m.date, m.time || '', m.place, ...['size', 'goal', 'surface', 'weather'].map(k => (m.snap && m.snap.set.ctx[k] ? ctxOpt(k, m.snap.set.ctx[k]) : '')),
        m.weather ? num(m.weather.temp) : '', m.weather ? num(m.weather.rain) : '', m.weather ? num(m.weather.wind) : '',
        STATUS_TXT[m.status], m.snap ? formatName(m.snap.set.format) : '', k + 1, teamCol(g.a).name, teamCol(g.b).name,
        isNum(g.ga) ? g.ga : '', isNum(g.gb) ? g.gb : '', g.approx ? 'ungefähr' : g.tend ? TEND_CSV[g.tend] : '', isNum(g.min) ? g.min : '', ex,
        m.pred ? num(m.pred.vals[g.a]) : '', m.pred ? num(m.pred.vals[g.b]) : '', m.pred ? num(m.pred.pct) : '',
        marks, m.exclude || m.status !== 'done' ? 'nein' : 'ja',
        m.teams[g.a].map(id => matchName(m, id)).join(', '), m.teams[g.b].map(id => matchName(m, id)).join(', '), m.fb.note
      ].map(q).join(';'));
    }));
  });
  return '﻿' + lines.join('\r\n');
}

/* Je Ort: Toranteil seines Teams gegen die Erwartung (beschreibend, ohne Verrechnung der Mitspieler) */
function placeTable(A, s) {

/* Als fester Torwart: Gegentore gegen die Erwartung */

/* Wie Bewertung und Ergebnisse zur Schätzung zusammenkommen: zwei Messungen, gewichtet nach
   ihrer Genauigkeit (1 / Unsicherheit²). Der Anteil der Ergebnisse folgt aus der Unsicherheit vorher
   (Bewertung) und nachher (Schätzung): Anteil = 1 − (nachher / vorher)². */
/* „Die Spiele allein“: was die Ergebnisse ohne jede Vorgabe für diesen Spieler sagen (mit Mit- und Gegenspielern
   verrechnet) – aus Schätzung und Bewertung zurückgerechnet. wR = Anteil der Ergebnisse an der Schätzung. */
function gameOnly(A, s) {
  const r = A.F.res[s.id];
  if (!r || !(r.prior > 0) || !(s.sd > 0)) return null;
  const s0 = r.prior, s1 = s.sd, wR = clamp(1 - (s1 * s1) / (s0 * s0), 0, 1);
  if (wR < 0.02) return { s0, s1, wR, wB: 1 - wR, val: null, sd: null };
  return { s0, s1, wR, wB: 1 - wR, val: s.base + s.d / wR, sd: 1 / Math.sqrt(Math.max(1e-9, 1 / (s1 * s1) - 1 / (s0 * s0))) };
}

  return `<div class="combine"><div class="lblrow"><b>So entsteht die Schätzung</b>${ib('combine')}</div>
    <div class="cbar" role="img" aria-label="Bewertung ${pctTxt(wB)}, Spiele ${pctTxt(wR)}"><i style="flex:${wB};background:var(--muted)"></i><i style="flex:${wR};background:var(--est)"></i></div>
    <span>${srcIcon('rating')}<b>Deine Bewertung</b> ${fmtV(s.base)} <span class="muted">(±${fmt(s0, 1)}${cf ? `, „${esc(cf)}“` : ''})</span> zählt <b>${pctTxt(wB)}</b>.</span>
    <span>${srcIcon('mix')}<b>Die Spiele</b> zählen <b>${pctTxt(wR)}</b> und ziehen ${dir}${Math.abs(s.d) >= 0.05 ? ` (${s.d > 0 ? '+' : '−'}${fmt(Math.abs(s.d), 1)})` : ''}: ${s.d >= 0.05 ? `sein Team holte mehr Tore, als mit ${fmtV(s.base)} zu erwarten war` : s.d <= -0.05 ? `sein Team holte weniger Tore, als mit ${fmtV(s.base)} zu erwarten war` : 'die Ergebnisse passen zur Bewertung'} – mit Mit- und Gegenspielern verrechnet.</span>
    <span class="small muted">${srcIcon('mix')}Schätzung = ${fmtV(s.base)} ${s.d >= 0 ? '+' : '−'} ${fmt(Math.abs(s.d), 1)} = <b>${r10(s.est)}</b> (±${fmt(s1, 1)}). Die Anteile zeigen, wie viel jede Quelle weiß: deine Bewertung auf ±${fmt(s0, 1)} genau, ${plural(s.nAll, 'Spiel', 'Spiele')} bisher auf ±${fmt(sData || 9, 1)}. Mit jedem Spiel zählen die Ergebnisse mehr.</span>

function gkpOver(d, g) {
  const sum = {};
  Object.entries(g.gkp || {}).forEach(([id, v]) => {
    if (!id || !isNum(v)) return;
    let t = d.teams.findIndex(x => x.includes(id));
    const ev = (g.ev || []).filter(e => e.id === id && e.t >= 0);
    if (t !== g.a && t !== g.b && ev.length) t = ev[ev.length - 1].t;
    if (t !== g.a && t !== g.b) return;
    sum[t] = (sum[t] || 0) + +v;

  if (over.length) { r.err = `Torzeit über 100 %: ${over.join(' · ')}. Bitte unter „Besetzung und Umstellungen“ korrigieren.`; render(); return; }

    a: g.a, b: g.b, ga: g.ga, gb: g.gb, approx: !!g.approx && (isNum(g.ga) || (TENDS.includes(g.tend) && Analysis.tdOk(g))), min: g.min,
    tend: isNum(g.ga) ? '' : TENDS.includes(g.tend) ? g.tend : '', tn: !isNum(g.ga) && TENDS.includes(g.tend) && isNum(g.tn) ? g.tn : null, td: !isNum(g.ga) && TENDS.includes(g.tend) && Analysis.tdOk(g) ? +g.td : null,
    fit: isNum(g.ga) || TENDS.includes(g.tend) ? g.fit || '' : '', luck: isNum(g.ga) || TENDS.includes(g.tend) ? g.luck || '' : '',
    ev: (g.ev || []).filter(e => e.id && known(e.id) && (e.t === -1 || e.t === g.a || e.t === g.b)).map(e => ({ at: e.at, id: e.id, t: e.t, ...(e.t >= 0 && e.late ? { late: true } : {}) })),
    gkp: Object.fromEntries(Object.entries(g.gkp || {}).filter(([id, v]) => id && known(id) && isNum(v) && +v > 0)),
    tired: (g.tired || []).filter(t => t === g.a || t === g.b)

  if (games.some(g => g.a === g.b)) { r.err = 'Ein Spiel braucht zwei verschiedene Teams.'; render(); return; }
  if (games.some(g => isNum(g.ga) !== isNum(g.gb))) { r.err = 'Bitte bei jedem Spiel die Tore beider Teams eintragen.'; render(); return; }
  // Einspringer von außen brauchen einen Eintrag im Schnappschuss (mit ihren heutigen Werten)

  if (games.some(g => !Analysis.gameParts({ teams: d.teams, snap: snapX }, g, SPORT).length)) { r.err = 'Durch die Umstellungen hätte ein Team in einem Spiel keine Spieler mehr.'; render(); return; }

  let seed = 11;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const poisson = l => { const L = Math.exp(-Math.max(0.05, l)); let k = 0, q = 1; do { k++; q *= rnd(); } while (q > L); return k - 1; };
  const truth = { Tim: 1.5, Sarah: 1, Felix: -1 }, truthHall = { Lena: 1.8 }, truthGk = { Kai: -3.5 };
  const regular = S.players.filter(p => p.status === 'active');
  const keepDay = S.day, keepResult = S.result;
  const today = new Date(isoToday() + 'T12:00:00');
  const OUT = { surface: 'kunstrasen', size: 'mittel', goal: 'mittel', ground: 'gut' }, HALL = { surface: 'halle', size: 'klein', goal: 'klein', weather: 'drinnen' };
  let nOut = 0;
  const round = (dt, hall, games) => {
    const date = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    const pres = regular.filter(() => rnd() < 0.85);
    if (pres.length < 10) return;
    const wx = hall ? null : (() => { const rain = rnd() < 0.38, temp = Math.round(9 + rnd() * 10); return { temp, rain: rain ? Math.round((0.6 + rnd() * 4) * 10) / 10 : 0, wind: Math.round(5 + rnd() * 25), gust: 0, code: rain ? 61 : temp > 15 ? 1 : 3, at: dt.getTime(), src: 'Beispiel' }; })();
    S.day = { ...defaultDay(date), time: hall ? '20:00' : '19:00', place: hall ? 'Halle Nord' : 'Sportplatz', present: Object.fromEntries(pres.map(p => [p.id, true])),
      ctx: { ...SPORT.defaultCtx, ...(hall ? HALL : { ...OUT, weather: wx.rain >= 0.5 ? 'nass' : 'normal' }) } };
    const M = buildModel();
    if (M.errors.length) return;
    const r = Engine.solve(M, { tol: 10, budget: 120 });
    if (!r.feasible) return;
    const teams = teamsFromAssign(M, r.sols[0].a);
    const m = blankMatch(date);
    Object.assign(m, { teams, planned: clone(teams), snap: makeSnapshot(teams), status: 'done', remind: false, created: dt.getTime(), upd: dt.getTime(), place: S.day.place, time: S.day.time, weather: wx, minutes: hall ? 40 : 60 });
    m.pred = Analysis.prediction(m.snap, teams, SPORT);
    const tsnap = clone(m.snap);
    Object.keys(tsnap.pl).forEach(id => {
      const nm0 = byId(id).name, t = (truth[nm0] || 0) + (hall ? truthHall[nm0] || 0 : 0);
      if (t) tsnap.pl[id].s = clamp(tsnap.pl[id].s + t, 1, 10);
      if (truthGk[nm0] && isNum(tsnap.pl[id].g)) tsnap.pl[id].g = clamp(tsnap.pl[id].g + truthGk[nm0], 1, 10);
    });
    // Tore nach demselben Modell wie die Auswertung: Toranteil σ(γ · Unterschied / mittlere Stärke)
    const tv = Analysis.strengths(tsnap, teams, SPORT, {}), p = Analysis.sigma(ANALYSIS_DEFAULTS.gamma * (tv[0] - tv[1]) / ((tv[0] + tv[1]) / 2));
    const per = hall ? 6 : wx.rain >= 0.5 ? 7.5 : 9.5;
    m.games = Array.from({ length: games }, () => ({ a: 0, b: 1, ga: poisson(per * p), gb: poisson(per * (1 - p)), tend: '', min: hall ? 20 : 60, x: [] }));
    // Verschiedene Arten, ein Ergebnis einzutragen
    // Nur bei trockenem Wetter, damit „Wetter und Tore“ genug genaue Regenspiele hat
    if (!hall && wx.rain < 0.5) {
      nOut++;
      if ([5, 8, 13].includes(nOut) && m.games[0].ga === m.games[0].gb) m.games[0].ga++;
      const g = m.games[0], w = g.ga >= g.gb ? 'a' : 'b', d = Math.abs(g.ga - g.gb);
      if (nOut === 3 || nOut === 11) { g.approx = true; }
      else if (nOut === 5 && d > 0) { g.tend = w + (d >= 3 ? '2' : '1'); g.ga = null; g.gb = null; }
      else if (nOut === 8 && d > 0) { g.tend = w + (d >= 3 ? '2' : '1'); g.td = d; g.tn = null; g.ga = null; g.gb = null; }
      else if (nOut === 13 && d > 0) { g.tend = w + (d >= 3 ? '2' : '1'); g.td = d; g.tn = g.ga + g.gb; g.ga = null; g.gb = null; }
      else if (nOut === 9) { m.exclude = true; m.fb.note = 'Spaßspiel: Jung gegen Alt'; }
    }
    teams.flat().forEach(id => {
      const t = truth[byId(id).name];
      if (t && rnd() < 0.35) m.fb.marks.push({ id, d: Math.sign(t) });
    });
    S.matches.push(m);
  };
  for (let w = 22; w >= 1; w--) {
    const mon = new Date(today.getTime() - w * 7 * 864e5);
    round(mon, false, 1);
    if (w % 2 === 0) round(new Date(mon.getTime() + 3 * 864e5), true, 2);
  }
  // Beispiel: Runden auf verschiedene Arten entstanden, bei Kapitänswahl hat der Stärkste im Team gewählt
  S.matches.filter(m => m.status === 'done').sort((a, b) => a.date.localeCompare(b.date)).forEach((m, i) => {
    const k = i % 6;
    m.how = k === 1 || k === 4 ? 'captains' : k === 3 ? 'random' : k === 5 ? 'self' : 'app';
    m.pickers = m.how === 'captains' ? m.teams.map(t => t.slice().sort((a, b) => ((m.snap.pl[b] || {}).s || 0) - ((m.snap.pl[a] || {}).s || 0))[0] || '') : [];
    m.lead = m.how === 'self' ? (i % 12 === 5 ? 'Trainer Klaus' : (m.teams[0] || [])[0] || '') : '';
  });
  S.day = keepDay; S.result = keepResult;
  S.places = cleanPlaces(['Sportplatz', 'Halle Nord']);
}

/* Infotexte als Stichpunkte: jeder Satz wird ein Punkt (Abkürzungen wie „z. B.“ trennen nicht) */
const SENT_RE = /(?<!\b(?:z|B|d|h|u|a|bzw|ca|evtl|ggf|inkl|vgl|Nr|max|min|bspw|usw|etc|o)\.)(?<=[.!?…])\s+(?=[A-ZÄÖÜ„(0-9])/u;
function setPopText(pop, txt) {
  const parts = str(txt).split(SENT_RE).map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) { pop.textContent = txt; return; }
  pop.innerHTML = '<ul class="poplist">' + parts.map(x => `<li>${esc(x.replace(/\.$/, ''))}</li>`).join('') + '</ul>';
}

  quickAdd: () => 'Einen Namen pro Zeile oder mit Komma getrennt. Eine Zahl dahinter ist die Stärke: 5–6 = Durchschnitt der Gruppe. Ohne Zahl gilt 5 – ändern geht jederzeit unter „Spieler“.',
  strength: () => 'Wie gut jemand im Vergleich zu eurer Gruppe ist. 5–6 = Durchschnitt, 2–3 = die Schwächsten, 8–9 = die Stärksten. Es kommt nur auf die Abstände an, nicht auf die genaue Zahl.',
  pct: () => 'So weit liegen die Teams auseinander. Die Teamstärke ist ungefähr die Summe der Stärken – ein fester Torwart und sehr starke Spieler zählen etwas mehr. Unter 3 % sind die Teams praktisch gleich stark.',
  result: () => 'Die Tore jedes Spiels eintragen. Mehrere Spiele am selben Tag: „+ weiteres Spiel“. Speichern geht auch ohne Ergebnis – die Runde wartet dann darauf.',
  rounds: () => 'Jede Runde, in der Teams gebildet wurden. Antippen öffnet sie zum Eintragen oder Ändern.',
  expect: () => 'So ausgeglichen waren die Teams beim Bilden. Je kleiner der Unterschied, desto knapper sollte das Spiel werden – Zufall gehört aber immer dazu.'

/* ============================================================

   Ohne Server: Der Link enthält nach dem # die Namen (nur kodiert, nicht verschlüsselt) – dieser Teil
   wird nie an einen Server geschickt. Die Befragten schicken einen kurzen Text-Code zurück (z. B. per

   Code: FTU1-<Umfrage>-<wer>-<selbst>-<Werte>-<Prüfsumme>, nur Kleinbuchstaben, Ziffern und „-“,

/* ---------- Daten im Projekt ---------- */

    if (!players.length) return null;
    seen.add(v.id);

    const byWho = new Map();
    (Array.isArray(v.responses) ? v.responses : []).forEach(r => {
      if (!r || typeof r !== 'object' || !/^(p[0-9a-z]{1,3}|n[a-z2-7]{1,240})$/.test(str(r.who))) return;
      const x = { who: r.who, name: str(r.name).slice(0, 60) || '?', at: isNum(r.at) ? +r.at : Date.now(), self: cv(r.self), vals: Array.from({ length: n }, (_, k) => cv(Array.isArray(r.vals) ? r.vals[k] : null)), on: r.on !== false, code: str(r.code).slice(0, 600) };

/* Adresse der App für den Link: online die aktuelle Seite, als Datei geöffnet die hinterlegte Online-Adresse */
function svBase() {

/* Kompakter Link: WhatsApp verlinkt sehr lange Adressen nicht vollständig. Deshalb so kurz wie möglich:
   Buchstaben bleiben Buchstaben (nur verschoben, damit die Namen nicht direkt lesbar sind), Leerzeichen wird „-“,
   jedes andere Zeichen „0“ + 4 Zeichen (Unicode-Nummer, Basis 36); Felder getrennt durch „1“.
   Der Link ist damit etwa so lang wie die Namen selbst. Die Begrüßung steht in der Nachricht, nicht im Link. */

/* Nachricht zum Link (WhatsApp, Teilen, Kopieren) */
function svMsg(sv) {

const svDate = ts => new Date(ts).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric', year: 'numeric' });
const svWhoName = (sv, who) => { if (who[0] === 'p') { const x = sv.players[parseInt(who.slice(1), 36)]; return x ? x.name : '?'; } try { return svText(b32dec(who.slice(1))).slice(0, 60); } catch (e) { return '?'; } };

/* ---------- Antwort-Code ---------- */
function svMakeCode(sid, who, self, vals) {

/* Beliebigen Text (mehrere Nachrichten, ganzer Chat) nach Codes durchsuchen */

    const mm = /^ftu1-([a-z0-9]{6})-(p[0-9a-z]{1,3}|n[a-z2-7]{1,240})-([a-sz])-([a-sy-z]{1,200})-([a-z0-9]{4})/.exec(raw);

    if (svSum(body) !== sum) { out.bad.push({ head, why: 'Prüfsumme stimmt nicht' }); continue; }

  P.found.forEach(f => {

    if (!sv) { res.foreign++; return; }
    const n = sv.players.length;
    if (f.vs.length !== n) { res.wrongLen++; return; }
    if (f.who[0] === 'p' && !(parseInt(f.who.slice(1), 36) < n)) { res.wrongLen++; return; }

/* ---------- Auswertung ----------
   1. Strenge ausgleichen: Versatz je Bewerter = Median seiner Abweichungen von den (bereinigten) Werten der anderen,
      über die Spieler, die er bewertet hat. Nur verschoben, nicht gestreckt; mehrmals wiederholt.
   2. Je Spieler: Median der bereinigten Stimmen (bei 1–2 Stimmen der Mittelwert), Spannweite, uneinig ja/nein.
   3. Auf deine Skala übertragen: linear, sodass Mittelwert und Streuung deinen aktuellen Bewertungen entsprechen. */

  const off = R.map(() => 0);

  if (sv.opt.adj && R.length >= 2) {
    // Einer nach dem anderen (nicht alle gleichzeitig) – so pendeln die Werte nicht hin und her
    for (let it = 0; it < 8; it++) {
      V.forEach((row, r) => {
        const d = [];
        row.forEach((x, j) => { if (x == null) return; const others = []; V.forEach((row2, r2) => { if (r2 !== r && row2[j] != null) others.push(adjAt(r2, j)); }); if (others.length) d.push(x - svMed(others)); });

    xs.sort((a, b) => a - b);

/* ============================================================

    <div class="row">${seg('svFilter', [['all', 'Alle'], ['diff', `Abweichung ab 1 (${rowsAll.filter(x => x.d != null && Math.abs(x.d) >= 1).length})`], ['split', `uneinig (${rowsAll.filter(x => x.split).length})`]], filt, '', 'pill wrap')}</div>
    <p class="small muted svlegend"><span><i class="lg own"></i> deine Bewertung</span><span><i class="lg grp"></i> Gruppe</span><span><i class="lg dot"></i> einzelne Stimmen</span>${nPick ? '<span><i class="lg new"></i> neu</span>' : ''}</p>
    <ul class="svres">${rows.map(x => {
      const pk = picks[x.id], tv = pk ? target(x, pk) : null, weak = x.n > 0 && x.n < 3;
      const dTxt = x.d == null ? '' : Math.abs(x.d) < 0.25 ? '<span class="svd ok">passt</span>' : `<span class="svd${Math.abs(x.d) >= 1 ? ' big' : ''}">${x.d > 0 ? '+' : '−'}${fmt(Math.abs(x.d), 1)}</span>`;
      return `<li class="${weak ? 'weak' : ''}${!x.n ? ' none' : ''}">
        <div class="svrtop"><b class="grow">${esc(ownName(x.id) || x.name)}</b>${x.split ? tag('uneinig', 't-split', 'Die Stimmen liegen weit auseinander') : ''}${dTxt}</div>
        ${x.n ? `<div class="svrmid">${svDotsHTML(x, x.own, tv)}<span class="svnums"><span title="deine Bewertung">${isNum(x.own) ? fmtS(x.own) : '–'}</span> → <b title="Gruppe">${fmt(x.val, 1)}</b></span></div>
        <div class="svrsub small muted">${plural(x.n, 'Stimme', 'Stimmen')}${weak ? ' – noch wenig belastbar' : ''}${x.n > 1 ? ` · von ${fmt(x.dots[0], 1)} bis ${fmt(x.dots[x.dots.length - 1], 1)}` : ''}${isNum(x.self) ? ` · Selbsteinschätzung ${fmtS(x.self)}` : ''}</div>
        <div class="svrpick">${seg('svPickRow', [['', 'behalten'], ...(isNum(x.own) ? [['mid', `Mitte ${fmtS(target(x, 'mid'))}`]] : []), ['grp', `Gruppe ${fmtS(target(x, 'grp'))}`]], pk || '', `data-id="${x.id}"`, 'pill wrap')}</div>` : '<div class="small muted">Keine Stimmen (alle „kann ich nicht beurteilen“).</div>'}</li>`;
    }).join('')}</ul>
    ${strong.length ? `<div class="row svbulk"><span class="small grow">Alle mit mindestens 1 Punkt Abweichung und 3 Stimmen (${strong.length}):</span><button type="button" class="btn sm" data-act="svBulk" data-v="mid">Mitte vormerken</button><button type="button" class="btn sm" data-act="svBulk" data-v="grp">Gruppe vormerken</button></div>` : ''}
    <div class="svapply${nPick ? ' on' : ''}"><span class="grow small">${nPick ? `${plural(nPick, 'Änderung', 'Änderungen')} vorgemerkt – der grüne Punkt zeigt den neuen Wert.` : 'Je Spieler „Mitte“ oder „Gruppe“ wählen, dann hier übernehmen. Nichts ändert sich automatisch.'}</span>${nPick ? '<button type="button" class="btn sm ghost" data-act="svPickClear">verwerfen</button>' : ''}<button type="button" class="btn sm primary" data-act="svApply"${nPick ? '' : ' disabled'}>Übernehmen</button></div>`;
  const msgTxt = svMsg(sv);
  const armedSv = ui.arm === 'svDrop:' + sv.id;
  return sheetWrap(`${head('Gruppenmeinung')}
    ${L.length > 1 ? `<div class="row"><span class="lbl">Umfrage</span><select data-ch="svSel" aria-label="Umfrage wählen">${L.map(x => `<option value="${x.id}"${x.id === sv.id ? ' selected' : ''}>vom ${svDate(x.created)} · ${plural(x.responses.length, 'Antwort', 'Antworten')}</option>`).join('')}</select></div>` : ''}
    <details class="field svsec" data-sec="svLink"${ui.open.svLink || !sv.responses.length ? ' open' : ''}><summary><b>1. Link teilen</b> <span class="small muted">· ${plural(sv.players.length, 'Spieler', 'Spieler')} · vom ${svDate(sv.created)}</span></summary>
      ${link ? `<div class="svlinkbox"><input type="text" readonly id="svLinkIn" value="${esc(link)}" aria-label="Umfrage-Link"></div>
      <div class="row"><a class="btn sm primary" href="https://wa.me/?text=${encodeURIComponent(msgTxt)}" target="_blank" rel="noopener">WhatsApp</a>${navigator.share ? '<button type="button" class="btn sm" data-act="svShareLink">Teilen …</button>' : ''}<button type="button" class="btn sm" data-act="svCopyLink">Kopieren</button><a class="btn sm ghost" href="${esc(link)}" target="_blank" rel="noopener">Selbst ausfüllen</a></div>
      ${link.length > 700 ? '<p class="small muted">Der Link ist lang (viele Spieler). Lässt er sich in WhatsApp nicht ganz antippen, öffnet sich nur die Startseite – dort können die Mitspieler die Nachricht unter „Bewertungs-Link einfügen“ einsetzen. Steht so auch in der Nachricht.</p>' : ''}
      <p class="small muted">Tipp: Füll die Umfrage selbst aus, bevor du dir die Ergebnisse ansiehst – dann zählt deine Meinung unbeeinflusst mit.</p>` : '<p class="small errtxt">Kein Link möglich: Die App ist als Datei geöffnet. Öffne sie über ihre Internetadresse.</p>'}</details>
    <div class="field"><label class="lbl" for="svPaste">2. Antworten einfügen</label>
      <textarea id="svPaste" data-in="svPaste" rows="3" placeholder="Nachrichten mit „FTU1-…“ hier einfügen – auch mehrere auf einmal oder ein ganzer Chat.">${esc(U.paste || '')}</textarea>
      <div class="row"><button type="button" class="btn sm primary" data-act="svRead"${str(U.paste) ? '' : ' disabled'}>Einlesen</button>${U.msg ? `<span class="small ${U.msgBad ? 'errtxt' : ''}">${esc(U.msg)}</span>` : ''}</div>
      ${U.bad && U.bad.length ? `<ul class="small errtxt svbad">${U.bad.map(b => `<li>${esc(b.head || 'Code')}: ${esc(b.why)} – bitte noch einmal schicken lassen</li>`).join('')}</ul>` : ''}</div>
    ${sv.responses.length ? `<details class="field svsec" data-sec="svResp"${ui.open.svResp ? ' open' : ''}><summary><b>Antworten (${sv.responses.length})</b> <span class="small muted">· ${plural(E.nResp, 'zählt', 'zählen')} mit</span></summary><ul class="rules svresp">${resp}</ul></details>` : ''}
    <div class="field"><span class="lbl">3. Vergleich: du und die Gruppe</span>${resTable}</div>
    <div class="row svfoot"><button type="button" class="btn sm ghost" data-act="svView" data-v="new">Neue Umfrage</button><span class="grow"></span><button type="button" class="btn sm ${armedSv ? 'danger armed' : 'ghost danger'}" data-act="svDrop">${armedSv ? 'Umfrage mit allen Antworten löschen?' : 'Umfrage löschen'}</button></div>`, 'svTitle', 'svClose');
}
/* Wert übernehmen. Wird die Stärke aus Fähigkeiten berechnet, wandern alle bewerteten Fähigkeiten gleichmäßig mit
   (Stärken und Schwächen bleiben erhalten); an den Grenzen 1–10 kann der Zielwert dann knapp verfehlt werden. */
function svApplyOne(p, v, when) {
  const real = () => Engine.effective(p, SPORT, S.settings.attrW, S.settings.autoStrength);
  const extra = { isNew: p.isNew, rated: p.rated, autoStrength: p.autoStrength };
  const old = p.strength, oldEff = effOf(p).strength, oldAttrs = { ...p.attrs }, top = p.star ? 15 : 10;
  v = clamp(svR2(v), 1, top);
  const e0 = real();
  if (e0.auto && Object.keys(p.attrs).length) {
    const delta = v - e0.strength;
    Object.keys(p.attrs).forEach(k => { p.attrs[k] = clamp(svR2(+p.attrs[k] + delta), 1, 10); });
    p.strength = clamp(svR2((isNum(p.strength) ? +p.strength : 5) + delta), 1, top);
  } else p.strength = v;
  markRated(p);
  const now = effOf(p).strength;
  S.log.push({ id: uid(), at: Date.now(), src: 'own', kind: 'player', target: p.id, field: 'strength', old, new: p.strength, oldAttrs, extra, label: `${nameAny(p.id)}: Stärke ${fmtV(oldEff)} → ${fmtS(now)} (Umfrage vom ${when})` });
  return Math.abs(now - v) > 0.26 ? { name: disp(p), want: v, got: now } : null;
}
Object.assign(A, {
  svOpen: () => { ui.svy = { view: '', sel: null, picks: {} }; render(); },
  svClose: () => { ui.svy = null; render(); },
  svView: el => { ui.svy.view = el.dataset.v; ui.svy.pick = null; render(); },
  svPick: el => { const U = ui.svy; U.pick[el.dataset.id] = !U.pick[el.dataset.id]; render(); },
  svPickAll: el => { const U = ui.svy; Object.keys(U.pick).forEach(k => { U.pick[k] = el.dataset.v === '1'; }); render(); },
  svCreate: () => {
    const U = ui.svy, pl = S.players.filter(p => p.status !== 'archived' && U.pick[p.id]).sort(sortByLabel);
    if (pl.length < 3) return;
    const sv = { id: svNewId(), created: Date.now(), title: str(S.name).slice(0, 60) || 'Faire Teams', text: str(U.text).slice(0, SV_MAX_TEXT), players: pl.map(p => ({ id: p.id, name: disp(p) })), opt: { adj: true, scale: true }, responses: [] };
    if (!Array.isArray(S.surveys)) S.surveys = [];
    S.surveys.push(sv);
    S.surveys = S.surveys.slice(-20);
    ui.svy = { view: '', sel: sv.id, picks: {} }; ui.open.svLink = true;
    render(); toast('Umfrage erstellt – jetzt den Link teilen.');
  },
  svShareLink: async () => { const sv = svCur(); if (!sv) return; try { await navigator.share({ text: svMsg(sv) }); } catch (e) { /* abgebrochen */ } },
  svCopyLink: () => { const sv = svCur(); if (sv) copyText(svMsg(sv), 'Nachricht mit Link kopiert.'); },
  svRead: () => {
    const U = ui.svy, r = svIngest(U.paste);
    const parts = [];
    if (r.add.length) parts.push(`${plural(r.add.length, 'Antwort', 'Antworten')} neu (${r.add.join(', ')})`);
    if (r.upd.length) parts.push(`aktualisiert: ${r.upd.join(', ')}`);
    if (r.same) parts.push(`${r.same} schon vorhanden`);
    if (r.foreign) parts.push(`${r.foreign} gehör${r.foreign === 1 ? 't' : 'en'} zu einer anderen Umfrage`);
    if (r.wrongLen) parts.push(`${r.wrongLen} passt nicht zur Spielerliste`);
    if (r.bad.length) parts.push(`${r.bad.length} fehlerhaft`);
    U.msg = parts.length ? parts.join(' · ') + '.' : 'Keine Codes gefunden. Es müssen Nachrichten mit „FTU1-…“ sein.';
    U.msgBad = !r.add.length && !r.upd.length && !r.same; U.bad = r.bad;
    if (r.add.length || r.upd.length) { U.paste = ''; U.sel = r.sid; U.picks = {}; }
    render();
  },
  svRespOn: el => { const sv = svCur(), r = sv && sv.responses.find(x => x.who === el.dataset.who); if (r) { r.on = !r.on; render(); } },
  svRespDel: el => {
    const sv = svCur(), k = 'svDel:' + el.dataset.who;
    if (ui.arm !== k) { ui.arm = k; render(); return; }
    ui.arm = null; remember('Antwort gelöscht');
    sv.responses = sv.responses.filter(x => x.who !== el.dataset.who); render();
    toast('Antwort gelöscht.', { label: 'Rückgängig', act: 'undo' });
  },
  svOpt: el => { const sv = svCur(); sv.opt[el.dataset.k] = !sv.opt[el.dataset.k]; render(); },
  svFilter: el => { ui.svy.filter = el.dataset.v; render(); },
  svPickRow: el => { const P = ui.svy.picks; if (el.dataset.v) P[el.dataset.id] = el.dataset.v; else delete P[el.dataset.id]; render(); },
  svBulk: el => {
    const sv = svCur(), E = svEval(sv, svOwn), P = ui.svy.picks;
    E.rows.forEach(x => { const own = svOwn(x.id); if (byId(x.id) && x.n >= 3 && isNum(own) && Math.abs(x.val - own) >= 1) P[x.id] = el.dataset.v; });
    render();
  },
  svPickClear: () => { ui.svy.picks = {}; render(); },
  svApply: () => {
    const sv = svCur(), E = svEval(sv, svOwn), P = ui.svy.picks, when = svDate(sv.created);
    const todo = E.rows.filter(x => P[x.id] && x.n && byId(x.id));
    if (!todo.length) return;
    remember('Werte aus der Umfrage übernommen');
    const miss = [];
    todo.forEach(x => {
      const own = svOwn(x.id), v = P[x.id] === 'grp' ? svR2(x.val) : svR2(isNum(own) ? (own + x.val) / 2 : x.val);
      const m = svApplyOne(byId(x.id), v, when); if (m) miss.push(m);
    });
    ui.svy.picks = {};
    render();
    toast(`${plural(todo.length, 'Wert', 'Werte')} übernommen.${miss.length ? ` ${miss.map(m => `${m.name}: erreicht ${fmtS(m.got)} statt ${fmtS(m.want)} (Fähigkeiten an der Grenze)`).join('; ')}.` : ''}`, { label: 'Rückgängig', act: 'undo' });
  },
  svDrop: () => {
    const sv = svCur(), k = 'svDrop:' + sv.id;
    if (ui.arm !== k) { ui.arm = k; render(); return; }
    ui.arm = null; remember('Umfrage gelöscht');
    S.surveys = S.surveys.filter(x => x.id !== sv.id); ui.svy = S.surveys.length ? { view: '', sel: null, picks: {} } : null; render();
    toast('Umfrage gelöscht.', { label: 'Rückgängig', act: 'undo' });
  }
});
Object.assign(CH, { svSel: el => { ui.svy.sel = el.value; ui.svy.picks = {}; render(); } });
Object.assign(IN, {
  svText: el => { ui.svy.text = el.value.slice(0, SV_MAX_TEXT); },
  svPaste: el => { ui.svy.paste = el.value; const b = document.querySelector('[data-act="svRead"]'); if (b) b.disabled = !str(el.value); }
});
// Wird ein Umfrage-Link im selben Tab geöffnet (oder verlassen), neu laden – Umfrage und App laufen getrennt
window.addEventListener('hashchange', e => { const was = /#(survey=[a-z2-7]|ftu[a-z2-7]|ft2[A-Za-z0-9-])/.test(e.oldURL || ''), now = SV_HASH.test(location.hash); if (was || now) location.reload(); });

/* Notausgang: Ist der Link in WhatsApp nicht vollständig antippbar, öffnet sich nur die Startseite.
   Dort lässt sich die ganze Nachricht einfügen; der Link wird herausgesucht und die Umfrage geöffnet. */
function svGotHTML(open) {
  return `<details class="svgot"${open ? ' open' : ''}><summary>📩 Bewertungs-Link einfügen</summary>
    <p class="small muted">Du hast einen Link zum Bewerten bekommen, aber es öffnet sich nur diese Seite? Halte die Nachricht in WhatsApp gedrückt → „Kopieren“ und füge sie hier ein.</p>
    <textarea id="svGotIn" rows="3" placeholder="Nachricht hier einfügen"></textarea>
    <div class="row"><button type="button" class="btn sm primary" data-act="svGotOpen">Bewertung öffnen</button>${ui.svGotErr ? `<span class="small errtxt">${esc(ui.svGotErr)}</span>` : ''}</div></details>`;
}
Object.assign(A, {
  svGotOpen: () => {
    const t = String(($('#svGotIn') || {}).value || '').replace(/\s+/g, '');
    const m = /#(ft2[A-Za-z0-9-]{8,}|ftu[a-z2-7]{8,}|survey=[a-z2-7]{8,})/.exec(t);
    if (!m) { ui.svGotErr = 'Darin steht kein Bewertungs-Link. Bitte die ganze Nachricht kopieren.'; render(); return; }
    ui.svGotErr = '';
    location.hash = '#' + m[1];   // löst das Neuladen im Umfrage-Modus aus
  }
});

$('#logo').innerHTML = `<img src="${LOGO_SRC}" alt="" width="34" height="34">`;
if (SV_MODE) svStart();
else {
  load();
  linkCurrentTeams();
  render();
}
// Vorhersagen, die zu einer anderen Rechenversion gehören, im Hintergrund aus den Schnappschüssen neu rechnen
setTimeout(() => {
  let n = 0;
  S.matches.forEach(m => { if (m.snap && !(m.pred && m.pred.v === Analysis.VERSION)) { ensurePred(m); n++; } });
  if (n) render();
}, 80);
</script>
